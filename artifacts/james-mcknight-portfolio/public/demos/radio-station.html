  border: none; border-bottom: 1px solid var(--light-gray); padding: 6px 0 8px; margin: 4px 0 14px;
  background: transparent; color: var(--ink);
}
.para-d-name:focus { outline: none; border-bottom-color: var(--teal); }
.para-f { margin-bottom: 12px; }
.para-f label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.para-d-in, .para-d-note {
  width: 100%; font-family: inherit; font-size: 13px; padding: 8px 11px;
  border: 1px solid var(--light-gray); border-radius: 9px; background: var(--surface); color: var(--ink);
}
.para-d-note { resize: vertical; line-height: 1.5; }
.para-open { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--teal); margin-bottom: 12px; }
.para-linknotes { display: flex; flex-direction: column; gap: 5px; margin: 6px 0 4px; }
.para-linknote {
  text-align: left; font-family: inherit; font-size: 12.5px; color: var(--teal); cursor: pointer;
  background: var(--off-white); border: 1px solid var(--light-gray); border-radius: 8px; padding: 6px 10px;
}
.para-linknote:hover { background: var(--pale-teal); }
.para-d-btns, .nb-btns { display: flex; gap: 8px; margin-top: 16px; }
.tool-btn.danger { color: #b23b2a; }
.para-d-created { font-size: 11px; color: var(--mid-gray); margin-top: 10px; }

/* Notebook specifics */
.nb-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.nb-tag {
  font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--light-gray); border-radius: 11px; padding: 4px 11px;
}
.nb-tag.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.nb-archtoggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.nb-archtoggle input { width: 14px; height: 14px; accent-color: var(--teal); cursor: pointer; }
.nb-pin { color: #e0a92a; font-size: 12px; }
.nb-card-when { font-size: 10.5px; color: var(--mid-gray); font-weight: 700; }
.nb-title {
  font-family: "Fraunces", Georgia, serif; font-size: 21px; font-weight: 700; width: 100%;
  border: none; padding: 2px 0 6px; background: transparent; color: var(--ink);
}
.nb-title:focus { outline: none; }
.nb-meta { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--light-gray); margin-bottom: 12px; }
.nb-metabtn {
  font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-2);
  background: var(--off-white); border: 1px solid var(--light-gray); border-radius: 9px; padding: 4px 11px;
}
.nb-metabtn.on { background: #fdf3d8; border-color: #e6cf95; color: #8a6a12; }
.nb-when { font-size: 11px; color: var(--mid-gray); }
.nb-body {
  width: 100%; min-height: 340px; font-family: inherit; font-size: 14px; line-height: 1.65;
  border: none; resize: vertical; background: transparent; color: var(--ink);
}
.nb-body:focus { outline: none; }
.nb-tags, .nb-para {
  width: 100%; font-family: inherit; font-size: 12.5px; padding: 7px 11px; margin-top: 10px;
  border: 1px solid var(--light-gray); border-radius: 9px; background: var(--surface); color: var(--ink);
}
body.zen-bg .para-detail, body.zen-bg .nb-edit,
body.zen-bg .para-card, body.zen-bg .nb-card { background: rgba(var(--panel-rgb), var(--zen-alpha,.72)); }

/* Finished subtasks collapse away; this row brings them back */
.subs-done-row td { background: transparent; border-bottom: 1px solid var(--light-gray); padding: 3px 0; }
.subs-done-toggle {
  font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .2px;
  color: var(--text-3); background: transparent; border: none; cursor: pointer;
  padding: 3px 8px; border-radius: 7px;
}
.subs-done-toggle:hover { background: var(--off-white); color: var(--teal); }

/* Done-group review bar — filter/sort finished work by date and goal */
.done-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 14px; margin: 0 0 2px;
  background: var(--off-white); border-bottom: 1px solid var(--light-gray);
}
.done-lab { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); }
.done-sel {
  font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink);
  background: var(--surface); border: 1px solid var(--light-gray); border-radius: 8px; padding: 4px 9px; cursor: pointer;
}
.done-sel:hover { border-color: var(--sage); }
.done-sum { font-size: 12px; color: var(--text-2); margin-left: 4px; }
.done-sum strong { color: var(--ink); font-weight: 800; }
.done-sum strong.ok { color: var(--green); }
.done-pillars { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.done-pchip {
  display: inline-flex; align-items: center; gap: 5px;

}
.done-pdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
body.zen-bg .done-bar { background: rgba(var(--panel-rgb), var(--zen-alpha,.6)); }
@media (max-width: 760px) { .done-pillars { margin-left: 0; } }

/* Data history browser */
.hb-modal { max-width: 720px; }
.hb-intro { font-size: 12.5px; color: var(--text-3); line-height: 1.55; margin-bottom: 14px; }
.hb-body { max-height: 60vh; overflow-y: auto; }
.hb-empty { font-size: 13px; color: var(--text-3); font-style: italic; padding: 10px 2px; }
.hb-key { border: 1px solid var(--light-gray); border-radius: 11px; margin-bottom: 12px; overflow: hidden; }
.hb-key-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 9px 13px; background: var(--off-white); border-bottom: 1px solid var(--light-gray); }
.hb-key-name { font-size: 13px; font-weight: 800; }
.hb-key-meta { font-size: 11px; color: var(--text-3); font-weight: 600; }
.hb-vers { display: flex; flex-direction: column; }
.hb-ver { display: flex; align-items: center; gap: 10px; padding: 6px 13px; font-size: 12.5px; border-bottom: 1px solid #f0efec; }
.hb-ver:last-child { border-bottom: none; }
.hb-ver-when { font-weight: 700; min-width: 128px; }
.hb-ver-size { font-size: 11.5px; font-weight: 700; color: var(--text-3); }
.hb-ver-size.hb-bigger { color: var(--green); }
.hb-ver-size.hb-smaller { color: #c0782a; }
.hb-ver-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  color: var(--teal); background: var(--pale-teal); border-radius: 9px; padding: 1px 8px; }
.hb-btn { font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--teal);
  background: var(--surface); border: 1px solid var(--light-gray); border-radius: 8px; padding: 3px 10px; }
.hb-btn:hover { background: var(--off-white); }
.hb-btn.warn { color: #b23b2a; }
.hb-pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px;
  line-height: 1.5; background: #fbfaf7; border: 1px solid var(--light-gray); border-radius: 9px;
  padding: 12px; max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }

/* Role ladder — completed work counted against each role's expectations */
.gd-ladder { margin: 4px 0 16px; }
.gd-ladder-h { font-size: 10.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
.gd-ladder-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 780px) { .gd-ladder-grid { grid-template-columns: repeat(2, 1fr); } }
.gd-ladder-cell {
  background: var(--surface); border: 1px solid var(--light-gray); border-top: 3px solid var(--sage);
  border-radius: 11px; padding: 10px 13px 11px; cursor: pointer; transition: box-shadow .12s, border-color .12s;
}
.gd-ladder-cell:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.gd-ladder-cell.on { border-top-color: var(--teal); box-shadow: 0 2px 10px rgba(0,133,155,.16); }
.gd-ladder-role { font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--text-2); }
.gd-ladder-done { font-family: "Fraunces", Georgia, serif; font-size: 27px; font-weight: 700; line-height: 1.1; color: var(--teal); }
.gd-ladder-sub { font-size: 11px; color: var(--text-3); margin-bottom: 7px; }
.gd-ladder-bar { height: 5px; background: var(--light-gray); border-radius: 3px; overflow: hidden; }
.gd-ladder-fill { height: 100%; background: var(--green); border-radius: 3px; }
.gd-ladder-cov { font-size: 10.5px; color: var(--text-3); margin-top: 4px; font-weight: 600; }
body.zen-bg .gd-ladder-cell { background: rgba(var(--panel-rgb), var(--zen-alpha,.72)); }

/* Bulk role assignment */
.ra-wrap { max-width: 1100px; }
.ra-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.ra-h2 { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
.ra-sub { font-size: 13px; color: var(--text-3); margin-top: 4px; max-width: 720px; line-height: 1.5; }
.ra-head .tool-btn { margin-left: auto; flex-shrink: 0; }
.ra-tally { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 900px) { .ra-tally { grid-template-columns: repeat(2, 1fr); } }
.ra-tally-cell { background: var(--surface); border: 1px solid var(--light-gray); border-top: 3px solid var(--light-gray); border-radius: 11px; padding: 10px 12px; }
.ra-tally-cell.good { border-top-color: var(--green); }
.ra-tally-cell.under { border-top-color: #d9b96a; }
.ra-tally-cell.over { border-top-color: #c0782a; }
.ra-tally-cell.unassigned { border-top-color: var(--mid-gray); background: var(--off-white); }
.ra-tally-role { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--text-2); }
.ra-tally-n { font-family: "Fraunces", Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.15; }
.ra-tally-t { font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.ra-tally-gist { font-size: 11px; color: var(--text-3); line-height: 1.45; margin-top: 6px; }
.ra-actions { display: flex; gap: 8px; margin-bottom: 12px; }
.ra-list { border: 1px solid var(--light-gray); border-radius: 11px; overflow: hidden; background: var(--surface); }
.ra-row { display: grid; grid-template-columns: 1fr 190px 110px 170px; gap: 10px; align-items: center;
  padding: 7px 13px; border-bottom: 1px solid #f0efec; font-size: 12.5px; }
.ra-row:last-child { border-bottom: none; }
.ra-row.none { background: #fdfbf6; }
.ra-hdr { background: var(--off-white); font-size: 10.5px; font-weight: 800; letter-spacing: .5px;
  text-transform: uppercase; color: var(--text-3); }
.ra-name { font-weight: 700; }
.ra-badge { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  color: var(--teal); background: var(--pale-teal); border-radius: 8px; padding: 1px 6px; margin-left: 7px; }
.ra-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.ra-muted { color: var(--mid-gray); }
.ra-sugbtn { font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--teal);
  background: var(--off-white); border: 1px dashed var(--sage); border-radius: 8px; padding: 2px 9px; }
.ra-sugbtn:hover { background: var(--pale-teal); }
.ra-c-set { display: flex; gap: 4px; }
.ra-pick { font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--light-gray); border-radius: 7px; padding: 3px 8px; min-width: 30px; }
.ra-pick:hover { background: var(--off-white); }
.ra-pick.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.gd-role-assign { font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--teal);
  background: var(--surface); border: 1px dashed var(--sage); border-radius: 14px; padding: 4px 12px; margin-left: 8px; }
.gd-role-assign:hover { background: var(--off-white); }
body.zen-bg .ra-list, body.zen-bg .ra-tally-cell { background: rgba(var(--panel-rgb), var(--zen-alpha,.72)); }

/* ============================== Career Notes ============================== */
.cn-wrap { max-width: 1180px; margin: 0 auto; padding: 4px 8px 48px; }
.cn-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.cn-h2 { font-family: "Fraunces", Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: -.4px; }
.cn-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }
.cn-headbtns { margin-left: auto; display: flex; gap: 8px; }
.cn-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.cn-tab { display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 13px;
  font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--light-gray);
  border-radius: 10px; padding: 7px 14px; cursor: pointer; }
.cn-tab:hover { background: var(--off-white); }
.cn-tab.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.cn-tab-n { font-size: 10.5px; font-weight: 800; background: rgba(0,0,0,.08); border-radius: 9px; padding: 1px 7px; }
.cn-tab.on .cn-tab-n { background: rgba(255,255,255,.25); }
.cn-empty { font-size: 12.5px; color: var(--text-3); font-style: italic; padding: 10px 2px; }
.cn-more { font-size: 11.5px; color: var(--text-3); padding: 6px 2px; }
.cn-sec-h { font-family: "Fraunces", Georgia, serif; font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.cn-sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.cn-sec-head .tool-btn { margin-left: auto; }
.cn-sec-note { font-size: 11.5px; color: var(--text-3); font-style: italic; margin-bottom: 10px; }
.cn-chip { font-size: 10.5px; font-weight: 700; color: var(--text-2); background: var(--off-white);
  border-radius: 10px; padding: 2px 9px; }
.cn-when { font-size: 10.5px; color: var(--mid-gray); font-weight: 700; }
.cn-vdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* Capture */
.cn-prompt { display: flex; align-items: center; gap: 10px; background: var(--cream);
  border: 1px solid #e6d9bd; border-radius: 11px; padding: 10px 14px; margin-bottom: 12px; }
.cn-prompt-q { font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 700; flex: 1; }
.cn-prompt-cycle { font-family: inherit; font-size: 14px; cursor: pointer; color: #8a6a12;
  background: rgba(255,255,255,.6); border: 1px solid #e0cf9d; border-radius: 8px; padding: 2px 9px; }
.cn-addrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.cn-in { flex: 1; min-width: 220px; font-family: inherit; font-size: 14px; padding: 9px 13px;
  border: 1px solid var(--light-gray); border-radius: 9px; background: var(--surface); color: var(--ink); }
.cn-sel { font-family: inherit; font-size: 12.5px; padding: 8px 10px; border: 1px solid var(--light-gray);
  border-radius: 9px; background: var(--surface); color: var(--ink); cursor: pointer; }
.cn-sel.cn-need { border-color: #c0782a; background: #fdf1e6; }
.cn-val { display: flex; gap: 4px; }
.cn-valbtn { font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--light-gray); border-radius: 8px; padding: 6px 11px; }
.cn-valbtn.on { background: var(--vc); border-color: var(--vc); color: #fff; }
.cn-feed { display: flex; flex-direction: column; gap: 6px; }
.cn-entry { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--light-gray);
  border-left: 4px solid var(--vc); border-radius: 10px; padding: 9px 13px; }
.cn-entry-main { flex: 1; min-width: 0; }
.cn-entry-text { font-size: 13.5px; cursor: text; }
.cn-entry-meta { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.cn-x { font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--teal);
  background: transparent; border: none; border-radius: 7px; padding: 3px 7px; }
.cn-x:hover { background: var(--off-white); }
.cn-x.danger { color: #b23b2a; font-size: 15px; line-height: 1; }

/* Dimensions */
.cn-dimgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 820px) { .cn-dimgrid { grid-template-columns: 1fr; } }
.cn-dimcard { background: var(--surface); border: 1px solid var(--light-gray); border-radius: 12px; padding: 13px 15px; }
.cn-dim-h { display: flex; align-items: baseline; gap: 10px; }
.cn-dim-name { font-size: 14px; font-weight: 800; flex: 1; }
.cn-dim-n { font-size: 10.5px; color: var(--mid-gray); font-weight: 700; }
.cn-dim-hint { font-size: 11.5px; color: var(--text-3); font-style: italic; margin-top: 2px; }
.cn-sublabel { display: inline-block; font-size: 10.5px; font-weight: 700; color: #6f8f96;
  background: var(--pale-teal); border-radius: 9px; padding: 1px 8px; margin: 6px 5px 0 0; }
.cn-tally { display: flex; height: 7px; border-radius: 4px; overflow: hidden; margin: 10px 0 5px; background: var(--light-gray); }
.cn-tally-seg { height: 100%; }
.cn-tally-seg.empty { background: var(--light-gray); }
.cn-tally-key { font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.cn-read { width: 100%; font-family: inherit; font-size: 12.5px; padding: 7px 10px; margin-top: 9px;
  border: 1px solid var(--light-gray); border-radius: 8px; background: var(--surface-2); color: var(--ink); }
.cn-caret { font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-2);
  background: transparent; border: none; padding: 7px 0 0; }
.cn-caret:hover { color: var(--teal); }
.cn-dim-entries { display: flex; flex-direction: column; gap: 5px; margin-top: 8px;
  border-top: 1px solid #f0efec; padding-top: 8px; }
.cn-dim-entry { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.cn-dim-entry-t { flex: 1; }

/* Ikigai */
.cn-ikigrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
@media (max-width: 980px) { .cn-ikigrid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .cn-ikigrid { grid-template-columns: 1fr; } }
.cn-ikicard { background: var(--surface); border: 1px solid var(--light-gray); border-top: 3px solid var(--sage);
  border-radius: 12px; padding: 12px 14px; }
.cn-iki-h { font-size: 13px; font-weight: 800; }
.cn-iki-hint { font-size: 11px; color: var(--text-3); font-style: italic; margin-bottom: 8px; }
.cn-iki-stmt { width: 100%; font-family: inherit; font-size: 12.5px; line-height: 1.5; padding: 8px 10px;
  border: 1px solid var(--light-gray); border-radius: 8px; resize: vertical; background: var(--surface-2); color: var(--ink); }
.cn-iki-count { font-size: 10.5px; font-weight: 800; color: var(--teal); margin: 8px 0 4px; }
.cn-iki-src { font-size: 10.5px; color: var(--text-3); font-style: italic; margin: 8px 0 4px; }
.cn-iki-list { display: flex; flex-direction: column; gap: 4px; }
.cn-iki-item { font-size: 11.5px; color: var(--text-2); background: var(--off-white); border-radius: 7px; padding: 4px 8px; }
.cn-ovgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
@media (max-width: 820px) { .cn-ovgrid { grid-template-columns: repeat(2, 1fr); } }
.cn-ov { background: var(--off-white); border: 1px dashed var(--light-gray); border-radius: 10px; padding: 9px 12px; }
.cn-ov.on { background: var(--pale-teal); border-style: solid; border-color: var(--cyan); }
.cn-ov-name { font-size: 12px; font-weight: 800; }
.cn-ov-parents { font-size: 10.5px; color: var(--text-3); }
.cn-ov-n { font-size: 11px; font-weight: 700; color: var(--teal); margin-top: 3px; }
.cn-ikigai-centre { background: linear-gradient(var(--pale-teal), #fff); border: 2px solid var(--cyan);
  border-radius: 12px; padding: 12px 15px; margin-bottom: 16px; }
.cn-ikigai-h { font-family: "Fraunces", Georgia, serif; font-size: 16px; font-weight: 700; color: var(--teal); }
.cn-ikigai-item { font-size: 12.5px; margin-top: 4px; }
.cn-starlist { display: flex; flex-direction: column; gap: 6px; }
.cn-star { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--light-gray);
  border-radius: 9px; padding: 7px 12px; }
.cn-star-t { flex: 1; font-size: 12.5px; min-width: 0; }
.cn-star-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.cn-starbtn { font-family: inherit; font-size: 10.5px; font-weight: 700; cursor: pointer; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--light-gray); border-radius: 12px; padding: 2px 9px; }
.cn-starbtn.on { background: var(--sage); border-color: var(--sage); color: #fff; }

/* Principles + terms */
.cn-prlist, .cn-termlist { display: flex; flex-direction: column; gap: 6px; }
.cn-pr, .cn-term { display: flex; align-items: center; gap: 10px; background: var(--surface);
  border: 1px solid var(--light-gray); border-radius: 10px; padding: 8px 13px; cursor: grab; }
.cn-pr.dragging, .cn-term.dragging { opacity: .45; }
.cn-pr.dragover, .cn-term.dragover { border-color: var(--teal); box-shadow: 0 -2px 0 var(--teal) inset; }
.cn-pr-n { font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 700; color: var(--sage); min-width: 20px; }
.cn-pr-t { flex: 1; font-size: 13px; font-weight: 600; cursor: text; }
.cn-pr-from { width: 190px; font-family: inherit; font-size: 11.5px; padding: 4px 9px;
  border: 1px solid var(--light-gray); border-radius: 7px; background: var(--surface-2); color: var(--text-2); }

/* Baseline + lock */
.cn-bllist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.cn-bl { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--light-gray);
  border-radius: 10px; padding: 9px 13px; }
.cn-bl-date { font-family: "Fraunces", Georgia, serif; font-size: 14px; font-weight: 700; }
.cn-bl-meta { font-size: 11.5px; color: var(--text-3); flex: 1; }
.cn-bl-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  color: var(--teal); background: var(--pale-teal); border-radius: 9px; padding: 1px 8px; }
.cn-lock { background: var(--off-white); border: 1px dashed var(--sage); border-radius: 12px; padding: 15px 17px; }
.cn-lock-h { font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 700; }
.cn-lock-why { font-size: 12.5px; color: var(--text-2); line-height: 1.55; margin: 6px 0 12px; max-width: 640px; }
.cn-lock-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.cn-lock-cell { background: var(--surface); border: 1px solid var(--light-gray); border-radius: 10px; padding: 9px 14px; }
.cn-lock-cell.done { border-color: var(--green); }
.cn-lock-n { font-family: "Fraunces", Georgia, serif; font-size: 21px; font-weight: 700; }
.cn-lock-cell.done .cn-lock-n { color: var(--green); }
.cn-lock-l { font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.cn-lock-short { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.cn-lock-shortlab { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: var(--text-3); }
.cn-cmp { border: 1px solid var(--light-gray); border-radius: 11px; overflow: hidden; background: var(--surface); }
.cn-cmp-row { display: grid; grid-template-columns: 1.6fr .5fr 1.4fr .7fr; gap: 10px; align-items: center;
  padding: 7px 14px; border-bottom: 1px solid #f0efec; font-size: 12.5px; }
.cn-cmp-row:last-child { border-bottom: none; }
.cn-cmp-hdr { background: var(--off-white); font-size: 10.5px; font-weight: 800; letter-spacing: .5px;
  text-transform: uppercase; color: var(--text-3); }
.cn-cmp-name { font-weight: 700; }
.cn-cmp-net { display: flex; align-items: center; gap: 8px; }
.cn-cmp-bar { height: 7px; border-radius: 4px; min-width: 2px; }
.cn-cmp-pct { font-size: 11px; font-weight: 700; color: var(--text-2); }
body.zen-bg .cn-dimcard, body.zen-bg .cn-ikicard, body.zen-bg .cn-entry,
body.zen-bg .cn-pr, body.zen-bg .cn-term, body.zen-bg .cn-bl, body.zen-bg .cn-star,
body.zen-bg .cn-cmp { background: rgba(var(--panel-rgb), var(--zen-alpha,.72)); }

/* Career Notes — narrow screens: stack the capture row instead of overflowing */
@media (max-width: 620px) {
  .cn-addrow { flex-direction: column; align-items: stretch; }
  .cn-in { min-width: 0; width: 100%; }
  .cn-sel, .cn-addrow .tool-btn { width: 100%; }
  .cn-val { display: grid; grid-template-columns: repeat(3, 1fr); }
  .cn-entry { flex-direction: column; align-items: flex-start; gap: 7px; }
  .cn-entry-meta { flex-wrap: wrap; }
  .cn-pr, .cn-term { flex-wrap: wrap; }
  .cn-pr-from { width: 100%; }
  .cn-cmp-row { grid-template-columns: 1.4fr .5fr 1fr .7fr; font-size: 11.5px; padding: 6px 9px; }
  .cn-star { flex-direction: column; align-items: flex-start; }
}

/* Notebook shell — Notes / Ideas / Career Notes share one tab */

<script>
/* ---- demo backend ---- */
/* Tuned In — demo.js
   A portfolio demo: the real app running with no server behind it.

   Tuned In is normally Flask + SQLite. A portfolio page is static, so this
   file stands in for the backend — an in-memory database plus a router that
   intercepts api() and answers every /api/* call the frontend makes. The UI
   code is byte-identical to the real app; only its server is different.

   The automations engine is ported rather than stubbed, because "change a
   status and the task files itself" is the thing worth showing. Copy-to-group,
   move-to-group, linked-copy dedup, parked cleanup, done-collapse and
   done-date stamping all behave as they do on the real backend.

   Nothing persists: a refresh restores the seed, which is what a demo wants.
   Load order matters: this must come BEFORE boot.js. */

const DEMO_MODE = true;
// No /static in a single file: the banner icon is inlined by the builder.
const DEMO_ICON = "/bonsai-logo.png";
const DONE_DATE_KEY = "__done_date";

function dUid() { return Math.random().toString(36).slice(2, 12); }
function dToday() { return new Date().toISOString().slice(0, 10); }
function dShift(days) {
  const x = new Date();
  x.setDate(x.getDate() + days);
  return x.toISOString().slice(0, 10);
}

// ---- Seed -----------------------------------------------------------------
// Neutral content: this is a public demo, so nothing here is real work.
const DB = (() => {
  // Columns, groups, automations and palettes are copied from the real board, so
  // the demo behaves like the app in daily use rather than like a fresh install.
  // Two priority labels named colleagues; those are generalised here.
  const columns = [
    { id: "c_name",     name: "Task",       type: "text",     is_primary: 1, position: 0,  width: 233 },
    { id: "c_status",   name: "Status",     type: "status",   is_primary: 0, position: 1,  width: 119 },
    { id: "c_owner",    name: "Owner",      type: "person",   is_primary: 0, position: 2,  width: 103 },
    { id: "c_due",      name: "Due Date",   type: "date",     is_primary: 0, position: 3,  width: 185 },
    { id: "c_priority", name: "Priority",   type: "priority", is_primary: 0, position: 4,  width: 204 },
    { id: "c_notes",    name: "Notes",      type: "text",     is_primary: 0, position: 5,  width: 119 },
    { id: "c_hours",    name: "Est. Hours", type: "number",   is_primary: 0, position: 6,  width: 60  },
    { id: "c_pillar",   name: "Pillar",     type: "goal",     is_primary: 0, position: 7,  width: 233 },
    { id: "c_goal",     name: "Goal",       type: "goal",     is_primary: 0, position: 8,  width: 200 },
    { id: "c_win",      name: "Win",        type: "check",    is_primary: 0, position: 9,  width: null },
    { id: "c_loss",     name: "Loss",       type: "check",    is_primary: 0, position: 10, width: null },
  ];


  const T = (group, name, status, owner, due, prio, hours, extra) => Object.assign({
    id: dUid(), group_name: group, parent_id: null, link_id: null,

      "Someone Else' Court": 3, "Holding Pattern / Pending": 4, "Personal Tasks": 5,
      Done: 6, Networking: 7, "personal development": 8,
    },
  };
})();

// ---- The automations engine, ported ---------------------------------------
function dApplyAutomations(cells, group) {
  const t = dToday();
  for (const a of DB.automations) {
    if (!a.enabled) continue;
    if (String(cells[a.trigger_col] ?? "") !== String(a.trigger_val)) continue;
    if (a.action_type === "setToday") cells[a.action_col] = t;
    else if (a.action_type === "setValue") cells[a.action_col] = a.action_val;
    else if (a.action_type === "clear") cells[a.action_col] = "";
    else if (a.action_type === "moveToGroup" && a.action_val) group = a.action_val;
  }
  return { cells, group };
}
function dStampDone(cells) {
  const isDone = DB.columns.some((c) => c.type === "status" && String(cells[c.id] ?? "") === "Done");
  if (isDone) { if (!cells[DONE_DATE_KEY]) cells[DONE_DATE_KEY] = dToday(); }
  else delete cells[DONE_DATE_KEY];
  return cells;
}
function dDeleteTree(id) {
  DB.tasks.filter((t) => t.parent_id === id).forEach((k) => dDeleteTree(k.id));
  DB.tasks = DB.tasks.filter((t) => t.id !== id);
}
function dLinkedCopy(taskId, dest) {
  const src = DB.tasks.find((t) => t.id === taskId);
  if (!src || src.parent_id) return;
  if (!src.link_id) src.link_id = dUid();
  if (DB.tasks.some((t) => t.link_id === src.link_id && t.group_name === dest && !t.parent_id)) return;
  const pc = DB.columns.find((c) => c.is_primary);
  const nm = String(src.cells[pc.id] || "").trim().toLowerCase();
  if (nm && DB.tasks.some((t) => t.group_name === dest && !t.parent_id &&
      String(t.cells[pc.id] || "").trim().toLowerCase() === nm)) return;
  DB.tasks.push(Object.assign({}, src, {
    id: dUid(), group_name: dest, cells: JSON.parse(JSON.stringify(src.cells)),
    position: DB.tasks.length, link_id: src.link_id,
  }));
}
function dSetCell(taskId, colId, value) {
  const row = DB.tasks.find((t) => t.id === taskId);
  if (!row) return null;
  const col = DB.columns.find((c) => c.id === colId);
  const isStatus = col && col.type === "status";
  const becomingDone = isStatus && String(value) === "Done";
  const sibs = row.link_id ? DB.tasks.filter((t) => t.link_id === row.link_id) : [row];
  sibs.forEach((s) => {
    s.cells[colId] = value;
    const r = dApplyAutomations(s.cells, s.group_name);
    dStampDone(r.cells);
    s.group_name = r.group;
  });
  // dedup placements that collided in the same group
  if (row.link_id) {
    const seen = {};
    DB.tasks.filter((t) => t.link_id === row.link_id && !t.parent_id).forEach((s) => {
      if (!(s.group_name in seen)) { seen[s.group_name] = s.id; return; }
      let drop = s.id;
      if (drop === taskId) { drop = seen[s.group_name]; seen[s.group_name] = s.id; }
      dDeleteTree(drop);
    });
  }
  // copy-to-group
  DB.automations.forEach((a) => {
    if (!a.enabled || a.action_type !== "copyToGroup") return;
    if (String(row.cells[a.trigger_col] ?? "") !== String(a.trigger_val)) return;
    if (!a.action_val || a.action_val === row.group_name) return;
    dLinkedCopy(taskId, a.action_val);
  });
  // leaving a parked group
  if (isStatus) {
    const parked = {};
    DB.automations.forEach((a) => {
      if (a.enabled && a.action_type === "moveToGroup" && a.action_val && a.trigger_col === colId) {
        parked[a.action_val] = String(a.trigger_val);
      }
    });
    const lid = row.link_id;
    const places = lid ? DB.tasks.filter((t) => t.link_id === lid && !t.parent_id) : [row];
    const stale = places.filter((pl) => pl.group_name in parked && parked[pl.group_name] !== String(value));
    if (stale.length && places.length - stale.length >= 1) stale.forEach((pl) => dDeleteTree(pl.id));
  }
  // done-collapse
  if (becomingDone && row.link_id) {
    DB.tasks.filter((t) => t.link_id === row.link_id && t.id !== taskId).forEach((o) => dDeleteTree(o.id));
    row.link_id = null;
  }
  return DB.tasks.find((t) => t.id === taskId) || row;
}

// ---- Router ----------------------------------------------------------------
function dPoints() {
  const sc = DB.columns.find((c) => c.type === "status");
  const done = DB.tasks.filter((t) => sc && String(t.cells[sc.id] || "") === "Done").length;
  const spent = DB.redemptions.reduce((n, r) => n + (r.cost || 0), 0);
  return { earned: done * 10, spent, balance: done * 10 - spent };
}
function dState() {
  return JSON.parse(JSON.stringify({
    columns: DB.columns, tasks: DB.tasks, automations: DB.automations, palette: DB.palette,
    group_colors: DB.group_colors, group_order: DB.group_order, settings: DB.settings,
    rewards: DB.rewards, redemptions: DB.redemptions, projects: DB.projects,
    imp_columns: DB.imp_columns, imp_tasks: DB.imp_tasks, points: dPoints(),
    prompts: DB.prompts, server_build: EXPECTED_SERVER_BUILD,
  }));
}

async function demoApi(path, opts) {
  const method = (opts && opts.method) || "GET";
  const body = opts && opts.body ? JSON.parse(opts.body) : {};
  const m = (re) => path.match(re);
  let x;

  if (path === "/api/state") return dState();

  if ((x = m(/^\/api\/tasks\/([^/]+)\/cell$/)) && method === "PATCH") {

  }

    const src = DB.tasks.find((t) => t.id === x[1]);

  }
  if ((x = m(/^\/api\/tasks\/([^/]+)\/group$/))) {

    return { ok: true };
  }

    return { ok: true };
  }
  if ((x = m(/^\/api\/tasks\/([^/]+)\/timer$/))) return { ok: true };
  if (path === "/api/tasks/cleanup-empty") return { ok: true, removed: 0 };

  if (path === "/api/settings" && method === "PATCH") {
    DB.settings[body.key] = String(body.value);
    return { ok: true, key: body.key, value: String(body.value) };
  }
  if (path.startsWith("/api/settings/history")) return { ok: true, keys: [], versions: [] };
  if (path === "/api/settings/restore") return { ok: true };

  if (path.startsWith("/api/schedule")) {

      const b = Object.assign({ id: dUid(), auto: 0 }, body);

      return b;
    }
    if ((x = m(/^\/api\/schedule\/([^/?]+)$/)) && method === "DELETE") {
      DB.schedule = DB.schedule.filter((s) => s.id !== x[1]);
      return { ok: true };
    }
    if ((x = m(/^\/api\/schedule\/([^/?]+)$/)) && method === "PATCH") {
      const s = DB.schedule.find((y) => y.id === x[1]);
      if (s) Object.assign(s, body);
      return s || { ok: true };
    }
    if (path.startsWith("/api/schedule/autoplan")) {
      if (method === "DELETE") {
        const n = DB.schedule.filter((s) => s.auto).length;
        DB.schedule = DB.schedule.filter((s) => !s.auto);
        return { ok: true, removed: n };
      }
      const toMin = (s2) => { const [h, mm] = String(s2).split(":").map(Number); return h * 60 + mm; };
      const busy = DB.schedule.filter((s) => s.day === body.day)
        .map((s) => [toMin(s.start), toMin(s.start) + s.minutes]).sort((a, b2) => a[0] - b2[0]);
      let cur = toMin(body.window_start || "08:00");
      const end = toMin(body.window_end || "18:00");
      const gaps = [];
      busy.forEach(([a, b2]) => { if (a > cur) gaps.push([cur, Math.min(a, end)]); cur = Math.max(cur, b2); });
      if (cur < end) gaps.push([cur, end]);
      const placed = [], unplaced = [];
      (body.items || []).forEach((it) => {
        const mins = Math.max(15, Math.round((it.minutes || 30) / 15) * 15);
        const g = gaps.find((gg) => gg[1] - gg[0] >= mins);
        if (!g) { unplaced.push(it.label); return; }
        const st = g[0]; g[0] += mins;
        const blk = { id: dUid(), day: body.day, start: `${String(Math.floor(st / 60)).padStart(2, "0")}:${String(st % 60).padStart(2, "0")}`, minutes: mins, task_id: it.task_id, label: it.label, color: it.color, auto: 1 };
        DB.schedule.push(blk); placed.push(blk);

    if (path.startsWith("/api/schedule/clear-imported") || path.startsWith("/api/schedule/rescan")
        || path.startsWith("/api/schedule/import")) return { ok: true, added: 0 };
    const day = (path.match(/day=([^&]+)/) || [])[1];
    return { blocks: DB.schedule.filter((s) => !day || s.day === decodeURIComponent(day)) };
  }

  if (path === "/api/columns" && method === "POST") {
    const c = { id: "c_" + dUid(), name: body.name || "New", type: body.type || "text", is_primary: 0, position: DB.columns.length, width: null };
    DB.columns.push(c); return c;
  }
  if ((x = m(/^\/api\/columns\/([^/]+)$/))) {
    if (method === "DELETE") { DB.columns = DB.columns.filter((c) => c.id !== x[1]); return { ok: true }; }
    const c = DB.columns.find((y) => y.id === x[1]);

  }
  if (path === "/api/columns/reorder") {

    return { ok: true };

  if (path === "/api/groups/color") { DB.group_colors[body.group] = body.color; return { ok: true }; }
  if (path === "/api/groups/rename") {

  if (path === "/api/imp/tasks" && method === "POST") {

    const t = { id: dUid(), group_name: body.group || "Improvements", position: DB.imp_tasks.length, cells: {} };
    t.cells[p.id] = (body.name || "New weakness");

    return JSON.parse(JSON.stringify(t));
  }
  if ((x = m(/^\/api\/imp\/tasks\/([^/]+)/))) {

    const t = DB.imp_tasks.find((y) => y.id === x[1]);

    return t || { ok: true };
  }
  if (path.startsWith("/api/imp/columns")) return { ok: true };

  if (path === "/api/projects" && method === "POST") {
    const p = Object.assign({ id: dUid(), name: body.name || "New project", status: "Idea", stack: "", repo: "", notes: "", todos: "[]", position: DB.projects.length, priority: "", pillar: "" }, body);
    DB.projects.push(p); return p;
  }
  if ((x = m(/^\/api\/projects\/([^/]+)/))) {
    if (method === "DELETE") { DB.projects = DB.projects.filter((p) => p.id !== x[1]); return { ok: true }; }
    const p = DB.projects.find((y) => y.id === x[1]);
    if (p) Object.assign(p, body);
    return p || { ok: true };
  }
  if (path === "/api/prompts" && method === "POST") {
    const p = Object.assign({ id: dUid(), title: body.title || "New prompt", body: "", tags: "", fields: "{}", position: DB.prompts.length, priority: "", uses: 0 }, body);
    DB.prompts.push(p); return p;
  }
  if ((x = m(/^\/api\/prompts\/([^/]+)/))) {
    if (method === "DELETE") { DB.prompts = DB.prompts.filter((p) => p.id !== x[1]); return { ok: true }; }
    const p = DB.prompts.find((y) => y.id === x[1]);
    if (p) Object.assign(p, body);
    return p || { ok: true };
  }

  if (path === "/api/rewards" && method === "POST") {
    const r = Object.assign({ id: dUid(), name: body.name || "Reward", cost: body.cost || 10, position: DB.rewards.length }, body);
    DB.rewards.push(r); return r;
  }
  if ((x = m(/^\/api\/rewards\/([^/]+)/))) {
    if (method === "DELETE") { DB.rewards = DB.rewards.filter((r) => r.id !== x[1]); return { ok: true }; }
    const r = DB.rewards.find((y) => y.id === x[1]);
    if (r) Object.assign(r, body);
    return r || { ok: true };
  }
  if (path === "/api/redeem") {
    DB.redemptions.push({ id: dUid(), reward_id: body.reward_id, cost: body.cost || 0, ts: new Date().toISOString() });
    return { ok: true, points: dPoints() };

  if (path.startsWith("/api/palette")) {
    if (method === "POST") {
      const p = { id: dUid(), label: body.label, color: body.color, position: (DB.palette[body.kind] || []).length };
      (DB.palette[body.kind] = DB.palette[body.kind] || []).push(p);

    }
    if ((x = m(/^\/api\/palette\/([^/]+)$/)) && method === "DELETE") {
      Object.keys(DB.palette).forEach((k) => { DB.palette[k] = DB.palette[k].filter((p) => p.id !== x[1]); });
      return { ok: true };
    }
    if ((x = m(/^\/api\/palette\/([^/]+)$/))) {
      Object.keys(DB.palette).forEach((k) => {
        const p = DB.palette[k].find((y) => y.id === x[1]);
        if (p) Object.assign(p, body);
      });
      return { ok: true };
    }
    return { ok: true };
  }

  if (path.startsWith("/api/automations")) {
    if (method === "POST") {
      const a = Object.assign({ id: dUid(), enabled: 1, name: "New rule", trigger_col: "c_status", trigger_val: "", action_col: "c_due", action_type: "setToday", action_val: "", position: DB.automations.length }, body);
      DB.automations.push(a); return a;

    if ((x = m(/^\/api\/automations\/([^/]+)/))) {

  return { ok: true };
}

// ---- Surfaces hidden in the demo -------------------------------------------

// Goals sub-views the demo leaves out: they hold long-form personal writing

const GS_HIDDEN_SUBVIEWS = ["map", "improve", "os"];

function demoHideViews() {

// Anything that deep-links into a hidden view (the Goals → Vibe Coding shortcut,

function demoGuardSetView() {
  if (typeof window.setView !== "function") return;

document.addEventListener("DOMContentLoaded", () => {

<script>
/* ---- app.js ---- */
/* Tuned In — app.js
   Core — state, API + undo, loadState, mutations, helpers, cell renderers, per-task timers, estimate alarm
   Load order matters: see templates/index.html. Classic scripts share one global scope. */

/* ===========================================================
   Tuned In — frontend
   Talks to the Flask JSON API, renders Table / Kanban / Calendar.
   =========================================================== */

const CFG = window.RS_CONFIG;
const GROUP_COLORS = ["#00859b", "#77b28c", "#38a66f", "#00bfb8", "#bce194"];
// Curated brand swatches offered in the group color picker
const GROUP_SWATCHES = ["#00859b", "#00bfb8", "#77b28c", "#38a66f", "#bce194", "#cce7eb", "#e2725b", "#7a1f1f", "#b3b3b3", "#1c1c1e"];

let STATE = { columns: [], tasks: [], automations: [], palette: { status: [], priority: [] }, group_colors: {}, group_order: {} };

// Which parent tasks are expanded to show their subtasks (persists in-session).
const expandedParents = new Set();
// Parents whose finished subtasks are being shown anyway. Done subtasks
// collapse out of the way by default (see hideDoneSubs); this set is the
// per-parent "show them anyway" override and is deliberately NOT persisted —
// each session starts tidy.
const revealDoneSubs = new Set();
// Global switch for that behavior, persisted in settings.
function hideDoneSubs() {
  const v = STATE.settings && STATE.settings.hide_done_subs;
  return v === undefined || v === null || v === "" ? true : v === "1";
}
// Which groups are collapsed (header only, table hidden).
const collapsedGroups = new Set();

// the other way (ephemeral, like group/subtask collapse). Effective state for a
// cell = global XOR override.
let goalCellsCollapsed = false;        // hydrated from settings in loadState()
const goalCellOverrides = new Set();   // keys "<taskId>:<colId>" flipped vs global
function goalCellKey(taskId, colId) { return taskId + ":" + colId; }
function goalCellIsCollapsed(taskId, colId) {
  const flipped = goalCellOverrides.has(goalCellKey(taskId, colId));
  return goalCellsCollapsed ? !flipped : flipped;
}

// Tracks the task currently being dragged (id + its origin group) so we can

let dragState = null;
// Tracks a whole-group drag (reordering groups on the board).
let groupDragState = null;
// Tracks a column-header drag (reordering columns).
let colDragState = null;
// Tracks a Kanban lane-header drag (reordering status lanes).
let laneDragState = null;

// Subtask helpers
function childrenOf(parentId) {
  return STATE.tasks.filter((t) => t.parent_id === parentId);
}
function isDoneStatus(task) {
  const statusCol = STATE.columns.find((c) => c.type === "status");
  if (!statusCol) return false;
  return task.cells[statusCol.id] === "Done";
}
// Children of a parent, minus the finished ones when they're collapsed away.
function visibleChildrenOf(parentId) {
  const kids = childrenOf(parentId);
  if (!hideDoneSubs() || revealDoneSubs.has(parentId)) return kids;
  return kids.filter((k) => !isDoneStatus(k));
}

  return childrenOf(parentId).length - visibleChildrenOf(parentId).length;
}

  const kids = childrenOf(parentId);

  const done = kids.filter(isDoneStatus).length;
  return { done, total: kids.length };

// palette based on the group's index among all groups.
function groupColor(name, indexFallback) {

  if (custom) return custom;
  return GROUP_COLORS[indexFallback % GROUP_COLORS.length];
}
let currentView = (() => {
  try { return localStorage.getItem("rs_view") || "table"; } catch (e) { return "table"; }
})();
let goalsSubview = "dash";
let gsDetailId = null;
let todaySub = "day";
let calWeekStart = (() => { const d = new Date(); d.setDate(d.getDate() - d.getDay()); d.setHours(0, 0, 0, 0); return d; })();

function normalizeFoldedView() {

  else if (currentView === "improve") { currentView = "goals"; goalsSubview = "improve"; }
  else if (currentView === "calendar") { currentView = "today"; todaySub = "month"; }

let search = "";

const $ = (sel, root = document) => root.querySelector(sel);
const todayStr = () => new Date().toISOString().slice(0, 10);

// Palette-driven lookups (status/priority values are now user-defined data).
function paletteFor(type) {
  if (type === "status") return STATE.palette.status || [];
  if (type === "priority") return STATE.palette.priority || [];

}
function colorOf(type, value) {

}
function valuesFor(type) {

// Severity rank for a priority value = its position in the palette (lower = higher severity).
function priorityRank(value) {

  const idx = list.findIndex((p) => p.label === value);

// Composite ordering used by Sort: completed tasks sink to the bottom, then by
// priority severity, with current position as a stable tiebreaker. Applies to
// top-level rows AND to subtasks among their siblings (they share the per-group
// sort), so "Done at the bottom" holds at every level.
function taskSortCompare(a, b) {
  const prioCol = STATE.columns.find((c) => c.type === "priority");
  const da = isDoneStatus(a) ? 1 : 0;
  const db = isDoneStatus(b) ? 1 : 0;
  if (da !== db) return da - db;                    // not-done before done
  if (prioCol) {
    const pa = priorityRank(a.cells[prioCol.id]);
    const pb = priorityRank(b.cells[prioCol.id]);
    if (pa !== pb) return pa - pb;                  // higher priority first
  }
  const dua = dueRank(a), dub = dueRank(b);
  if (dua !== dub) return dua < dub ? -1 : 1;       // within a priority: earlier due date first, no date last
  return (a.position || 0) - (b.position || 0);     // stable
}
// The board's due-date column: a date column named like "due", else the first
// date column. Detected by type + name, never by a hardcoded id.
function dueDateCol() {
  const dates = STATE.columns.filter((c) => c.type === "date");
  return dates.find((c) => /due/i.test(c.name || "")) || dates[0] || null;
}
// Sortable due-date key for a task: the ISO yyyy-mm-dd string (ISO dates compare
// correctly as strings), or a far-future sentinel for blank/invalid so undated
// tasks sink below dated ones within the same priority.
function dueRank(t) {
  const dc = dueDateCol();
  const v = dc ? String(t.cells[dc.id] || "").trim() : "";
  return /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : "9999-12-31";
}
function primaryCol() {
  return STATE.columns.find((c) => c.is_primary) || STATE.columns[0];
}

// Tasks parked with someone/something else stay on the board but are kept OUT
// of the planning views (Today schedule, Eisenhower matrix). A task counts as
// parked if its GROUP or its STATUS mentions any of these — so renamed groups
// (e.g. "Holding Pattern / Pending") and status-only cases are both caught.
const PLANNING_EXCLUDED_TERMS = [
  "holding pattern", "someone else", "in other court", "waiting for feedback",
];
function excludedFromPlanning(t) {
  const g = String(t.group_name || "").toLowerCase();
  if (PLANNING_EXCLUDED_TERMS.some((term) => g.includes(term))) return true;
  const sc = STATE.columns.find((c) => c.type === "status");
  if (sc) {
    const sv = String(t.cells[sc.id] || "").toLowerCase();
    if (PLANNING_EXCLUDED_TERMS.some((term) => sv.includes(term))) return true;
  }
  return false;
}

// ---------------- Column widths ----------------
// A column's display width in px: its saved width, or a type-based default.
function colWidth(col) {
  if (col.width != null && col.width !== "") return Number(col.width);
  if (col.is_primary) return 260;
  switch (col.type) {
    case "status": return 150;
    case "priority": return 130;
    case "date": return 150;
    case "number": return 110;
    case "person": return 150;
    default: return 170;
  }
}

// Drag the grip on a column header's right edge to resize that column. The new
// width is applied live to every group table (so they stay aligned) and saved.
function attachColumnResize(grip, th, col) {
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    const startW = th.getBoundingClientRect().width;
    document.body.classList.add("col-resizing");

    const onMove = (ev) => {
      const newW = Math.max(60, Math.min(900, Math.round(startW + (ev.clientX - startX))));
      // Apply live to ALL tables' matching column (header + first body row is enough
      // for fixed layout, but set every header th for crisp feedback)
      document.querySelectorAll("table.fixed-cols").forEach((tbl) => {
        const ths = tbl.querySelectorAll("thead th");
        // column index = position among data columns + 1 (handle cell is first)
        const idx = STATE.columns.findIndex((c) => c.id === col.id) + 1;
        if (ths[idx]) ths[idx].style.width = newW + "px";
        // also set the matching col in the first body row for fixed-layout stability
      });
      grip._lastW = newW;
    };
    const onUp = async () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.body.classList.remove("col-resizing");
      const finalW = grip._lastW;
      if (finalW && finalW !== Math.round(startW)) {
        col.width = finalW;  // update local state
        try {
          await api(`/api/columns/${col.id}`, { method: "PATCH", body: JSON.stringify({ width: finalW }) });
        } catch (err) { console.error("[col resize] save failed:", err); }
        render();  // re-render so every table picks up the saved width cleanly
      }
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

// Drag a column header's ⠿ handle onto another header to reorder columns.
// The primary column is fixed in first place and isn't a drop target before it.
function attachColumnReorder(handle, th, col) {
  handle.addEventListener("dragstart", (e) => {
    colDragState = { id: col.id };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "col:" + col.id);
    th.classList.add("col-dragging");
  });
  handle.addEventListener("dragend", () => {
    th.classList.remove("col-dragging");
    document.querySelectorAll(".col-drop-before, .col-drop-after").forEach((n) =>
      n.classList.remove("col-drop-before", "col-drop-after"));
    colDragState = null;
  });
  // The whole th is a drop target while a column drag is active
  th.addEventListener("dragover", (e) => {
    if (!colDragState || colDragState.id === col.id || col.is_primary) return;
    e.preventDefault();
    const rect = th.getBoundingClientRect();
    const after = e.clientX > rect.left + rect.width / 2;
    th.classList.toggle("col-drop-after", after);
    th.classList.toggle("col-drop-before", !after);
  });
  th.addEventListener("dragleave", () => {
    th.classList.remove("col-drop-before", "col-drop-after");
  });
  th.addEventListener("drop", async (e) => {
    if (!colDragState || colDragState.id === col.id || col.is_primary) return;
    e.preventDefault();
    const rect = th.getBoundingClientRect();
    const after = e.clientX > rect.left + rect.width / 2;
    await reorderColumns(colDragState.id, col.id, after);
  });
}

// Move column `movedId` to before/after `targetId`, keeping the primary column
// pinned first, then persist the new order.
async function reorderColumns(movedId, targetId, after) {
  const order = STATE.columns.map((c) => c.id);
  const moved = order.splice(order.indexOf(movedId), 1)[0];
  let idx = order.indexOf(targetId);
  if (after) idx += 1;
  order.splice(idx, 0, moved);
  // Keep the primary column first no matter what
  const primary = STATE.columns.find((c) => c.is_primary);
  if (primary) {
    const pi = order.indexOf(primary.id);
    if (pi > 0) { order.splice(pi, 1); order.unshift(primary.id); }
  }
  // Reorder STATE.columns to match + update positions locally
  STATE.columns.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  STATE.columns.forEach((c, i) => { c.position = i; });
  colDragState = null;
  render();
  try {
    await api("/api/columns/reorder", { method: "PATCH", body: JSON.stringify({ order }) });
  } catch (err) { console.error("[col reorder] save failed:", err); }
}

// ---------------- API ----------------
// ---------------- Undo / redo ----------------
const undoStack = [];
const redoStack = [];
const UNDO_LIMIT = 60;
let restoringSnapshot = false;  // guard so restore's own api calls don't snapshot

function snapshotState() {
  // Deep clone the parts /api/restore needs
  return JSON.stringify({
    columns: STATE.columns, tasks: STATE.tasks, automations: STATE.automations,
    palette: STATE.palette, group_colors: STATE.group_colors,
    group_order: STATE.group_order, settings: STATE.settings,
  });
}
let _lastSnapAt = 0;
function pushUndoSnapshot() {
  if (restoringSnapshot) return;
  const snap = snapshotState();
  const now = Date.now();
  // Coalesce: if the previous snapshot is identical OR was taken within a brief
  // window (same logical action that fired multiple API calls), don't stack a
  // second undo step.
  if (undoStack.length) {
    const top = undoStack[undoStack.length - 1];
    if (top === snap || (now - _lastSnapAt) < 350) {
      _lastSnapAt = now;
      redoStack.length = 0;
      return;
    }
  }
  undoStack.push(snap);
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  _lastSnapAt = now;
}
async function applySnapshot(snapJson) {
  restoringSnapshot = true;
  try {
    await api("/api/restore", { method: "POST", body: snapJson });
    await loadState();
  } finally {
    restoringSnapshot = false;
  }
}
async function doUndo() {
  if (undoStack.length === 0) return;
  redoStack.push(snapshotState());     // current → redo
  const prev = undoStack.pop();
  await applySnapshot(prev);
}
async function doRedo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapshotState());     // current → undo
  const next = redoStack.pop();
  await applySnapshot(next);
}

async function api(path, opts) {
  if (typeof DEMO_MODE !== 'undefined' && DEMO_MODE) return demoApi(path, opts);
  // Snapshot the pre-action state for undo on any mutating call (but not for
  // reads, and not for restore itself).
  const method = (opts && opts.method) || "GET";
  if (method !== "GET" && path !== "/api/restore" && path !== "/api/state" && !restoringSnapshot) {
    pushUndoSnapshot();
  }
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}
// Must match SERVER_BUILD in app.py for this release. If the running server
// reports a different build, the files were updated without restarting the
// server — show a clear banner instead of letting features fail mysteriously.
const EXPECTED_SERVER_BUILD = "2026-08-12-A";
function checkServerBuild() {
  if (typeof DEMO_MODE !== "undefined" && DEMO_MODE) return;
  const existing = document.getElementById("stale-server-banner");
  if (STATE.server_build === EXPECTED_SERVER_BUILD) { if (existing) existing.remove(); return; }
  if (existing) return;
  const banner = el("div", { id: "stale-server-banner", class: "stale-banner" },
    "Tuned In's files were updated, but the app is still running the old version. ",
    el("b", {}, "Close the Tuned In window and double-click the launcher again"),
    " to finish updating.");
  document.body.prepend(banner);
}

async function loadState() {
  STATE = await api("/api/state");
  goalCellsCollapsed = (STATE.settings && STATE.settings["goal_collapsed"]) === "true";
  updateCollapseGoalsBtn();    // reflect the Pillar/Idea collapse toggle
  applyDensity(getDensity());  // reflect any saved display-density setting
  applyHeaderSettings();       // reflect any saved header visibility settings
  if (typeof applyTheme === "function") applyTheme();
  checkServerBuild();          // warn if the server process is stale
  applyTabOrder();             // arrange tabs in the user's saved order
  updateAlarmToggle();         // reflect the alarm on/off setting
  applyZenBackdrop();          // reflect a saved zen-garden backdrop
  render();
  ensureTimerTick();           // keep running timers ticking live
}

// ---------------- Display density ----------------
// A single 0..100 slider value maps to a font scale and row padding.
const DENSITY_KEY = "density";
function getDensity() {
  const v = STATE.settings && STATE.settings[DENSITY_KEY];
  const n = v == null ? 40 : Number(v);   // default 40 ≈ "Normal"
  return isNaN(n) ? 40 : Math.max(0, Math.min(100, n));
}
function applyDensity(val) {
  // Map slider 0..100 → scale 0.85..1.45 and row padding 3px..14px
  const scale = 0.85 + (val / 100) * 0.60;
  const padY = 3 + (val / 100) * 11;
  document.documentElement.style.setProperty("--density-scale", scale.toFixed(3));
  document.documentElement.style.setProperty("--row-pad-y", padY.toFixed(1) + "px");
}

// ---------------- Mutations ----------------
async function updateCell(taskId, colId, value) {
  const resp = await api(`/api/tasks/${taskId}/cell`, {
    method: "PATCH",
    body: JSON.stringify({ col: colId, value }),
  });
  // If this task is linked to copies in other groups (or copies were just
  // collapsed because it was marked Done), the simplest correct refresh is to
  // reload the whole board so every copy reflects the change.
  if (resp.linked_changed || resp.collapsed) {
    await loadState();
    return;
  }
  const t = STATE.tasks.find((x) => x.id === taskId);
  if (t) {
    t.cells = resp.cells; // pick up automation side-effects on cells
    if (resp.group_name !== undefined) t.group_name = resp.group_name;
  }
  render();
}

// Shows a confirm dialog when an action would create a duplicate in a group.
// Resolves true if the user chooses "Add anyway", false on cancel.
function confirmDuplicate(info) {
  return new Promise((resolve) => {
    const reason = info.kind === "link"
      ? `This task is already in “${info.group}” (a linked copy of it lives there).`
      : `A task named “${info.name}” already exists in “${info.group}”.`;
    openModal("Possible duplicate", (body, close) => {
      body.append(el("p", { style: "margin-top:0;font-size:13px;color:var(--ink)" }, reason));
      body.append(el("p", { style: "font-size:12px;color:var(--mid-gray)" },
        info.kind === "link"
          ? "Adding it again would put two identical synced copies in the same group."
          : "You can keep both, or cancel to avoid a duplicate."));
      const btns = el("div", { style: "display:flex;gap:8px;justify-content:flex-end;margin-top:8px" });
      btns.append(el("button", { class: "tool-btn", onClick: () => { close(); resolve(false); } }, "Cancel"));
      btns.append(el("button", { class: "tool-btn accent-teal", onClick: () => { close(); resolve(true); } }, "Add anyway"));
      body.append(btns);
    });
  });
}

async function copyTaskToGroup(taskId, group, force = false) {
  const cleanGroup = (typeof group === "string" && group.trim() && group.trim() !== "undefined")
    ? group.trim() : null;
  if (!cleanGroup) return;
  const resp = await api(`/api/tasks/${taskId}/copy`, {
    method: "POST", body: JSON.stringify({ group: cleanGroup, force }),
  });
  if (resp && resp.needs_confirm) {
    const ok = await confirmDuplicate(resp);
    if (!ok) return;
    return copyTaskToGroup(taskId, cleanGroup, true);  // retry, forced
  }
  await loadState();  // new linked placement (+ any subtasks) — reload to show it
}
async function addTask(group, parentId = null) {
  // Defensive: never send undefined/null/"undefined" through — that path was
  // the source of an earlier display bug.
  const cleanGroup = (typeof group === "string" && group.trim() && group.trim() !== "undefined")
    ? group.trim()
    : "All Active Tasks";
  const payload = { group: cleanGroup };
  if (parentId) payload.parent_id = parentId;
  const t = await api("/api/tasks", { method: "POST", body: JSON.stringify(payload) });
  if (parentId) {
    expandedParents.add(parentId);  // reveal the new subtask immediately
    // The parent may have linked copies; the backend mirrors the subtask into
    // them, so reload to pick up those propagated subtasks.
    await loadState();
  } else {
    STATE.tasks.push(t);
    render();
  }
}
async function deleteTask(taskId) {
  await api(`/api/tasks/${taskId}`, { method: "DELETE" });
  // Drop the task and any of its subtasks from local state (backend cascades too)
  STATE.tasks = STATE.tasks.filter((t) => t.id !== taskId && t.parent_id !== taskId);
  expandedParents.delete(taskId);
  render();
}

// Delete a task INCLUDING its linked copies in other groups. Used from the
// planning views, where chips are deduped and stand for the logical task.
async function deleteTaskEverywhere(task) {
  const ids = STATE.tasks
    .filter((t) => !t.parent_id && (t.id === task.id || (task.link_id && t.link_id === task.link_id)))
    .map((t) => t.id);
  for (const id of ids) {
    await api(`/api/tasks/${id}`, { method: "DELETE" });
  }
  await loadState();
}

async function moveTaskToGroup(taskId, newGroup, force = false) {
  const cleanGroup = (typeof newGroup === "string" && newGroup.trim() && newGroup.trim() !== "undefined")
    ? newGroup.trim()
    : null;
  if (!cleanGroup) {
    console.warn("[moveTaskToGroup] refused — invalid group:", newGroup);
    return;
  }
  const resp = await api(`/api/tasks/${taskId}/group`, {
    method: "PATCH", body: JSON.stringify({ group: cleanGroup, force }),
  });
  if (resp && resp.needs_confirm) {
    const ok = await confirmDuplicate(resp);
    if (!ok) { render(); return; }   // re-render to snap a dragged row back home
    return moveTaskToGroup(taskId, cleanGroup, true);  // retry, forced
  }
  const t = STATE.tasks.find((x) => x.id === taskId);
  if (t) t.group_name = cleanGroup;
  render();
}

/**
 * Delete a group. If it has tasks, ask whether to delete them too or merge them
 * into a different group. Empty groups (none exist in our model — groups are
 * implicit on tasks — but just in case) are dismissed quietly.
 */
function deleteGroup(name) {
  const tasksInGroup = STATE.tasks.filter((t) => t.group_name === name);
  const others = [...new Set(STATE.tasks.map((t) => t.group_name))].filter((g) => g !== name);

  if (tasksInGroup.length === 0) return;

  openModal(`Delete group "${name}"?`, (body, close) => {
    body.append(el("p", { style: "margin-top:0;font-size:14px" },
      `This group contains ${tasksInGroup.length} task${tasksInGroup.length === 1 ? "" : "s"}. What should happen to them?`));

    // Option 1: merge into another existing group
    if (others.length > 0) {
      const mergeBox = el("div", { style: "background:var(--off-white);border-radius:8px;padding:12px;margin-bottom:10px" });
      mergeBox.append(el("div", { style: "font-weight:600;font-size:13px;margin-bottom:6px" }, "Move tasks to another group"));
      const row = el("div", { style: "display:flex;gap:8px;align-items:center" });
      const sel = el("select", { class: "sel", style: "flex:1" });
      others.forEach((g) => sel.append(el("option", { value: g }, g)));
      const goBtn = el("button", { class: "tool-btn accent-teal", onClick: async () => {
        await api("/api/groups/delete", { method: "POST", body: JSON.stringify({ name, mode: "merge", merge_into: sel.value }) });
        STATE.tasks.forEach((t) => { if (t.group_name === name) t.group_name = sel.value; });
        STATE.automations.forEach((a) => { if (a.action_type === "moveToGroup" && a.action_val === name) a.action_val = sel.value; });
        close(); render();
      } }, "Move & delete group");
      row.append(sel, goBtn);
      mergeBox.append(row);
      body.append(mergeBox);
    }

    // Option 2: delete the group and all its tasks
    const dangerBox = el("div", { style: "background:#fdecec;border-radius:8px;padding:12px;border:1px solid #f3c5c5" });
    dangerBox.append(el("div", { style: "font-weight:600;font-size:13px;margin-bottom:6px;color:#7a1f1f" }, "Or, delete everything"));
    dangerBox.append(el("div", { style: "font-size:12px;color:#7a1f1f;margin-bottom:8px" },
      `Permanently removes the group and all ${tasksInGroup.length} task${tasksInGroup.length === 1 ? "" : "s"} in it. This can't be undone.`));
    const delBtn = el("button", {
      class: "tool-btn",
      style: "background:#7a1f1f;color:#fff;border-color:#7a1f1f",
      onClick: async () => {
        await api("/api/groups/delete", { method: "POST", body: JSON.stringify({ name, mode: "delete" }) });
        STATE.tasks = STATE.tasks.filter((t) => t.group_name !== name);
        STATE.automations.forEach((a) => { if (a.action_type === "moveToGroup" && a.action_val === name) a.enabled = 0; });
        close(); render();
      },
    }, `Delete group and its ${tasksInGroup.length} task${tasksInGroup.length === 1 ? "" : "s"}`);
    dangerBox.append(delBtn);
    body.append(dangerBox);

    // Cancel
    body.append(el("div", { style: "text-align:right;margin-top:14px" },
      el("button", { class: "tool-btn", onClick: () => close() }, "Cancel")));
  });
}

function allGroupNames() {
  // Distinct group names currently in use, in their first-seen order.
  const seen = new Set();
  STATE.tasks.forEach((t) => seen.add(t.group_name));
  return [...seen];
}

/**
 * A small "⋯" button on each row that opens a Move-to popup. Clicking elsewhere
 * closes it. Lets the user move a task to any existing group or create a new one.
 */
function buildRowMenu(task) {
  const wrap = el("span", { class: "row-menu-wrap" });
  const btn = el("button", { class: "row-menu-btn", title: "Move to group" }, "⋯");
  wrap.append(btn);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    // Close any other open menu first
    closeAllPopovers();

    // Build the menu detached from the table — it will be appended to document.body
    // with position:fixed so it can never be hidden behind table rows, add-task bars,
    // or any subsequent group blocks.
    const menu = el("div", { class: "row-menu floating" });
    menu.append(el("div", { class: "row-menu-head" }, "Move to group"));
    const others = allGroupNames().filter((n) => n !== task.group_name);
    if (others.length === 0) {
      menu.append(el("div", { class: "row-menu-empty" }, "No other groups yet"));
    }
    others.forEach((g) => {
      menu.append(el("div", { class: "row-menu-opt", onClick: async () => { menu.remove(); await moveTaskToGroup(task.id, g); } }, g));
    });
    // "+ New group" inline form
    const newRow = el("div", { class: "row-menu-new" });
    const inp = el("input", { class: "field", placeholder: "+ New group…", style: "padding:5px 8px;font-size:12px;width:100%" });
    inp.addEventListener("keydown", async (ev) => {
      if (ev.key === "Enter" && inp.value.trim()) {
        const target = inp.value.trim();
        menu.remove();
        await moveTaskToGroup(task.id, target);
      } else if (ev.key === "Escape") {
        menu.remove();
      }
    });
    newRow.append(inp);
    menu.append(newRow);

    // --- Copy (linked) to another group — only for top-level tasks ---
    if (!task.parent_id) {
      menu.append(el("div", { class: "row-menu-head", style: "margin-top:8px;border-top:1px solid var(--off-white);padding-top:8px" }, "Copy to group (linked)"));
      const copyTargets = allGroupNames().filter((n) => n !== task.group_name);
      if (copyTargets.length === 0) {
        menu.append(el("div", { class: "row-menu-empty" }, "No other groups yet"));
      }
      copyTargets.forEach((g) => {
        menu.append(el("div", { class: "row-menu-opt", title: "Linked copy — edits sync across copies",
          onClick: async () => { menu.remove(); await copyTaskToGroup(task.id, g); } }, "⧉ " + g));
      });
      // New-group copy form
      const copyNew = el("div", { class: "row-menu-new" });
      const cinp = el("input", { class: "field", placeholder: "⧉ Copy to new group…", style: "padding:5px 8px;font-size:12px;width:100%" });
      cinp.addEventListener("keydown", async (ev) => {
        if (ev.key === "Enter" && cinp.value.trim()) {
          const target = cinp.value.trim();
          menu.remove();
          await copyTaskToGroup(task.id, target);
        } else if (ev.key === "Escape") {
          menu.remove();
        }
      });
      copyNew.append(cinp);
      menu.append(copyNew);
    }

    // Position next to the trigger button using its viewport coords (attaches to body)
    positionFloatingMenu(menu, btn, "below-right");
    inp.focus();

    // dismiss on outside click / Escape
    attachOutsideClose(menu, btn);
  });
  return wrap;
}

/** Close every popover. */
function closeAllPopovers() {
  document.querySelectorAll(".row-menu, .pill-menu, .color-pop").forEach((m) => m.remove());
}
// Close the most-recently-opened modal (if any). Returns true if one closed.
function closeTopModal() {
  const overlays = document.querySelectorAll("#modal-root .modal-overlay");
  if (overlays.length) {
    overlays[overlays.length - 1].remove();
    return true;
  }
  return false;
}

/**
 * Floating color picker for a group. Shows preset swatches, a native
 * custom-color input, and a "Reset" option that clears the custom color so the
 * group falls back to the default rotating palette.
 */
function openGroupColorPicker(groupName, triggerEl) {
  closeAllPopovers();
  const pop = el("div", { class: "color-pop floating" });

/**
 * Position a floating menu near a trigger using viewport (fixed) coordinates,
 * and leave it attached to document.body. `placement` controls anchoring:
 * "below-left" aligns the menu's left edge to the trigger's left and drops
 * below it; "below-right" aligns the menu's right edge to the trigger's right.
 * Flips above if it would run off the bottom of the viewport.
 */
function positionFloatingMenu(menu, trigger, placement = "below-left") {
  menu.style.position = "fixed";
  menu.style.visibility = "hidden";
  menu.style.left = "0px";
  menu.style.top = "0px";
  document.body.append(menu);
  const t = trigger.getBoundingClientRect();
  const m = menu.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = placement === "below-right" ? (t.right - m.width) : t.left;
  let top = t.bottom + 4;
  left = Math.max(8, Math.min(left, vw - m.width - 8));
  if (top + m.height > vh - 8) {
    top = t.top - m.height - 4;
  }
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.style.visibility = "";
}

/** Attach outside-click + Escape dismissal to a popover. */
function attachOutsideClose(menu, trigger) {
  setTimeout(() => {
    const onDocClick = (ev) => {
      if (!menu.contains(ev.target) && ev.target !== trigger && !trigger.contains?.(ev.target)) {
        menu.remove();
        document.removeEventListener("click", onDocClick);
        document.removeEventListener("keydown", onKey);
      }
    };
    const onKey = (ev) => {
      if (ev.key === "Escape") {
        menu.remove();
        document.removeEventListener("click", onDocClick);
        document.removeEventListener("keydown", onKey);
      }
    };
    document.addEventListener("click", onDocClick);
    document.addEventListener("keydown", onKey);
  }, 0);
}

// Reorder whole groups: move `movedName` to before/after `targetName`, then
// The full set of groups that should exist on the board: any group that has
// tasks, plus any group that was created or ordered or colored independently.
// This is what keeps an empty group from vanishing.
function knownGroupNames() {
  const set = new Set();
  STATE.tasks.filter((t) => !t.parent_id).forEach((t) => set.add(t.group_name));
  Object.keys(STATE.group_order || {}).forEach((n) => set.add(n));
  Object.keys(STATE.group_colors || {}).forEach((n) => set.add(n));
  return [...set];
}

// persist the full ordering.
async function reorderGroups(movedName, targetName, after) {
  // Current display order = how renderTable sorted them (include empty groups)
  const names = knownGroupNames();
  names.sort((a, b) => {
    const pa = STATE.group_order[a], pb = STATE.group_order[b];
    if (pa == null && pb == null) return 0;
    if (pa == null) return 1;
    if (pb == null) return -1;
    return pa - pb;
  });
  const without = names.filter((n) => n !== movedName);
  const idx = without.indexOf(targetName);
  const insertAt = after ? idx + 1 : idx;
  without.splice(insertAt, 0, movedName);
  // Reassign positions locally + persist
  without.forEach((n, i) => { STATE.group_order[n] = i; });
  groupDragState = null;
  render();
  await api("/api/groups/reorder", { method: "PATCH", body: JSON.stringify({ order: without }) });
}

// After a drag, read the on-screen row order across ALL groups (in document
// order) and persist it as each task's position. Keeping it global avoids
// position collisions between groups.
async function persistGroupOrder(_tbody, _group) {
  // Only top-level rows are draggable/orderable; skip subtask rows so their
  // interleaved DOM position doesn't corrupt the saved order.
  const ids = [...document.querySelectorAll("#board tbody tr[data-id]:not(.subtask-row)")].map((tr) => tr.dataset.id);
  ids.forEach((id, i) => { const t = STATE.tasks.find((x) => x.id === id); if (t) t.position = i; });
  STATE.tasks.sort((a, b) => a.position - b.position);
  await api("/api/tasks/reorder", { method: "PATCH", body: JSON.stringify({ order: ids }) });
}

// ---------------- Helpers ----------------
function filteredTasks() {
  if (!search) return STATE.tasks;
  const q = search.toLowerCase();
  return STATE.tasks.filter((t) =>
    Object.values(t.cells).some((v) => String(v).toLowerCase().includes(q))
  );
}
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "style") node.style.cssText = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    node.append(c.nodeType ? c : document.createTextNode(c));
  }
  return node;
}

/**
 * Make any text element click-to-rename.
 *   span        : the element whose text becomes editable
 *   currentVal  : a function returning the current value (so it stays fresh)
 *   onCommit    : async (newValue) — only called when value actually changed
 *   placeholder : optional placeholder for the input
 */
function inlineRename(span, currentVal, onCommit, placeholder = "") {
  span.classList.add("editable");
  span.addEventListener("click", (e) => {
    e.stopPropagation();
    const original = String(currentVal() ?? "");
    // Build the input WITHOUT relying on the value-attribute path in el(); set
    // the live .value property directly so the field always shows the current name.
    const inp = document.createElement("input");
    inp.className = "inline-rename";
    inp.value = original;
    if (placeholder) inp.placeholder = placeholder;
    // Match the span's font (size/family) so editing feels in-place. We do NOT
    // copy color — the input always has a white background, so it uses the
    // stylesheet's dark text color to stay readable (e.g. on colored headers).
    const cs = getComputedStyle(span);
    inp.style.font = cs.font;
    inp.style.width = Math.max(span.offsetWidth + 20, 80) + "px";
    span.replaceWith(inp);
    inp.focus();
    inp.select();
    let done = false;
    const finish = async (save) => {
      if (done) return;
      done = true;
      const newVal = (inp.value || "").trim();
      // Only commit if we have a real, non-empty new value that actually changed.
      if (save && newVal && newVal !== original) {
        try {
          await onCommit(newVal);
        } catch (err) {
          console.error("rename failed:", err);
          // Best-effort restore so the user sees the old name, not nothing
          if (inp.isConnected) inp.replaceWith(span);
        }
      } else if (inp.isConnected) {
        // Restore the original span if nothing changed / cancelled
        inp.replaceWith(span);
      }
    };
    inp.addEventListener("blur", () => finish(true));
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
  });
}

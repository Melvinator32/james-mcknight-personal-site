// Priority levels shared by projects and saved prompts.
const PS_PRIORITIES = [
  { key: "high", label: "High", color: "#c0392b", rank: 0 },
  { key: "med",  label: "Med",  color: "#c0782a", rank: 1 },
  { key: "low",  label: "Low",  color: "#77b28c", rank: 2 },
];
function psPrio(key) { return PS_PRIORITIES.find((p) => p.key === key) || null; }
function psPrioRank(key) { const p = psPrio(key); return p ? p.rank : 99; }

function psCat(key) { return PS_CATEGORIES.find((c) => c.key === key) || PS_CATEGORIES[0]; }
function psFieldsFor(catKey) {
  const c = psCat(catKey);
  return PS_SHARED.concat(c.specific);
}
function psPromptOf(p) {
  let f = p.fields;
  if (typeof f === "string") { try { f = JSON.parse(f); } catch (e) { f = {}; } }
  return f || {};
}
function psReqFields(catKey) { return psFieldsFor(catKey).filter((s) => s.req); }
function psReqDone(catKey, fields) { return psReqFields(catKey).filter((s) => psFieldValue(catKey, s.key, fields).trim()); }
// The 'project' field stores an id; render its title for human-readable output.
function psFieldValue(catKey, key, fields) {
  if (catKey === "improve" && key === "project") {
    const pr = (STATE.projects || []).find((x) => x.id === fields.project);
    return pr ? pr.title : "";
  }
  return String(fields[key] || "");
}

// Live project context block for the Project Improvements type.
function psProjectContext(fields) {
  const pr = (STATE.projects || []).find((x) => x.id === fields.project);
  if (!pr) return "";
  const L = [`**${pr.title}** — stage: ${vibeStage(pr.stage).label}`];
  if (pr.description) L.push(`Description: ${pr.description}`);
  const tags = parseGoalTags(pr.tags).map((t) => goalTagLabel(t)).filter(Boolean);
  if (tags.length) L.push(`Advances: ${tags.join(", ")}`);
  let plan = pr.plan;
  if (typeof plan === "string") { try { plan = JSON.parse(plan); } catch (e) { plan = null; } }
  if (plan && typeof plan === "object") {
    Object.keys(plan).forEach((k) => { const v = String(plan[k] || "").trim(); if (v) L.push(`${k}: ${v}`); });
  }
  return L.join("\n");
}

// ---- Deterministic generators: Execute + Clarify-first ----
function psBriefBody(cat, fields) {
  const L = [];
  if (cat.key === "improve") {
    const ctx = psProjectContext(fields);
    if (ctx) L.push(`## Project (live context)\n${ctx}`);
  }
  const add = (head, key) => {
    if (cat.key === "improve" && key === "project") return; // shown in the context block above
    const v = psFieldValue(cat.key, key, fields).trim();
    if (v) L.push(`## ${head}\n${v}`);
  };
  PS_SHARED.forEach((s) => add(s.label.split(" — ")[0], s.key));
  cat.specific.forEach((s) => add(s.label, s.key));
  return L.join("\n\n");
}
function psGenExecute(cat, fields, title) {
  const head = `You are my expert collaborator on a ${cat.label.toLowerCase()} task.`;
  const body = psBriefBody(cat, fields);
  const shape = cat.output ? `\n\n## Deliverable shape\n${cat.output}` : "";
  return `${head}\n\nProduce the deliverable described below, matching the Definition of done. If a critical detail is missing, make the most reasonable assumption and state it at the top rather than stalling.\n\n${body || "(brief not yet filled in)"}${shape}`;
}
function psGenClarify(cat, fields, title) {
  const body = psBriefBody(cat, fields);
  const shape = cat.output ? `\n\n## Intended deliverable shape\n${cat.output}` : "";
  return `You are my expert collaborator on a ${cat.label.toLowerCase()} task. Before producing anything, pressure-test the brief.\n\n${body || "(brief not yet filled in)"}${shape}\n\n## Reply with ONLY\n1) What you need from me to do this in one pass\n2) The assumptions you'd make if I don't specify\n3) The trade-offs in how we could approach it\n4) The weakest part of this brief\nDon't produce the deliverable yet.`;
}
function psPrompts(catKey, fields, title) {
  const cat = psCat(catKey);
  return { execute: psGenExecute(cat, fields, title), clarify: psGenClarify(cat, fields, title) };
}
function psCoreCount(fields) {
  return PS_SHARED.filter((s) => (fields[s.key] || "").trim()).length;
}

// Editor modal with autosave (lazy-creates the saved prompt on first keystroke).
function openPromptEditor(p, presetCat) {
  const creating = !p;
  const fields = creating ? {} : Object.assign({}, psPromptOf(p));
  let catKey = creating ? (presetCat || PS_CATEGORIES[0].key) : p.category;
  let titleVal = creating ? "" : p.title;
  let prioVal = creating ? "" : (p.priority || "");
  const ed = {};

  openModal(creating ? "New prompt" : "Edit · " + p.title, (body, close) => {
    body.classList.add("plan-modal");
    let draft = p;
    let saveTimer = null, dirty = false;
    const saveIndicator = el("span", { class: "plan-saved" }, "");

    async function persistNow() {
      if (!dirty) return;
      dirty = false;
      const payload = { title: titleVal || "Untitled prompt", category: catKey, fields, priority: prioVal };
      try {
        if (!draft) {
          draft = await api("/api/prompts", { method: "POST", body: JSON.stringify(payload) });
          STATE.prompts = STATE.prompts || [];
          STATE.prompts.push(draft);
        } else {
          await api(`/api/prompts/${draft.id}`, { method: "PATCH", body: JSON.stringify(payload) });
          Object.assign(draft, payload);
        }
        saveIndicator.textContent = "✓ saved";
      } catch (e) { saveIndicator.textContent = ""; }
    }
    function scheduleSave() {
      dirty = true; saveIndicator.textContent = "saving…";
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(persistNow, 700);
    }
    // Flush any pending edit on ANY close path (×, click-out, Esc).
    ed.flush = () => { if (saveTimer) clearTimeout(saveTimer); return persistNow(); };

    // Title + autosave indicator
    const titleRow = el("div", { style: "display:flex;align-items:center;gap:10px;margin-bottom:8px" });
    const tIn = el("input", { class: "field plan-title", placeholder: "Name this prompt (e.g. 'Monthly variance memo')", style: "flex:1;font-weight:700" });
    tIn.value = titleVal;
    tIn.addEventListener("input", () => { titleVal = tIn.value; scheduleSave(); });
    titleRow.append(tIn); titleRow.append(saveIndicator);
    body.append(titleRow);

    // Category picker
    const catWrap = el("div", { class: "ps-catpick" });
    function paintCats() {
      catWrap.innerHTML = "";
      PS_CATEGORIES.forEach((c) => {
        const chip = el("span", { class: "ps-catchip" + (c.key === catKey ? " on" : ""), style: c.key === catKey ? `background:${c.color};border-color:${c.color};color:#fff` : "", onClick: () => { catKey = c.key; paintCats(); paintFields(); buildPrompts(); scheduleSave(); } }, `${c.icon} ${c.label}`);
        catWrap.append(chip);
      });
    }
    body.append(el("div", { class: "plan-sec-label", style: "margin-bottom:6px" }, "Category"));
    body.append(catWrap);
    paintCats();

    // Priority
    const prioRow = el("div", { class: "ps-priorow" });
    function paintPrio() {
      prioRow.innerHTML = "";
      prioRow.append(el("span", { class: "plan-sec-label" }, "Priority"));
      PS_PRIORITIES.forEach((pr) => {
        prioRow.append(el("span", { class: "ps-priochip" + (prioVal === pr.key ? " on" : ""), style: prioVal === pr.key ? `background:${pr.color};border-color:${pr.color};color:#fff` : `--c:${pr.color}`, onClick: () => { prioVal = (prioVal === pr.key ? "" : pr.key); paintPrio(); scheduleSave(); } }, pr.label));
      });
    }
    body.append(prioRow); paintPrio();

    // Fields (shared + category-specific), repainted when category changes
    let meterEl = null;
    function updateMeter() {
      if (!meterEl) return;
      const t = psReqFields(catKey).length, d = psReqDone(catKey, fields).length;
      meterEl.textContent = `Required ${d}/${t} filled`;
      meterEl.classList.toggle("ok", d === t);
    }
    const fieldHost = el("div", {});
    body.append(fieldHost);
    function paintFields() {
      fieldHost.innerHTML = "";
      const cat = psCat(catKey);
      meterEl = el("div", { class: "ps-reqmeter" });
      fieldHost.append(meterEl);
      const mk = (s, specific) => {
        const sec = el("div", { class: "plan-sec" });
        const headRow = el("div", { class: "plan-sec-head" });
        const lab = el("span", { class: "plan-sec-label" }, s.label);
        if (s.req) lab.append(el("span", { class: "ps-req", title: "Required" }, " *"));
        headRow.append(lab);
        if (specific) headRow.append(el("span", { class: "ps-spec-tag", style: `background:${cat.color}` }, cat.label.split(" ")[0]));
        sec.append(headRow);
        if (cat.key === "improve" && s.key === "project") {
          const sel = el("select", { class: "field plan-ta", style: "min-height:auto;height:38px" });
          sel.append(el("option", { value: "" }, "— pick a project —"));
          (STATE.projects || []).slice().sort((a, b) => a.title.localeCompare(b.title)).forEach((pr) => {
            sel.append(el("option", Object.assign({ value: pr.id }, fields.project === pr.id ? { selected: "selected" } : {}), `${pr.title} · ${vibeStage(pr.stage).label}`));
          });
          sel.addEventListener("change", () => { fields.project = sel.value; buildPrompts(); updateMeter(); scheduleSave(); });
          sec.append(sel);
        } else {
          const ta = el("textarea", { class: "field plan-ta", placeholder: s.ph, rows: specific ? "2" : "3" });
          ta.value = fields[s.key] || "";
          ta.addEventListener("input", () => { fields[s.key] = ta.value; buildPrompts(); updateMeter(); scheduleSave(); });
          sec.append(ta);
        }
        if (s.help) sec.append(el("div", { class: "ps-help" }, s.help));
        fieldHost.append(sec);
      };
      fieldHost.append(el("div", { class: "ps-group-label" }, "Shared brief"));
      PS_SHARED.forEach((s) => mk(s, false));
      fieldHost.append(el("div", { class: "ps-group-label" }, `${cat.icon} ${cat.label} — specifics`));
      cat.specific.forEach((s) => mk(s, true));
      updateMeter();
    }
    paintFields();

    // Generated prompts (Execute + Clarify-first)
    const promptWrap = el("div", { class: "plan-prompts" });
    body.append(promptWrap);
    function buildPrompts() {
      const prompts = psPrompts(catKey, fields, titleVal);
      promptWrap.innerHTML = "";
      promptWrap.append(el("div", { class: "plan-sec-label", style: "margin:6px 0" }, "Generated prompt"));
      const tabs = el("div", { class: "plan-ptabs" });
      const out = el("textarea", { class: "field plan-pout", rows: "9", readonly: "true" });
      let active = "execute";
      const flavors = [["execute", "Execute"], ["clarify", "Clarify-first"]];
      const show = (f) => { active = f; out.value = prompts[f]; tabs.querySelectorAll(".plan-ptab").forEach((b) => b.classList.toggle("on", b.dataset.f === f)); };
      flavors.forEach(([f, lab]) => tabs.append(el("button", { class: "plan-ptab", "data-f": f, onClick: () => show(f) }, lab)));
      promptWrap.append(tabs); promptWrap.append(out);
      const acts = el("div", { class: "plan-pacts" });
      acts.append(el("button", { class: "tool-btn", onClick: () => { navigator.clipboard && navigator.clipboard.writeText(out.value); showTimerToast("Prompt copied."); } }, "Copy"));
      acts.append(el("button", { class: "tool-btn", onClick: () => { const t = (titleVal || psCat(catKey).label); downloadText(`${t.replace(/[^a-z0-9]+/gi, "_")}_${active}.md`, out.value); } }, "Download .md"));
      promptWrap.append(acts);
      show(active);
    }
    buildPrompts();

    const footer = el("div", { class: "plan-footer" });
    footer.append(el("button", { class: "tool-btn accent-teal", onClick: async () => {
      dirty = true; if (saveTimer) clearTimeout(saveTimer); await persistNow();
      close(); render(); showTimerToast(creating ? "Prompt saved to your library." : "Prompt updated.");
    } }, creating ? "Save to library" : "Save"));
    body.append(footer);
    setTimeout(() => tIn.focus(), 30);
  }, { onClose: () => { ed.flush && ed.flush(); render(); } });
}

async function psSetPriority(p, key) {
  p.priority = key;
  try { await api(`/api/prompts/${p.id}`, { method: "PATCH", body: JSON.stringify({ priority: key }) }); } catch (e) {}
  render();
}
function psCyclePriority(p) {
  const order = ["", "high", "med", "low"];
  const next = order[(order.indexOf(p.priority || "") + 1) % order.length];
  psSetPriority(p, next);
}
function psSortItems(items) {
  const byRecent = (a, b) => String(b.updated || b.created || "").localeCompare(String(a.updated || a.created || ""));
  if (psSort === "prio") return items.slice().sort((a, b) => psPrioRank(a.priority) - psPrioRank(b.priority) || byRecent(a, b));
  if (psSort === "recent") return items.slice().sort(byRecent);
  return items.slice();
}
function psSegBar(segs) {
  const seg = el("div", { class: "ps-seg" });
  segs.forEach(([val, lab, cur, set]) => seg.append(el("button", { class: cur === val ? "on" : "", onClick: () => set(val) }, lab)));
  return seg;
}
function psPromptCard(p) {

  const rt = psReqFields(p.category).length, rd = psReqDone(p.category, f).length;
  cardEl.append(el("div", { class: "ps-card-meta" }, `${cat.icon} ${cat.label} · required ${rd}/${rt}`));
  const quick = el("div", { class: "ps-card-acts" });

  cardEl.append(quick);

}

    body.append(el("label", { class: "rw-flabel" }, "Cost (points)"));

    const save = el("button", { class: "tool-btn accent-teal", onClick: async () => {
      const nm = name.value.trim(); if (!nm) { name.focus(); return; }
      const c = Math.max(0, parseInt(cost.value || "0", 10) || 0);
      close();
      if (reward) await api(`/api/rewards/${reward.id}`, { method: "PATCH", body: JSON.stringify({ name: nm, cost: c }) });
      else await api("/api/rewards", { method: "POST", body: JSON.stringify({ name: nm, cost: c }) });
      await loadState();
    } }, reward ? "Save" : "Add reward");
    body.append(save);
    setTimeout(() => name.focus(), 30);
  });
}

<script>
/* ---- today.js ---- */
/* Tuned In — today.js
   Today — priorities + time-block schedule, .ics import, Eisenhower matrix, Today hub (Day/Week/Month)
   Load order matters: see templates/index.html. Classic scripts share one global scope. */

// ---------------- Today: top priorities + 15-min time-block schedule ----------------
let scheduleDay = null;          // 'YYYY-MM-DD' currently shown
let scheduleBlocks = null;       // cached blocks for scheduleDay
let scheduleLoadingFor = null;   // guard against duplicate fetches
const DAY_START_MIN = 6 * 60;    // grid starts 6:00 AM
const DAY_END_MIN = 22 * 60;     // ...ends 10:00 PM
const SLOT_MIN = 15;             // 15-minute increments
const SLOT_PX = 22;              // pixels per slot

function todayYMD() { return toYMD(startOfToday()); }
function minToHHMM(m) { const h = Math.floor(m / 60), mm = m % 60; return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); }
function hhmmToMin(s) { const [h, m] = String(s).split(":").map(Number); return (h || 0) * 60 + (m || 0); }
function fmtTime(m) {
  let h = Math.floor(m / 60), mm = m % 60; const ap = h >= 12 ? "PM" : "AM";
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${hh}:${String(mm).padStart(2, "0")} ${ap}`;
}

// ---- Outlook .ics import (populates Today + Calendar as schedule blocks) ----
async function importIcsText(text) {
  try {
    const resp = await api("/api/schedule/import", { method: "POST", body: JSON.stringify({ ics: text }) });
    // clear caches so both views refresh
    scheduleBlocks = null; scheduleDay = null; calBlocks = {};
    let msg = `Imported ${resp.added} event${resp.added === 1 ? "" : "s"} from ${resp.events} entr${resp.events === 1 ? "y" : "ies"}.`;
    if (resp.skipped_allday) msg += ` (${resp.skipped_allday} all-day event${resp.skipped_allday === 1 ? "" : "s"} skipped.)`;
    showTimerToast(msg);
    render();
  } catch (e) {
    showTimerToast("Couldn't read that file — make sure it's an Outlook .ics export.");
  }
}
function readIcsFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => importIcsText(String(r.result || ""));
  r.readAsText(file);
}
async function rescanCalendarFolder() {

// A clickable + drag-and-drop zone for dropping an .ics file.
function icsImportZone() {
  const zone = el("div", { class: "ics-zone", title: "Drop an Outlook .ics file here, or click to choose" },
    "⬆ Drop .ics here, or save one in the Tuned In folder");
  const input = el("input", { type: "file", accept: ".ics,text/calendar", style: "display:none" });
  input.addEventListener("change", () => { if (input.files && input.files[0]) readIcsFile(input.files[0]); input.value = ""; });
  zone.append(input);
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("drag"));

async function clearImportedSchedule() {

  const resp = await api("/api/schedule/clear-imported", { method: "POST" });
  scheduleBlocks = null; scheduleDay = null; calBlocks = {};

// Calendar month cache of schedule blocks, keyed "Y-M".
let calBlocks = {};
let calBlocksLoading = null;
async function loadCalBlocks(y, m) {
  const key = `${y}-${m}`;
  if (calBlocks[key] || calBlocksLoading === key) return;
  calBlocksLoading = key;
  const from = `${y}-${String(m + 1).padStart(2, "0")}-01`;
  const last = new Date(y, m + 1, 0).getDate();
  const to = `${y}-${String(m + 1).padStart(2, "0")}-${String(last).padStart(2, "0")}`;
  try {
    const resp = await api(`/api/schedule/range?from=${from}&to=${to}`);
    calBlocks[key] = resp.blocks || [];
  } catch (e) { calBlocks[key] = []; }
  calBlocksLoading = null;
  if (currentView === "calendar") render();
}

async function loadSchedule(day) {
  scheduleLoadingFor = day;
  try {
    const resp = await api(`/api/schedule?day=${encodeURIComponent(day)}`);
    // Ignore if the user navigated to a different day meanwhile
    if (scheduleLoadingFor !== day) return;
    scheduleDay = day;
    scheduleBlocks = resp.blocks || [];
  } finally {
    scheduleLoadingFor = null;   // always clear so a later load can re-fire
  }
  if (currentView === "today") render();
}

// ---- Auto-plan the day around what's already scheduled ----------------
// Order comes from the Eisenhower matrix (Do First → Schedule → Delegate;
// Eliminate is skipped), and within a quadrant from the board's own sort
// (priority, then earliest due date). Each task takes its matrix estimate.
// The server does the gap-fitting so meetings and hand-placed blocks are
// never overwritten.
const PLAN_QUAD_ORDER = ["do", "schedule", "delegate"];
function planWindow() {
  const s = (STATE.settings && STATE.settings.plan_start) || "08:00";
  const e = (STATE.settings && STATE.settings.plan_end) || "18:00";
  return { start: /^\d{2}:\d{2}$/.test(s) ? s : "08:00", end: /^\d{2}:\d{2}$/.test(e) ? e : "18:00" };
}

function planCandidates(day) {
  // Tasks already on this day's schedule shouldn't be planned twice — but only
  // blocks that will SURVIVE the re-plan count. The previous auto-plan is
  // cleared by the server first, so those tasks are candidates again;
  // otherwise a second run would quietly plan a different, smaller set.
  const fixed = (scheduleBlocks || []).filter((b) => !b.auto);
  const scheduled = new Set(fixed.map((b) => b.task_id).filter(Boolean));
  const pc = primaryCol();
  const scheduledNames = new Set(
    fixed.map((b) => String(b.label || "").trim().toLowerCase()).filter(Boolean));
  const out = [];
  PLAN_QUAD_ORDER.forEach((qk) => {
    matrixTasks()
      .filter((t) => t.cells["__eis"] === qk)
      .filter((t) => !scheduled.has(t.id))
      .filter((t) => !scheduledNames.has(String(t.cells[pc.id] || "").trim().toLowerCase()))
      .sort(taskSortCompare)
      .forEach((t) => out.push({
        task_id: t.id,
        label: String(t.cells[pc.id] || "Untitled"),
        minutes: estOrDefault(t),
      }));
  });
  return out;
}

async function autoPlanDay(day) {
  const items = planCandidates(day);
  if (!items.length) {
    alert("Nothing to plan.\n\nSort tasks into the Matrix first (Do First / Schedule / Delegate) — anything already on today's schedule is skipped.");
    return;
  }
  const win = planWindow();
  // On today, don't plan into hours that have already passed.
  let startMin = hhmmToMin(win.start);
  if (day === todayYMD()) {
    const now = new Date();
    const nowMin = Math.ceil((now.getHours() * 60 + now.getMinutes()) / SLOT_MIN) * SLOT_MIN;
    startMin = Math.max(startMin, nowMin);
  }
  if (startMin >= hhmmToMin(win.end)) {
    alert(`The planning window (${win.start}–${win.end}) has already passed for today.`);
    return;
  }
  const resp = await api("/api/schedule/autoplan", { method: "POST", body: JSON.stringify({
    day, window_start: minToHHMM(startMin), window_end: win.end, items }) });
  scheduleBlocks = null;
  await loadSchedule(day);
  const n = (resp.placed || []).length;
  const left = (resp.unplaced || []).length;
  let msg = `Planned ${n} task${n === 1 ? "" : "s"} into your free time.`;
  if (left) msg += ` ${left} didn't fit — free up time or trim estimates.`;
  toastMsg(msg);
}

async function clearAutoPlan(day) {
  const resp = await api(`/api/schedule/autoplan?day=${encodeURIComponent(day)}`, { method: "DELETE" });
  scheduleBlocks = null;
  await loadSchedule(day);
  toastMsg(resp.removed ? `Removed ${resp.removed} auto-planned block${resp.removed === 1 ? "" : "s"}.` : "No auto-planned blocks on this day.");
}

// Small transient message (reuses the timer toast's styling)
function toastMsg(msg) {
  const old = document.getElementById("timer-toast");
  if (old) old.remove();
  const t = el("div", { id: "timer-toast", class: "timer-toast" });
  t.append(el("span", { class: "timer-toast-icon" }, "🗓"));
  t.append(el("span", {}, msg));
  t.append(el("button", { class: "timer-toast-x", onClick: () => t.remove() }, "×"));
  document.body.append(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, 6000);
}

function renderToday() {
  const board = $("#board");
  const day = scheduleDay || todayYMD();
  // Fetch this day's blocks if we don't have them yet. Fire the load whenever
  // we don't have blocks for this day and one isn't already in flight.
  if (scheduleBlocks === null || scheduleDay !== day) {
    if (scheduleLoadingFor !== day) loadSchedule(day);
    board.append(el("div", { class: "muted", style: "padding:20px" }, "Loading schedule…"));
    return;
  }

  const layout = el("div", { class: "today-layout" });

  // ---- Left: Top Priorities + task list (draggable sources) ----
  const left = el("div", { class: "today-left" });
  const dd = parseYMD(day);
  const isToday = day === todayYMD();
  left.append(el("h2", { class: "today-title" }, isToday ? "Top Priorities" : "Priorities"));

  // Outlook import (drop or click). Imported events become editable blocks.

  importRow.append(el("span", { class: "ics-clear", title: "Re-read the .ics saved in the Tuned In folder", onClick: rescanCalendarFolder }, "sync folder"));
  importRow.append(el("span", { class: "ics-clear", title: "Remove imported Outlook events", onClick: clearImportedSchedule }, "clear imported"));
  left.append(importRow);

  const pCol0 = primaryCol();
  const seenTask = new Set();
  const incomplete = STATE.tasks
    .filter((t) => !t.parent_id)
    .filter((t) => !excludedFromPlanning(t))
    .filter((t) => {
      const sc = STATE.columns.find((c) => c.type === "status");
      return !sc || String(t.cells[sc.id] || "") !== "Done";
    })
    // Collapse copies of the same task to one chip. Key by name (so the same
    // task shown in several groups appears once) — matches the calendar's rule.
    .filter((t) => {
      const nm = String(t.cells[pCol0.id] || "").trim().toLowerCase();
      const key = nm ? "name:" + nm : "id:" + t.id;
      if (seenTask.has(key)) return false;
      seenTask.add(key);
      return true;
    })
    .sort(taskSortCompare);   // priority first, then earliest due date

  const pCol = primaryCol();
  const prioCol = STATE.columns.find((c) => c.type === "priority");
  const makeChip = (t, top) => {
    const chip = el("div", { class: "today-chip" + (top ? " top" : ""), draggable: "true", "data-task": t.id });
    chip.addEventListener("dragstart", (e) => {
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("text/plain", "task:" + t.id);
      todayDrag = { type: "task", id: t.id, label: String(t.cells[pCol.id] || "Untitled") };
    });
    chip.addEventListener("dragend", () => { todayDrag = null; });
    chip.append(el("span", { class: "today-chip-grip" }, "⠿"));
    chip.append(el("span", { class: "today-chip-name" }, t.cells[pCol.id] || "Untitled"));
    if (prioCol && t.cells[prioCol.id]) {
      chip.append(el("span", { class: "today-chip-pri", style: `background:${colorOf("priority", t.cells[prioCol.id])}` }, t.cells[prioCol.id]));
    }
    // Delete the task from here. Chips are deduped, so one chip can stand for
    // copies in several groups — deleting removes them all (otherwise another
    // copy would instantly reappear in the list).
    chip.append(el("button", { class: "today-chip-del", title: "Delete this task (removes it and its linked copies)",
      onClick: async (e) => {
        e.stopPropagation();
        const nm = t.cells[pCol.id] || "this task";
        if (!confirm(`Delete "${nm}"? This removes it from the board, including its copies in other groups.`)) return;
        await deleteTaskEverywhere(t);
      } }, "×"));
    return chip;
  };

  const topList = el("div", { class: "today-chips" });
  incomplete.slice(0, 6).forEach((t) => topList.append(makeChip(t, true)));
  if (!incomplete.length) topList.append(el("div", { class: "muted", style: "font-size:13px" }, "Nothing outstanding — nice."));
  left.append(topList);

  if (incomplete.length > 6) {
    left.append(el("div", { class: "today-subhead" }, "More tasks"));
    const moreList = el("div", { class: "today-chips" });
    incomplete.slice(6).forEach((t) => moreList.append(makeChip(t, false)));
    left.append(moreList);
  }
  left.append(el("p", { class: "today-tip" }, "Drag a task onto the schedule →  (it's copied to your day; the task stays put)"));

  // ---- Right: day schedule ----
  const right = el("div", { class: "today-right" });
  const navbar = el("div", { class: "today-nav" });
  navbar.append(el("button", { class: "today-navbtn", title: "Previous day", onClick: () => { scheduleDay = toYMD(addDays(parseYMD(day), -1)); scheduleBlocks = null; todayGridScroll = null; render(); } }, "‹"));
  const dlabel = dd ? dd.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) : day;
  navbar.append(el("span", { class: "today-date" }, (isToday ? "Today · " : "") + dlabel));
  navbar.append(el("button", { class: "today-navbtn", title: "Next day", onClick: () => { scheduleDay = toYMD(addDays(parseYMD(day), 1)); scheduleBlocks = null; todayGridScroll = null; render(); } }, "›"));
  if (!isToday) navbar.append(el("button", { class: "today-navbtn today-jump", title: "Jump to today", onClick: () => { scheduleDay = todayYMD(); scheduleBlocks = null; todayGridScroll = null; render(); } }, "Today"));
  navbar.append(el("span", { style: "flex:1" }));
  navbar.append(el("button", { class: "today-navbtn today-meeting", title: "Block off time for a meeting",
    onClick: () => addMeetingBlock(day, null) }, "+ Block off time"));
  right.append(navbar);

  // Auto-plan row: fills the gaps around meetings with matrix-sorted tasks
  const planbar = el("div", { class: "plan-bar" });
  planbar.append(el("button", { class: "today-navbtn plan-go",
    title: "Fill this day's free time with tasks from the Matrix, in quadrant order, using each task's estimate",
    onClick: () => autoPlanDay(day) }, "⚡ Auto-plan day"));
  const win = planWindow();
  planbar.append(el("span", { class: "plan-lab" }, "between"));
  const mkTime = (val, key) => {
    const inp = el("input", { type: "time", class: "plan-time", value: val, step: "900" });
    inp.addEventListener("change", () => {
      if (!/^\d{2}:\d{2}$/.test(inp.value)) return;
      STATE.settings[key] = inp.value;
      saveSetting(key, inp.value);
    });
    return inp;
  };
  planbar.append(mkTime(win.start, "plan_start"));
  planbar.append(el("span", { class: "plan-lab" }, "and"));
  planbar.append(mkTime(win.end, "plan_end"));
  const nPlan = (scheduleBlocks || []).filter((b) => b.auto).length;
  planbar.append(el("span", { style: "flex:1" }));
  const ready = planCandidates(day).length;
  planbar.append(el("span", { class: "plan-note" },
    nPlan ? `${nPlan} auto-planned` : (ready ? `${ready} task${ready === 1 ? "" : "s"} ready` : "sort tasks in the Matrix first")));
  if (nPlan) {
    planbar.append(el("button", { class: "today-navbtn", title: "Remove only the auto-planned blocks (meetings and blocks you placed stay)",
      onClick: () => clearAutoPlan(day) }, "Clear auto-plan"));
  }
  right.append(planbar);

  const grid = el("div", { class: "today-grid" });
  const colWrap = el("div", { class: "today-gridcol", style: `height:${((DAY_END_MIN - DAY_START_MIN) / SLOT_MIN) * SLOT_PX}px` });

  // Hour labels + slot drop targets
  for (let m = DAY_START_MIN; m < DAY_END_MIN; m += SLOT_MIN) {
    const slot = el("div", {
      class: "today-slot" + (m % 60 === 0 ? " hour" : ""),
      style: `top:${((m - DAY_START_MIN) / SLOT_MIN) * SLOT_PX}px;height:${SLOT_PX}px`,
      "data-min": String(m),
    });
    if (m % 60 === 0) slot.append(el("span", { class: "today-hourlabel" }, fmtTime(m)));
    slot.addEventListener("dragover", (e) => { e.preventDefault(); slot.classList.add("slot-over"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("slot-over"));
    slot.addEventListener("drop", async (e) => {
      e.preventDefault(); slot.classList.remove("slot-over");
      if (!todayDrag) return;
      const start = minToHHMM(m);
      if (todayDrag.type === "task") {
        await api("/api/schedule", { method: "POST", body: JSON.stringify({
          day, start, minutes: 30, task_id: todayDrag.id, label: todayDrag.label }) });
      } else if (todayDrag.type === "block") {
        await api(`/api/schedule/${todayDrag.id}`, { method: "PATCH", body: JSON.stringify({ start }) });
      }
      scheduleBlocks = null; await loadSchedule(day);
    });
    // Click an empty slot to block off time for a meeting (a task-less block).
    slot.addEventListener("click", () => addMeetingBlock(day, m));
    colWrap.append(slot);
  }

  // Render blocks
  (scheduleBlocks || []).forEach((b) => {
    const startM = hhmmToMin(b.start);
    const top = ((startM - DAY_START_MIN) / SLOT_MIN) * SLOT_PX;
    const h = (b.minutes / SLOT_MIN) * SLOT_PX;
    // Colour by the referenced task's status, if it still exists
    let color = b.color || "var(--cyan)";
    const task = b.task_id ? STATE.tasks.find((t) => t.id === b.task_id) : null;
    if (task) {
      const sc = STATE.columns.find((c) => c.type === "status");
      const sv = sc ? task.cells[sc.id] : "";
      if (sv) color = colorOf("status", sv);
    }
    const compact = b.minutes <= 20;   // 15-min blocks get a one-line layout
    // On today's schedule, blocks that have already ended fade back so the
    // current and upcoming work stands out.
    const nowMin = (() => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); })();
    const isPast = isToday && (startM + b.minutes) <= nowMin;
    const isMeeting = !b.task_id;

      title: `${labelText0} · ${fmtTime(startM)} – ${fmtTime(startM + b.minutes)}`,
      style: `top:${top}px;height:${Math.max(SLOT_PX - 2, h - 2)}px;background:${color}` });
    blk.addEventListener("dragstart", (e) => {

    blk.addEventListener("dragend", () => { todayDrag = null; });
    blk.append(el("div", { class: "today-block-label" }, labelText0));
    blk.append(el("div", { class: "today-block-time" }, `${fmtTime(startM)} – ${fmtTime(startM + b.minutes)}`));
    // Duration control + delete
    const ctr = el("div", { class: "today-block-ctr" });
    const dur = el("select", { class: "today-block-dur", title: "Duration" });
    [15, 30, 45, 60, 90, 120].forEach((mn) => {
      const o = el("option", { value: String(mn) }, mn >= 60 ? `${mn / 60}h${mn % 60 ? " " + (mn % 60) + "m" : ""}` : `${mn}m`);
      if (mn === b.minutes) o.selected = true;
      dur.append(o);
    });
    dur.addEventListener("click", (e) => e.stopPropagation());
    dur.addEventListener("change", async () => {
      await api(`/api/schedule/${b.id}`, { method: "PATCH", body: JSON.stringify({ minutes: Number(dur.value) }) });
      scheduleBlocks = null; await loadSchedule(day);
    });
    ctr.append(dur);
    ctr.append(el("button", { class: "today-block-del", title: "Remove from schedule",
      onClick: async (e) => { e.stopPropagation(); await api(`/api/schedule/${b.id}`, { method: "DELETE" }); scheduleBlocks = null; await loadSchedule(day); } }, "×"));
    blk.append(ctr);
    colWrap.append(blk);
  });

  // Dotted line marking the current time (today only), repositioned each
  // minute by the global timer tick.
  if (isToday) {
    const n = new Date();
    const nowMin = n.getHours() * 60 + n.getMinutes();
    if (nowMin >= DAY_START_MIN && nowMin <= DAY_END_MIN) {
      const line = el("div", { class: "now-line", id: "now-line",
        style: `top:${((nowMin - DAY_START_MIN) / SLOT_MIN) * SLOT_PX}px` });
      line.append(el("span", { class: "now-line-dot" }));
      colWrap.append(line);
    }
  }

  grid.append(colWrap);
  right.append(grid);

  // Apply saved panel width and insert a draggable divider so the priorities
  // panel and schedule can be resized; the width persists in settings.
  const savedW = parseInt((STATE.settings && STATE.settings["today_left_w"]) || "", 10);
  if (savedW && savedW >= 180 && savedW <= 700) {
    left.style.flex = `0 0 ${savedW}px`;
    left.style.maxWidth = savedW + "px";
  }
  layout.append(left);
  layout.append(makePanelDivider(left, "today_left_w"));
  layout.append(right);
  board.append(layout);
}

// A vertical drag handle that resizes the panel to its left and saves the width.
function makePanelDivider(leftEl, settingKey) {
  const div = el("div", { class: "panel-divider", title: "Drag to resize" });
  div.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = leftEl.getBoundingClientRect().width;
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    const onMove = (ev) => {
      const w = Math.max(180, Math.min(700, startW + (ev.clientX - startX)));
      leftEl.style.flex = `0 0 ${w}px`;
      leftEl.style.maxWidth = w + "px";
    };
    const onUp = () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      const finalW = Math.round(leftEl.getBoundingClientRect().width);
      STATE.settings = STATE.settings || {};
      STATE.settings[settingKey] = String(finalW);
      saveSetting(settingKey, String(finalW));
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  return div;
}
let todayDrag = null;
// Vertical scroll of the Today schedule grid, preserved across re-renders
// (e.g. deleting a block). Null = no saved position → auto-scroll to the
// first scheduled block on a fresh open.
let todayGridScroll = null;

// Create a task-less "meeting" block. If startMin is given (slot click), the
// start time is prefilled; otherwise it defaults to the next round hour.
function addMeetingBlock(day, startMin) {
  const defMin = startMin != null ? startMin : (() => {
    const n = new Date(); let m = n.getHours() * 60 + Math.ceil(n.getMinutes() / 15) * 15;
    return Math.max(DAY_START_MIN, Math.min(DAY_END_MIN - SLOT_MIN, m));
  })();
  openModal("Block off time", (body, close) => {
    body.append(el("label", { class: "rw-flabel" }, "What's it for?"));
    const name = el("input", { class: "field", placeholder: "e.g. Team sync, 1:1, Dentist", style: "width:100%;margin-bottom:12px" });
    body.append(name);

    const row = el("div", { style: "display:flex;gap:12px;margin-bottom:14px" });
    // Start time select (15-min increments across the grid range)
    const startSel = el("select", { class: "field", style: "flex:1" });
    for (let m = DAY_START_MIN; m < DAY_END_MIN; m += SLOT_MIN) {
      const o = el("option", { value: String(m) }, fmtTime(m));
      if (m === defMin) o.selected = true;
      startSel.append(o);
    }
    const durSel = el("select", { class: "field", style: "flex:1" });
    [15, 30, 45, 60, 90, 120, 180].forEach((mn) => {
      const o = el("option", { value: String(mn) }, mn >= 60 ? `${mn / 60}h${mn % 60 ? " " + (mn % 60) + "m" : ""}` : `${mn} min`);
      if (mn === 30) o.selected = true;
      durSel.append(o);
    });
    const startCol = el("div", { style: "flex:1" }); startCol.append(el("label", { class: "rw-flabel" }, "Start")); startCol.append(startSel);
    const durCol = el("div", { style: "flex:1" }); durCol.append(el("label", { class: "rw-flabel" }, "Length")); durCol.append(durSel);
    row.append(startCol); row.append(durCol);
    body.append(row);

    const save = el("button", { class: "tool-btn accent-teal", onClick: async () => {
      const nm = name.value.trim() || "Meeting";
      close();
      await api("/api/schedule", { method: "POST", body: JSON.stringify({
        day, start: minToHHMM(Number(startSel.value)), minutes: Number(durSel.value),
        task_id: null, label: nm, color: "#6b6f76" }) });   // grey = a held/meeting block
      scheduleBlocks = null; await loadSchedule(day);
    } }, "Add to schedule");
    body.append(save);
    setTimeout(() => name.focus(), 30);
  });
}

// ---------------- Eisenhower matrix ----------------
// Quadrant assignment lives on the task under the reserved key "__eis", so it
// syncs across linked copies and persists. Values: do | schedule | delegate |
// eliminate. Tasks without a value sit in the Unsorted panel.
let matrixDrag = null;
// Per-task time estimate for planning, in minutes, on the reserved cell key
// "__est" (same pattern as "__eis" — syncs across linked copies, persists).
// 15-minute increments; unset means "no estimate" and auto-plan uses
// EST_DEFAULT_MIN for it.
const EST_DEFAULT_MIN = 30;
const EST_CHOICES = [15, 30, 45, 60, 75, 90, 105, 120, 150, 180, 210, 240, 300, 360, 480];
function estMinutes(t) {
  const raw = parseInt(t.cells["__est"], 10);
  if (!raw || raw < 15) return 0;                 // 0 = not estimated
  return Math.min(480, Math.round(raw / 15) * 15);
}
function estOrDefault(t) { return estMinutes(t) || EST_DEFAULT_MIN; }
function fmtDur(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  if (!h) return mm + "m";
  return mm ? `${h}h ${mm}m` : `${h}h`;
}
// Total estimated time in a quadrant (unestimated tasks count as the default)
function quadMinutes(tasks, key) {
  return tasks.filter((t) => t.cells["__eis"] === key)
              .reduce((s, t) => s + estOrDefault(t), 0);
}

const EIS_QUADRANTS = [
  { key: "do",        title: "Do First",  sub: "Urgent · Important",        cls: "q-do" },
  { key: "schedule",  title: "Schedule",  sub: "Not urgent · Important",    cls: "q-schedule" },
  { key: "delegate",  title: "Delegate",  sub: "Urgent · Not important",    cls: "q-delegate" },
  { key: "eliminate", title: "Eliminate", sub: "Not urgent · Not important", cls: "q-eliminate" },
];

function matrixTasks() {
  // Same scope as the Today panel: top-level, not Done, not in parked groups,
  // deduped by name so the same task in several groups shows once.
  const pc = primaryCol();
  const sc = STATE.columns.find((c) => c.type === "status");
  const seen = new Set();
  return STATE.tasks
    .filter((t) => !t.parent_id)
    .filter((t) => !excludedFromPlanning(t))
    .filter((t) => !sc || String(t.cells[sc.id] || "") !== "Done")
    .filter((t) => {
      const nm = String(t.cells[pc.id] || "").trim().toLowerCase();
      const key = nm ? "name:" + nm : "id:" + t.id;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

function makeMatrixChip(t, inQuadrant) {
  const pc = primaryCol();
  const prioCol = STATE.columns.find((c) => c.type === "priority");
  const chip = el("div", { class: "today-chip mx-chip", draggable: "true", "data-task": t.id });
  chip.addEventListener("dragstart", (e) => {
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "mx:" + t.id);
    matrixDrag = { id: t.id };
  });
  chip.addEventListener("dragend", () => { matrixDrag = null; });
  chip.append(el("span", { class: "today-chip-grip" }, "⠿"));
  chip.append(el("span", { class: "today-chip-name", title: t.cells[pc.id] || "" }, t.cells[pc.id] || "Untitled"));
  if (prioCol && t.cells[prioCol.id]) {
    chip.append(el("span", { class: "today-chip-pri", style: `background:${colorOf("priority", t.cells[prioCol.id])}` }, t.cells[prioCol.id]));
  }
  // Time estimate — 15-minute increments, feeds Today's auto-plan
  const est = estMinutes(t);
  const sel = el("select", { class: "mx-est" + (est ? " set" : ""),
    title: "Estimated time — used when auto-planning your day" });
  sel.append(el("option", { value: "" }, "— est"));
  EST_CHOICES.forEach((m) => {
    sel.append(el("option", Object.assign({ value: String(m) }, m === est ? { selected: "selected" } : {}), fmtDur(m)));
  });
  sel.addEventListener("mousedown", (e) => e.stopPropagation());   // don't start a drag
  sel.addEventListener("click", (e) => e.stopPropagation());
  sel.addEventListener("change", async (e) => {
    e.stopPropagation();
    await updateCell(t.id, "__est", sel.value);
    t.cells["__est"] = sel.value;
    render();
  });
  chip.append(sel);
  if (inQuadrant) {
    chip.append(el("button", { class: "mx-unsort", title: "Send back to Unsorted",
      onClick: (e) => { e.stopPropagation(); updateCell(t.id, "__eis", ""); } }, "×"));
  }
  return chip;
}

function attachQuadrantDrop(zone, quadKey) {
  zone.addEventListener("dragover", (e) => {
    if (!matrixDrag) return;
    e.preventDefault();
    zone.classList.add("q-over");
  });
  zone.addEventListener("dragleave", () => zone.classList.remove("q-over"));
  zone.addEventListener("drop", (e) => {
    zone.classList.remove("q-over");
    if (!matrixDrag) return;
    e.preventDefault();
    updateCell(matrixDrag.id, "__eis", quadKey);
    matrixDrag = null;
  });
}

// Send every sorted task back to Unsorted. Estimates are kept — they're
// reusable, and re-sorting is the point of clearing.
async function clearMatrix() {
  const sorted = matrixTasks().filter((t) => t.cells["__eis"]);
  if (!sorted.length) { alert("The matrix is already empty."); return; }
  if (!confirm(`Send all ${sorted.length} sorted task${sorted.length === 1 ? "" : "s"} back to Unsorted?\n\nTime estimates are kept.`)) return;
  for (const t of sorted) {
    await updateCell(t.id, "__eis", "");
    t.cells["__eis"] = "";
  }
  render();
}

function renderMatrix() {
  const board = $("#board");
  const tasks = matrixTasks();
  const layout = el("div", { class: "matrix-layout" });

  // Left: unsorted tasks
  const left = el("div", { class: "matrix-left" });
  left.append(el("h2", { class: "today-title" }, "Unsorted"));
  const unsortedZone = el("div", { class: "today-chips mx-unsorted-zone" });
  const unsorted = tasks.filter((t) => !t.cells["__eis"]);
  unsorted.forEach((t) => unsortedZone.append(makeMatrixChip(t, false)));
  if (!unsorted.length) unsortedZone.append(el("div", { class: "muted", style: "font-size:13px" }, "Everything is sorted."));
  attachQuadrantDrop(unsortedZone, "");   // dropping back here unsorts
  left.append(unsortedZone);
  left.append(el("p", { class: "today-tip" }, "Drag a task into a quadrant →  (drag back here to unsort)"));
  const mxBar = el("div", { class: "mx-actions" });
  mxBar.append(el("button", { class: "tool-btn", title: "Send every sorted task back to Unsorted (estimates are kept)",
    onClick: clearMatrix }, "Clear matrix"));
  const totalEst = tasks.filter((t) => t.cells["__eis"] && t.cells["__eis"] !== "eliminate")
                        .reduce((s, t) => s + estOrDefault(t), 0);
  if (totalEst) mxBar.append(el("span", { class: "mx-total", title: "Everything sorted, minus Eliminate" }, fmtDur(totalEst) + " planned"));
  left.append(mxBar);
  const savedMW = parseInt((STATE.settings && STATE.settings["matrix_left_w"]) || "", 10);
  if (savedMW && savedMW >= 180 && savedMW <= 700) {
    left.style.flex = `0 0 ${savedMW}px`;
    left.style.maxWidth = savedMW + "px";
  }
  layout.append(left);
  layout.append(makePanelDivider(left, "matrix_left_w"));

  // Right: 2×2 quadrant grid with axis labels
  const right = el("div", { class: "matrix-right" });
  const grid = el("div", { class: "matrix-grid" });
  EIS_QUADRANTS.forEach((q) => {
    const zone = el("div", { class: "mx-quad " + q.cls });
    const head = el("div", { class: "mx-quad-head" });
    head.append(el("span", { class: "mx-quad-title" }, q.title));
    head.append(el("span", { class: "mx-quad-sub" }, q.sub));
    const qm = quadMinutes(tasks, q.key);
    if (qm) head.append(el("span", { class: "mx-quad-est", title: "Estimated time in this quadrant" }, fmtDur(qm)));
    zone.append(head);
    const bodyZone = el("div", { class: "mx-quad-body" });
    tasks.filter((t) => t.cells["__eis"] === q.key).forEach((t) => bodyZone.append(makeMatrixChip(t, true)));
    zone.append(bodyZone);
    attachQuadrantDrop(zone, q.key);
    grid.append(zone);
  });
  right.append(grid);
  layout.append(right);
  board.append(layout);
}

function renderCalendar() {
  const board = $("#board");
  const dateCol = STATE.columns.find((c) => c.type === "date");
  if (!dateCol) { board.append(el("div", { class: "muted" }, "Add a Date column to use the Calendar view.")); return; }
  const statusCol = STATE.columns.find((c) => c.type === "status");
  const pCol = primaryCol();

  const first = new Date(calMonth.y, calMonth.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
  const monthName = first.toLocaleString("default", { month: "long" });

  // Collect tasks by due date, collapsing the same task to ONE entry per day.
  // A task placed in several groups (linked copies) shares a due date and name,
  // so we dedupe within each day by link_id when present, otherwise by name —
  // that way copies show once whether or not they carry a link_id.
  const byDay = {};
  const seenPerDay = {};
  filteredTasks().filter((t) => !t.parent_id).forEach((t) => {
    const dv = t.cells[dateCol.id];
    if (!dv) return;
    const key = t.link_id ? "link:" + t.link_id : "name:" + String(t.cells[pCol.id] || "").trim().toLowerCase();
    const seen = seenPerDay[dv] || (seenPerDay[dv] = new Set());
    if (seen.has(key)) return;  // same task already shown on this day
    seen.add(key);
    (byDay[dv] = byDay[dv] || []).push(t);
  });

  const cal = el("div", { class: "cal" });
  const head = el("div", { class: "cal-head" });
  head.append(el("button", { class: "tool-btn", onClick: () => { calMonth = calMonth.m === 0 ? { y: calMonth.y - 1, m: 11 } : { y: calMonth.y, m: calMonth.m - 1 }; render(); } }, "‹"));
  head.append(el("div", { class: "cal-title" }, `${monthName} ${calMonth.y}`));
  head.append(el("button", { class: "tool-btn", onClick: () => { calMonth = calMonth.m === 11 ? { y: calMonth.y + 1, m: 0 } : { y: calMonth.y, m: calMonth.m + 1 }; render(); } }, "›"));
  head.append(icsImportZone());
  head.append(el("span", { class: "ics-clear", title: "Re-read the .ics saved in the Tuned In folder", onClick: rescanCalendarFolder, style: "margin-left:8px" }, "sync folder"));
  cal.append(head);

  // Fetch this month's schedule blocks (Outlook imports + hand-made) and group
  // them by day so they show alongside task due-dates.
  loadCalBlocks(calMonth.y, calMonth.m);
  const monthBlocks = calBlocks[`${calMonth.y}-${calMonth.m}`] || [];
  const blocksByDay = {};
  monthBlocks.forEach((b) => { (blocksByDay[b.day] = blocksByDay[b.day] || []).push(b); });

  const grid = el("div", { class: "cal-grid" });
  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach((d) => grid.append(el("div", { class: "cal-dow" }, d)));
  for (let i = 0; i < startDow; i++) grid.append(el("div"));
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calMonth.y}-${String(calMonth.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const isToday = ds === todayStr();
    const cell = el("div", { class: "cal-cell" + (isToday ? " today" : "") });
    cell.append(el("div", { class: "cal-num" }, String(d)));
    // Calendar/Outlook events first (clicking jumps to that day in Today).
    const evs = (blocksByDay[ds] || []).slice().sort((a, b) => String(a.start).localeCompare(String(b.start)));
    evs.slice(0, 3).forEach((b) => {
      const t12 = fmtTime12(b.start);
      cell.append(el("div", { class: "cal-event", style: `border-left:3px solid ${b.color || "#5d7479"}`, title: `${t12} · ${b.label || ""}`, onClick: () => { scheduleDay = ds; scheduleBlocks = null; setView("today"); } },
        el("span", { class: "cal-ev-time" }, t12), el("span", { class: "cal-ev-lab" }, b.label || "(busy)")));
    });
    if (evs.length > 3) cell.append(el("div", { class: "cal-more" }, `+${evs.length - 3} event${evs.length - 3 === 1 ? "" : "s"}`));
    const dayTasks = byDay[ds] || [];
    dayTasks.slice(0, 2).forEach((t) => {
      const bg = statusCol ? colorOf("status", t.cells[statusCol.id]) : "#00859b";
      cell.append(el("div", { class: "cal-task", style: `background:${bg}` }, t.cells[pCol.id] || "Untitled"));
    });
    if (dayTasks.length > 2) cell.append(el("div", { class: "cal-more" }, `+${dayTasks.length - 2} more`));
    grid.append(cell);
  }
  cal.append(grid);
  board.append(cal);
}

// "14:30" → "2:30p"
function fmtTime12(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || "");
  if (!m) return hhmm || "";
  let h = Number(m[1]); const mm = m[2]; const ap = h >= 12 ? "p" : "a";
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${mm}${ap}`;
}

function emptyBoard() {
  const d = el("div", { class: "empty-board" });
  d.innerHTML = 'No tasks yet. Click <b>+ New Task</b> to begin.';
  return d;
}

// ============================================================================
// TODAY HUB (2026-06-27-B) — Day / Week / Month sub-tabs. The old Calendar
// tab is folded in here: Month = the existing monthly grid, Week = a new
// 7-day view. Day = the existing Today schedule.
// ============================================================================
let gdShowHidden = false;

function renderTodayHub() {
  gsInjectCss();
  const board = $("#board");
  board.innerHTML = "";
  const nav = el("div", { class: "gs-subnav" });
  [["day", "\u25F4 Today"], ["week", "\u25A6 Week"], ["month", "\u25A3 Month"]].forEach(([k, label]) => {
    nav.append(el("button", { class: "gs-subbtn" + (todaySub === k ? " active" : ""), onClick: () => { todaySub = k; render(); } }, label));
  });
  board.append(nav);
  if (todaySub === "week") { renderCalendarWeek(); return; }
  if (todaySub === "month") { renderCalendar(); return; }
  renderToday();
}

function renderCalendarWeek() {
  const board = $("#board");
  const dateCol = STATE.columns.find((c) => c.type === "date");
  const statusCol = STATE.columns.find((c) => c.type === "status");
  const pCol = primaryCol();
  const start = new Date(calWeekStart);
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // Tasks by due date (dedupe linked copies, same pattern as the month grid).
  const byDay = {}; const seenPerDay = {};
  if (dateCol) filteredTasks().filter((t) => !t.parent_id).forEach((t) => {
    const dv = t.cells[dateCol.id]; if (!dv) return;
    const key = t.link_id ? "link:" + t.link_id : "name:" + String(t.cells[pCol.id] || "").trim().toLowerCase();
    const seen = seenPerDay[dv] || (seenPerDay[dv] = new Set());
    if (seen.has(key)) return; seen.add(key);
    (byDay[dv] = byDay[dv] || []).push(t);
  });
  // Outlook/hand-made blocks for whatever month(s) the week spans.
  const months = new Set(days.map((d) => `${d.getFullYear()}-${d.getMonth()}`));
  months.forEach((mk) => { const [y, m] = mk.split("-").map(Number); loadCalBlocks(y, m); });
  const blocksByDay = {};
  months.forEach((mk) => { const [y, m] = mk.split("-").map(Number); (calBlocks[`${y}-${m}`] || []).forEach((b) => { (blocksByDay[b.day] = blocksByDay[b.day] || []).push(b); }); });

  const wrap = el("div", { class: "calw" });
  const head = el("div", { class: "calw-head" });
  head.append(el("button", { class: "tool-btn", onClick: () => { calWeekStart.setDate(calWeekStart.getDate() - 7); calWeekStart = new Date(calWeekStart); render(); } }, "\u2039"));
  const label = `${days[0].toLocaleString("default", { month: "short", day: "numeric" })} \u2013 ${days[6].toLocaleString("default", { month: "short", day: "numeric" })}`;
  head.append(el("div", { class: "calw-title" }, label));
  head.append(el("button", { class: "tool-btn", onClick: () => { calWeekStart.setDate(calWeekStart.getDate() + 7); calWeekStart = new Date(calWeekStart); render(); } }, "\u203A"));
  head.append(el("button", { class: "tool-btn", onClick: () => { const d = new Date(); d.setDate(d.getDate() - d.getDay()); d.setHours(0, 0, 0, 0); calWeekStart = d; render(); } }, "This week"));
  head.append(icsImportZone());
  wrap.append(head);
  if (!dateCol) wrap.append(el("div", { class: "muted", style: "padding:2px 0 10px" }, "Add a Date column to place tasks; calendar events still show."));

  const grid = el("div", { class: "calw-grid" });
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  days.forEach((d, i) => {
    const ds = ymd(d);
    const isToday = ds === todayStr();
    const col = el("div", { class: "calw-col" + (isToday ? " today" : "") });
    col.append(el("div", { class: "calw-dow" }, DOW[i]));
    col.append(el("div", { class: "calw-date" }, String(d.getDate())));
    const evs = (blocksByDay[ds] || []).slice().sort((a, b) => String(a.start).localeCompare(String(b.start)));
    evs.slice(0, 4).forEach((b) => {
      col.append(el("div", { class: "calw-ev", style: `border-left-color:${b.color || "#5d7479"}`, title: `${fmtTime12(b.start)} \u00B7 ${b.label || ""}`, onClick: () => { scheduleDay = ds; scheduleBlocks = null; todaySub = "day"; setView("today"); } },
        el("b", {}, fmtTime12(b.start)), b.label || "(busy)"));
    });
    if (evs.length > 4) col.append(el("div", { class: "calw-more" }, `+${evs.length - 4} more`));
    (byDay[ds] || []).slice(0, 5).forEach((t) => {
      const bg = statusCol ? colorOf("status", t.cells[statusCol.id]) : "#00859b";
      col.append(el("div", { class: "calw-task", style: `background:${bg}` }, t.cells[pCol.id] || "Untitled"));
    });
    const extra = (byDay[ds] || []).length - 5;
    if (extra > 0) col.append(el("div", { class: "calw-more" }, `+${extra} more`));
    grid.append(col);
  });
  wrap.append(grid);
  board.append(wrap);
}

function render() {
  normalizeFoldedView();
  const board = $("#board");
  // Preserve each group's horizontal scroll so a re-render (cell edit, timer
  // click, etc.) doesn't snap wide tables back to the left.
  const savedScroll = {};
  board.querySelectorAll(".group[data-group]").forEach((gEl) => {
    const w = gEl.querySelector(".table-wrap");
    if (w && w.scrollLeft) savedScroll[gEl.dataset.group] = w.scrollLeft;
  });
  // Preserve the Today schedule's vertical scroll (only when the grid is
  // actually on screen — the brief "Loading…" state must not clobber it).
  {
    const tg = board.querySelector(".today-grid");
    if (tg) todayGridScroll = tg.scrollTop;
  }
  board.innerHTML = "";
  if (currentView === "table") renderTable();
  else if (currentView === "kanban") renderKanban();
  else if (currentView === "rewards") renderRewards();
  else if (currentView === "today") renderTodayHub();
  else if (currentView === "matrix") renderMatrix();
  else if (currentView === "goals") renderGoals();
  else if (currentView === "map") renderMap();
  else if (currentView === "vibe") renderVibe();
  else if (currentView === "improve") renderImprovements();
  else if (currentView === "studio") renderPromptStudio();
  else if (currentView === "zen") renderZen();
  else if (currentView === "ideas") renderIdeas();
  else if (currentView === "para") renderPara();
  else if (currentView === "notes") renderNotebookShell();
  else if (currentView === "career") renderCareer();
  else if (currentView === "signal") renderSignalBoost();
  else renderCalendar();
  // Restore scroll positions
  board.querySelectorAll(".group[data-group]").forEach((gEl) => {
    const s = savedScroll[gEl.dataset.group];
    if (s) { const w = gEl.querySelector(".table-wrap"); if (w) w.scrollLeft = s; }
  });
  if (currentView === "today") {
    const g = board.querySelector(".today-grid");
    if (g) {
      if (todayGridScroll != null) {
        g.scrollTop = todayGridScroll;          // stay where the user was
      } else {
        // Fresh open: jump to the first scheduled block so the day starts at
        // the first activity rather than an empty 6 AM.
        const fb = g.querySelector(".today-block");
        if (fb) g.scrollTop = Math.max(0, fb.offsetTop - 12);
      }
    }
  }
  updatePointsBadge();
}

</script>
<script>
/* ---- shell.js ---- */
/* Tuned In — shell.js
   Shell — modals, tags, edit menu, header, density, export, toolbar wire-up, focus timer, shortcuts, tab order
   Load order matters: see templates/index.html. Classic scripts share one global scope. */

// ---------------- Modals ----------------
// Sort/group state for the Vibe board and Prompt library (persisted in localStorage).
let psSort = (() => { try { return localStorage.getItem("rs_ps_sort") || "cat"; } catch (e) { return "cat"; } })();
let vibeGroup = (() => { try { return localStorage.getItem("rs_vibe_group") || "stage"; } catch (e) { return "stage"; } })();
let vibeSort = (() => { try { return localStorage.getItem("rs_vibe_sort") || "prio"; } catch (e) { return "prio"; } })();

function psInjectCss() {
  if (document.getElementById("ps-extra-css")) return;
  const css = `
  .ps-req{color:#c0392b;font-weight:800}
  .ps-help{font-size:11.5px;color:#9aa8a3;margin:4px 2px 0;line-height:1.4}
  .ps-reqmeter{font-size:12px;font-weight:700;color:#c0782a;margin:4px 0 10px}
  .ps-reqmeter.ok{color:#2f7a52}
  .ps-priorow{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
  .ps-priochip,.vibe-prio,.ps-card-prio{font-size:11.5px;font-weight:700;border:1px solid var(--c,#d9d9d6);color:var(--c,#5d6b66);background:#fff;border-radius:20px;padding:2px 11px;cursor:pointer;font-family:inherit}
  .ps-priochip.on,.vibe-prio.on{color:#fff}
  .ps-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 14px;font-size:12.5px;color:#5d6b66}
  .ps-bar .ps-barseg{display:flex;align-items:center;gap:6px}
  .ps-bar label{font-weight:700;color:#7a8a86;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px}
  .ps-seg{display:inline-flex;border:1px solid #d9d9d6;border-radius:8px;overflow:hidden}
  .ps-seg button{border:none;background:#fff;color:#00859b;font-weight:600;font-size:12px;padding:5px 11px;cursor:pointer;font-family:inherit;border-left:1px solid #e6ece9}
  .ps-seg button:first-child{border-left:none}
  .ps-seg button.on{background:#00859b;color:#fff}
  .ps-card-prio{padding:1px 9px;cursor:default}

function openModal(title, buildBody, opts) {
  opts = opts || {};
  const root = $("#modal-root");
  const overlay = el("div", { class: "modal-overlay" });
  let closed = false;
  function doClose() {
    if (closed) return; closed = true;
    try { if (opts.onClose) opts.onClose(); } catch (e) {}
    document.removeEventListener("keydown", onKey, true);
    overlay.remove();
  }
  function onKey(e) { if (e.key === "Escape") { e.preventDefault(); doClose(); } }
  overlay.addEventListener("click", (e) => { if (e.target === overlay) doClose(); });
  const modal = el("div", { class: "modal" });
  const head = el("div", { class: "modal-head" });
  head.append(el("h2", {}, title));
  head.append(el("button", { class: "modal-close", onClick: doClose }, "×"));
  modal.append(head);
  const body = el("div");
  modal.append(body);
  overlay.append(modal);
  root.append(overlay);
  document.addEventListener("keydown", onKey, true);
  buildBody(body, doClose);
  return { body, close: doClose };
}

function openAutomations() {
  openModal("Automations", (body) => {
    body.append(el("p", { class: "muted", style: "margin-top:0" }, "Rules run automatically whenever a task's cell changes."));
    const list = el("div", { style: "margin-bottom:16px" });
    const editorHost = el("div");

    const describe = (a) => {
      let act;
      if (a.action_type === "setToday") act = `set ${colName(a.action_col)} to today`;
      else if (a.action_type === "clear") act = `clear ${colName(a.action_col)}`;
      else if (a.action_type === "moveToGroup") act = `move to group "${a.action_val || "—"}"`;
      else if (a.action_type === "copyToGroup") act = `copy to group "${a.action_val || "—"}"`;
      else act = `set ${colName(a.action_col)} = ${a.action_val}`;
      return `When ${colName(a.trigger_col)} = ${a.trigger_val} → ${act}`;
    };

    const refresh = () => {
      list.innerHTML = "";
      if (STATE.automations.length === 0) list.append(el("div", { class: "muted" }, "No automations yet."));
      STATE.automations.forEach((a) => {
        const row = el("div", { class: "row" });
        const chk = el("input", { type: "checkbox" });
        chk.checked = !!a.enabled;
        chk.addEventListener("change", async () => {
          await api(`/api/automations/${a.id}/toggle`, { method: "PATCH" });
          a.enabled = a.enabled ? 0 : 1;
        });
        row.append(chk);
        const mid = el("div", { class: "grow" });
        mid.append(el("div", { style: "font-weight:600;font-size:13px" }, a.name || describe(a)));
        mid.append(el("div", { class: "auto-desc" }, describe(a)));
        row.append(mid);
        row.append(el("button", { class: "tool-btn", style: "padding:4px 10px", onClick: () => buildEditor(a) }, "Edit"));
        row.append(el("button", { class: "remove-link", onClick: async () => {
          await api(`/api/automations/${a.id}`, { method: "DELETE" });
          STATE.automations = STATE.automations.filter((x) => x.id !== a.id);
          refresh();
        } }, "×"));
        list.append(row);
      });
    };

    const buildEditor = (existing) => {
      editorHost.innerHTML = "";
      const statusColId = (STATE.columns.find((c) => c.type === "status") || STATE.columns[0]).id;
      const dateColId = (STATE.columns.find((c) => c.type === "date") || STATE.columns[0]).id;
      const draft = existing ? { ...existing } : {
        id: null, enabled: true, name: "",
        trigger_col: statusColId, trigger_val: "Done",
        action_col: dateColId, action_type: "setToday", action_val: "",
      };

      const ed = el("div", { class: "auto-editor" });
      const nameInp = el("input", { class: "field", placeholder: "Automation name (optional)", style: "width:100%;margin-bottom:12px" });
      nameInp.value = draft.name || "";
      nameInp.addEventListener("input", () => draft.name = nameInp.value);
      ed.append(nameInp);

      // trigger line
      const tline = el("div", { class: "auto-line" });
      tline.append(el("span", {}, "When"));
      const tcol = el("select", { class: "sel" });
      STATE.columns.forEach((c) => tcol.append(el("option", { value: c.id }, c.name)));
      tcol.value = draft.trigger_col;
      tline.append(tcol, el("span", {}, "="));
      const tvalHost = el("span");
      tline.append(tvalHost);
      ed.append(tline);

      // action line
      const aline = el("div", { class: "auto-line" });
      aline.append(el("span", {}, "Then"));
      const atype = el("select", { class: "sel" });
      [
        ["setToday", "set date to today"],
        ["setValue", "set value"],
        ["clear", "clear value"],
        ["moveToGroup", "move to group"],
        ["copyToGroup", "copy to group (linked)"],
      ].forEach(([v, l]) => atype.append(el("option", { value: v }, l)));
      atype.value = draft.action_type;
      aline.append(atype);
      const onLabel = el("span", {}, "on");
      aline.append(onLabel);
      const acol = el("select", { class: "sel" });
      STATE.columns.forEach((c) => acol.append(el("option", { value: c.id }, c.name)));
      acol.value = draft.action_col;
      aline.append(acol);
      const avalHost = el("span");
      aline.append(avalHost);
      ed.append(aline);

      const renderTriggerVal = () => {
        tvalHost.innerHTML = "";
        const vals = valuesFor(colType(draft.trigger_col));
        if (vals.length) {
          const s = el("select", { class: "sel" });
          vals.forEach((v) => s.append(el("option", { value: v }, v)));
          s.value = vals.includes(draft.trigger_val) ? draft.trigger_val : vals[0];
          draft.trigger_val = s.value;
          s.addEventListener("change", () => draft.trigger_val = s.value);
          tvalHost.append(s);
        } else {
          const i = el("input", { class: "sel", style: "width:110px", value: draft.trigger_val });
          i.addEventListener("input", () => draft.trigger_val = i.value);
          tvalHost.append(i);
        }
      };
      const renderActionVal = () => {
        avalHost.innerHTML = "";
        // move/copy to group: hide column picker; show a group-name input
        const isGroupAction = draft.action_type === "moveToGroup" || draft.action_type === "copyToGroup";
        onLabel.style.display = isGroupAction ? "none" : "";
        acol.style.display = isGroupAction ? "none" : "";
        if (isGroupAction) {
          const inp = el("input", { class: "sel", style: "width:160px", placeholder: "group name", value: draft.action_val, list: "rs-group-list" });
          inp.addEventListener("input", () => draft.action_val = inp.value);
          avalHost.append(inp);
          // datalist of existing groups for autocomplete
          if (!document.getElementById("rs-group-list")) {
            const dl = el("datalist", { id: "rs-group-list" });
            document.body.append(dl);
          }
          const dl = document.getElementById("rs-group-list");
          dl.innerHTML = "";
          allGroupNames().forEach((g) => dl.append(el("option", { value: g })));
          return;
        }
        if (draft.action_type !== "setValue") return;
        const vals = valuesFor(colType(draft.action_col));
        if (vals.length) {
          const s = el("select", { class: "sel" });
          s.append(el("option", { value: "" }, "—"));
          vals.forEach((v) => s.append(el("option", { value: v }, v)));
          s.value = draft.action_val || "";
          s.addEventListener("change", () => draft.action_val = s.value);
          avalHost.append(s);
        } else {
          const i = el("input", { class: "sel", style: "width:110px", placeholder: "value", value: draft.action_val });
          i.addEventListener("input", () => draft.action_val = i.value);
          avalHost.append(i);
        }
      };

      tcol.addEventListener("change", () => { draft.trigger_col = tcol.value; renderTriggerVal(); });
      atype.addEventListener("change", () => { draft.action_type = atype.value; renderActionVal(); });
      acol.addEventListener("change", () => { draft.action_col = acol.value; renderActionVal(); });
      renderTriggerVal();
      renderActionVal();

      const btns = el("div", { style: "display:flex;gap:8px;margin-top:14px" });
      btns.append(el("button", { class: "tool-btn accent-green", onClick: async () => {
        const payload = { ...draft };
        const resp = await api("/api/automations", { method: "POST", body: JSON.stringify(payload) });
        if (draft.id) {
          const idx = STATE.automations.findIndex((x) => x.id === draft.id);
          STATE.automations[idx] = { ...draft, enabled: draft.enabled ? 1 : 0 };
        } else {
          STATE.automations.push({ ...draft, id: resp.id, enabled: 1 });
        }
        editorHost.innerHTML = "";
        refresh();
      } }, "Save rule"));
      btns.append(el("button", { class: "tool-btn", onClick: () => editorHost.innerHTML = "" }, "Cancel"));
      ed.append(btns);
      editorHost.append(ed);
    };

    refresh();
    body.append(list);
    const newBtn = el("button", { class: "tool-btn accent-teal", onClick: () => buildEditor(null) }, "+ New Automation");
    body.append(newBtn);
    body.append(editorHost);
  });
}

function openTags() {
  openModal("Tags", (body) => {
    const buildSection = (kind, heading, hint) => {
      const section = el("div", { style: "margin-bottom:22px" });
      section.append(el("h3", { style: "margin:0 0 4px;font-family:Georgia,serif;font-size:17px;color:var(--ink)" }, heading));
      section.append(el("div", { class: "muted", style: "margin-bottom:10px" }, hint));
      const list = el("div");
      section.append(list);

      const refresh = () => {
        list.innerHTML = "";
        const entries = paletteFor(kind);
        entries.forEach((p, i) => {
          const row = el("div", { class: "row" });

          // reorder (priority ranking) — top = highest severity
          if (kind === "priority") {
            const arrows = el("div", { style: "display:flex;flex-direction:column;line-height:1" });
            const up = el("button", { class: "remove-link", style: "color:var(--mid-gray);font-size:12px", title: "Higher priority",
              onClick: async () => { if (i === 0) return; entries.splice(i - 1, 0, entries.splice(i, 1)[0]); await reorderPalette(kind); refresh(); render(); } }, "▲");
            const down = el("button", { class: "remove-link", style: "color:var(--mid-gray);font-size:12px", title: "Lower priority",
              onClick: async () => { if (i === entries.length - 1) return; entries.splice(i + 1, 0, entries.splice(i, 1)[0]); await reorderPalette(kind); refresh(); render(); } }, "▼");
            arrows.append(up, down);
            row.append(arrows);
          }

          const swatch = el("input", { type: "color", value: p.color, style: "width:32px;height:28px;border:none;background:none;cursor:pointer;padding:0" });
          swatch.addEventListener("change", async () => {
            p.color = swatch.value;
            await api(`/api/palette/${p.id}`, { method: "PATCH", body: JSON.stringify({ color: swatch.value }) });
            render();
          });
          row.append(swatch);

          const labelInp = el("input", { class: "field grow", value: p.label, style: "padding:5px 10px" });
          const commit = async () => {
            const newLabel = labelInp.value.trim();
            if (!newLabel || newLabel === p.label) { labelInp.value = p.label; return; }
            const old = p.label;
            p.label = newLabel;
            await api(`/api/palette/${p.id}`, { method: "PATCH", body: JSON.stringify({ label: newLabel }) });
            // reflect the rename in any task cells currently held in memory
            const kindCols = STATE.columns.filter((c) => c.type === kind).map((c) => c.id);
            STATE.tasks.forEach((t) => kindCols.forEach((cid) => { if (t.cells[cid] === old) t.cells[cid] = newLabel; }));
            render();
          };
          labelInp.addEventListener("blur", commit);
          labelInp.addEventListener("keydown", (e) => { if (e.key === "Enter") labelInp.blur(); });
          row.append(labelInp);

          if (kind === "priority") row.append(el("span", { class: "muted", style: "font-size:11px;min-width:54px;text-align:right" }, i === 0 ? "highest" : i === entries.length - 1 ? "lowest" : `rank ${i + 1}`));

          row.append(el("button", { class: "remove-link", onClick: async () => {
            await api(`/api/palette/${p.id}`, { method: "DELETE" });
            const idx = paletteFor(kind).findIndex((x) => x.id === p.id);
            paletteFor(kind).splice(idx, 1);
            refresh(); render();
          } }, "×"));

          list.append(row);
        });
      };
      refresh();

      const controls = el("div", { style: "display:flex;gap:8px;align-items:center;margin-top:8px" });
      const newLabel = el("input", { class: "field", placeholder: `New ${kind} tag`, style: "flex:1" });
      const newColor = el("input", { type: "color", value: kind === "priority" ? "#00859b" : "#00bfb8", style: "width:38px;height:34px;border:none;background:none;cursor:pointer;padding:0" });
      const addBtn = el("button", { class: "tool-btn accent-teal", onClick: async () => {
        if (!newLabel.value.trim()) return;
        const entry = await api("/api/palette", { method: "POST", body: JSON.stringify({ kind, label: newLabel.value.trim(), color: newColor.value }) });
        paletteFor(kind).push(entry);
        newLabel.value = ""; refresh(); render();
      } }, "Add");
      newLabel.addEventListener("keydown", (e) => { if (e.key === "Enter") addBtn.click(); });
      controls.append(newColor, newLabel, addBtn);
      section.append(controls);
      return section;
    };

    body.append(buildSection("status", "Statuses", "Custom status labels and colors for any Status column."));
    body.append(buildSection("priority", "Priorities", "Order sets ranking — top is highest. Used by “Sort by Priority.”"));
  });
}

// ---- Data history ----------------------------------------------------------
// Every write to a qualitative JSON blob (goals, notebook, PARA, skill lab,
// ideas) snapshots the previous value server-side. This browses those
// snapshots and restores one. Restores are themselves snapshotted, so there's
// no dead end.
function hbKB(n) {
  if (n == null) return "\u2014";
  return n < 10240 ? (n / 1024).toFixed(1) + " KB" : Math.round(n / 1024) + " KB";
}
function hbWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
const HB_LABELS = {
  goals_os: "Goals \u2014 goals, sections, identity, ledger",
  notebook: "Notebook \u2014 notes",
  para_os: "PARA \u2014 projects, areas, resources",
  sb_state: "Skill Lab \u2014 categories, resources, TIL",
  ideas_lab: "Ideas \u2014 ideas and brainstorms",
  career_notes: "Career notes",
};

async function openDataHistory() {
  openModal("Data history", async (body, close) => {
    body.classList.add("hb-modal");
    body.append(el("p", { class: "hb-intro" },
      "Each of these is stored as one block of text that the app rewrites as you work. "
      + "The previous version is kept every time it changes \u2014 up to 20, at most one per hour \u2014 so a bad save can be undone."));
    const host = el("div", { class: "hb-body" }, "Loading\u2026");
    body.append(host);

    let summary;
    try {
      summary = await api("/api/settings/history");
    } catch (err) {
      host.textContent = "Couldn't load history: " + err.message;
      return;
    }
    host.innerHTML = "";
    const keys = (summary.keys || []).filter((k) => k.versions > 0);
    if (!keys.length) {
      host.append(el("div", { class: "hb-empty" },
        "No versions recorded yet. They start accumulating the next time one of these changes."));
      return;
    }

    keys.forEach((k) => {
      const sec = el("div", { class: "hb-key" });
      const head = el("div", { class: "hb-key-head" });
      head.append(el("span", { class: "hb-key-name" }, HB_LABELS[k.key] || k.key));
      head.append(el("span", { class: "hb-key-meta" },
        `now ${hbKB(k.current_bytes)} \u00B7 ${k.versions} saved version${k.versions === 1 ? "" : "s"}`));
      sec.append(head);

      const list = el("div", { class: "hb-vers" }, "\u2026");
      sec.append(list);
      host.append(sec);

      api("/api/settings/history?key=" + encodeURIComponent(k.key)).then((d) => {
        list.innerHTML = "";
        (d.versions || []).forEach((v, i) => {
          const row = el("div", { class: "hb-ver" });
          row.append(el("span", { class: "hb-ver-when" }, hbWhen(v.saved_at)));
          const delta = k.current_bytes ? v.bytes - k.current_bytes : 0;
          const sizeCls = delta > 0 ? "hb-bigger" : delta < 0 ? "hb-smaller" : "";
          row.append(el("span", { class: "hb-ver-size " + sizeCls }, hbKB(v.bytes)));
          if (i === 0) row.append(el("span", { class: "hb-ver-tag" }, "most recent"));
          row.append(el("span", { style: "flex:1" }));
          row.append(el("button", { class: "hb-btn", title: "Show the first part of this version",
            onClick: () => previewVersion(v.id) }, "Preview"));
          row.append(el("button", { class: "hb-btn warn", title: "Put this version back",
            onClick: () => restoreVersion(v, k, close) }, "Restore"));
          list.append(row);
        });
      }).catch((e) => { list.textContent = "Couldn't load versions."; });
    });
  });
}

async function previewVersion(id) {
  try {
    const d = await api("/api/settings/history?id=" + encodeURIComponent(id));
    const v = d.version || {};
    let pretty = v.value || "";
    try { pretty = JSON.stringify(JSON.parse(pretty), null, 2); } catch (e) { /* not JSON */ }
    openModal("Version from " + hbWhen(v.saved_at), (body2) => {
      body2.append(el("div", { class: "hb-key-meta", style: "margin-bottom:8px" },
        `${v.key} \u00B7 ${hbKB(v.bytes)}`));
      const pre = el("pre", { class: "hb-pre" }, pretty.slice(0, 12000) + (pretty.length > 12000 ? "\n\u2026 truncated" : ""));
      body2.append(pre);
    });
  } catch (err) { alert("Couldn't load that version: " + err.message); }
}

async function restoreVersion(v, k, closeParent) {
  const msg = `Restore ${HB_LABELS[k.key] || k.key} to the version from ${hbWhen(v.saved_at)}?\n\n`
    + `That version is ${hbKB(v.bytes)}; the current one is ${hbKB(k.current_bytes)}.\n\n`
    + `The current version is saved to history first, so you can undo this.`;
  if (!confirm(msg)) return;
  try {
    await api("/api/settings/restore", { method: "POST", body: JSON.stringify({ id: v.id }) });
    if (typeof closeParent === "function") closeParent();
    await loadState();
    // Drop cached blobs so each view re-reads what was just restored
    if (typeof GOALS !== "undefined") GOALS = null;
    if (typeof PARA !== "undefined") PARA = null;
    if (typeof NOTES !== "undefined") NOTES = null;
    if (typeof SB !== "undefined") SB = null;
    render();
    alert("Restored. If that wasn't what you wanted, Data history now holds the version you just replaced.");
  } catch (err) { alert("Restore failed: " + err.message); }
}

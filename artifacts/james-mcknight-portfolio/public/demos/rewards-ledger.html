<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CardWise - Credit Card &amp; Spend Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#77b28c; --darkTeal:#00859b; --cyanTeal:#00bfb8; --medGreen:#38a66f;
    --lime:#bce194; --paleTeal:#cce7eb; --offWhite:#ebf2e6; --cream:#f8ecdb;
    --lightGray:#d9d9d6; --midGray:#b3b3b3; --ink:#143b40; --warn:#c47a2c;
    --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(1200px 500px at 100% -10%,rgba(0,191,184,.18),transparent 60%),
      radial-gradient(900px 500px at -10% 110%,rgba(119,178,140,.20),transparent 55%),var(--offWhite);min-height:100vh;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 60px}
  header{padding:34px 0 16px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:-1px;margin:0;
    background:linear-gradient(100deg,var(--darkTeal),var(--medGreen));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{opacity:.6;font-size:14px;font-weight:500}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin:18px 0 6px}
  .kpi{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:15px 17px;
    box-shadow:0 6px 22px rgba(0,80,90,.07);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--darkTeal))}
  .kpi .lab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--midGray)}
  .kpi .val{font-family:var(--serif);font-weight:700;font-size:25px;margin-top:5px;color:var(--accent,var(--darkTeal));line-height:1}
  .kpi .sub{font-size:11.5px;color:var(--midGray);margin-top:5px}
  nav{display:flex;gap:3px;margin-top:22px;flex-wrap:wrap}
  nav button{border:none;cursor:pointer;background:transparent;font-family:var(--sans);font-weight:600;font-size:13.5px;
    color:var(--ink);opacity:.55;padding:11px 14px;border-radius:11px 11px 0 0;transition:.15s}
  nav button:hover{opacity:.85}
  nav button.active{opacity:1;background:#fff;color:var(--darkTeal);box-shadow:0 -3px 14px rgba(0,80,90,.06)}
  .yearbar{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
  .yearbar .yrlabel{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--midGray)}
  .yearsel{display:flex;gap:6px;flex-wrap:wrap}
  .yrbtn{border:1px solid var(--paleTeal);background:#fff;color:var(--darkTeal);cursor:pointer;font-family:var(--sans);font-weight:600;font-size:13px;padding:5px 14px;border-radius:999px;transition:.15s}
  .yrbtn:hover{background:var(--offWhite)}
  .yrbtn.active{background:var(--darkTeal);color:#fff;border-color:var(--darkTeal)}
  .subexcl{opacity:.72;font-style:italic}
  .soon{display:inline-block;background:#f6d6cf;color:#b23b1e;border-radius:999px;padding:0 6px;font-size:10px;font-weight:700;margin-left:2px}
  .rchip{display:inline-block;margin:2px 0 4px;font-size:12.5px;font-weight:600;color:var(--darkTeal);background:var(--paleTeal);border:1px solid transparent;border-radius:8px;padding:5px 11px}
  .rchip.soon{background:var(--warmCream);color:#9a7b3a;border-color:#cdb892}
  .rchip.urgent{background:#f6d6cf;color:#b23b1e;border-color:#e7a899}
  .rchip.none{background:#fff;border:1px dashed var(--lightGray);color:var(--midGray);cursor:pointer;font-weight:600}
  .rchip.none:hover{border-color:var(--darkTeal);color:var(--darkTeal)}
  .rcal{border:1px solid var(--lightGray);border-radius:12px;padding:12px 14px;margin:4px 0 18px;background:var(--offWhiteGreen)}
  .rcal-row{display:grid;grid-template-columns:1.6fr 1fr .6fr .8fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--lightGray);font-size:13px}
  .rcal-row:last-of-type{border-bottom:none}
  .rcal-name{font-weight:600;color:var(--ink)}
  .rcal-date{color:var(--darkTeal);font-weight:600}
  .rcal-days{font-size:11px;font-weight:700;color:var(--midGray);text-align:right}
  .rcal-fee{font-size:11px;color:var(--midGray);text-align:right}
  .rcal-row.soon .rcal-days{color:#9a7b3a}
  .rcal-row.urgent .rcal-days{color:#b23b1e}
  .rcal-row.none{opacity:.8}
  .tracker-count{display:flex;align-items:baseline;gap:9px;margin:2px 0 10px}
  .tc-num{font-size:34px;font-weight:800;color:var(--darkTeal);font-family:var(--serif),'Fraunces',serif;line-height:1}
  .tracker-count.soon .tc-num{color:#9a7b3a}
  .tracker-count.urgent .tc-num{color:#b23b1e}
  .tc-lbl{font-size:13px;color:var(--midGray);font-weight:600}
  .filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
  .filterbar label{font-weight:600;font-size:12.5px;color:var(--midGray)}
  .filterbar select{padding:5px 9px;font-size:12.5px;border:1px solid var(--lightGray);border-radius:8px;background:#fff}
  .catsel{padding:3px 6px;font-size:12px;border:1px solid var(--cyanTeal);border-radius:6px;background:var(--offWhiteGreen);font-weight:600;color:var(--darkTeal)}
  .subexcl .exclnote{font-size:10px;font-style:normal;background:var(--lightGray);color:var(--midGray);border-radius:999px;padding:1px 6px;margin-left:4px;letter-spacing:.02em}
  .rangebar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
  .rbtn{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--lightGray);background:#fff;color:var(--darkTeal);cursor:pointer}
  .rbtn.active{background:var(--darkTeal);color:#fff;border-color:var(--darkTeal)}
  .customrow{font-size:12.5px;color:var(--midGray);margin:-4px 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .customrow input{font:inherit;padding:3px 6px;border:1px solid var(--lightGray);border-radius:6px}
  .trendchart{width:100%;overflow-x:auto;border:1px solid var(--lightGray);border-radius:10px;padding:8px 4px;background:linear-gradient(180deg,var(--offWhiteGreen),#fff)}
  .tsvg{display:block;min-width:100%;height:auto;font-family:var(--sans)}
  .tsvg .grid{stroke:var(--lightGray);stroke-width:1}
  .tsvg .ylab{fill:var(--midGray);font-size:9px;text-anchor:end}
  .tsvg .xlab{fill:var(--midGray);font-size:9.5px;text-anchor:middle}
  .tsvg .tot{fill:var(--darkTeal);font-size:9px;font-weight:700;text-anchor:middle}
  .tsvg rect{cursor:pointer}.tsvg rect:hover{opacity:.82}
  .catchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .boost{border:1px solid var(--cyanTeal);border-radius:12px;padding:14px 16px;margin:6px 0 18px;background:linear-gradient(180deg,var(--paleTeal),#fff)}
  .boostrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
  .boostrow label{font-size:12.5px;font-weight:600;color:var(--ink)}
  .boostrow input{padding:9px 11px;font-size:16px;border:1px solid var(--cyanTeal);border-radius:9px;background:#fff;font-weight:700;color:var(--darkTeal);max-width:240px}
  .boostout{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .bo-cell{flex:1;min-width:130px;background:#fff;border:1px solid var(--lightGray);border-radius:10px;padding:10px 12px;text-align:center}
  .bo-num{font-family:var(--serif),'Fraunces',serif;font-size:26px;font-weight:800;color:var(--darkTeal);line-height:1.1}
  .bo-lbl{font-size:11px;color:var(--midGray);font-weight:600;margin-top:3px}
  .catchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--lightGray);background:#fff;color:var(--ink);cursor:pointer}
  .catchip.off{opacity:.45;text-decoration:line-through}
  .cardbars{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .cardbar-row{display:grid;grid-template-columns:1.5fr 2fr auto auto;gap:10px;align-items:center;font-size:12.5px}
  .cb-name{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb-tag{font-size:9px;text-transform:uppercase;background:var(--lightGray);color:var(--midGray);border-radius:999px;padding:0 5px;font-weight:700;letter-spacing:.03em}
  .cb-track{background:var(--paleTeal);border-radius:6px;height:15px;overflow:hidden}
  .cb-fill{height:100%;border-radius:6px;min-width:2px}
  .cb-amt{font-weight:700;color:var(--darkTeal);text-align:right;min-width:62px}
  .cb-pct{color:var(--midGray);text-align:right;min-width:34px;font-size:11px}
  .catchip .sw{width:11px;height:11px;border-radius:3px;border:2px solid}
  .catchip.partial{opacity:.7}
  .groupchip{display:inline-flex;align-items:stretch;border:1px solid var(--lightGray);border-radius:999px;overflow:hidden}
  .groupchip .gtog{font-size:11.5px;font-weight:700;padding:4px 10px;border:0;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .groupchip.on .gtog{background:var(--paleTeal,#cce7eb)}
  .groupchip.off .gtog{opacity:.45;text-decoration:line-through}
  .groupchip.partial .gtog{background:var(--offWhiteGreen,#ebf2e6)}
  .groupchip .gdot{width:9px;height:9px;border-radius:50%;background:var(--darkTeal,#00859b)}
  .groupchip.off .gdot{background:var(--midGray,#b3b3b3)}
  .groupchip .gx{border:0;border-left:1px solid var(--lightGray);background:#fff;color:var(--midGray);cursor:pointer;padding:0 8px;font-size:13px}
  .groupchip .gx:hover{color:var(--ink)}
  .grpedit{border:1px solid var(--lightGray);border-radius:12px;padding:12px;margin:4px 0 10px;background:var(--cream,#f8ecdb)}
  .grpedit input[type=text]{padding:6px 9px;font-size:13px;border:1px solid var(--lightGray);border-radius:8px;background:#fff;min-width:200px}
  .grpedit .gcats{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0}
  .grpedit .gcats label{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .grpedit .gbtns{display:flex;gap:8px}
  .ttable{overflow-x:auto;border:1px solid var(--lightGray);border-radius:10px}
  .ttable table{border-collapse:collapse;width:100%;font-size:12px}
  .ttable th,.ttable td{padding:6px 10px;border-bottom:1px solid var(--lightGray);white-space:nowrap}
  .ttable th{background:var(--paleTeal);color:var(--darkTeal);text-align:left;font-size:11px;position:sticky;top:0}
  .ttable td.num,.ttable th.num{text-align:right}
  .ttable .tot{font-weight:700;color:var(--darkTeal)}
  .ttable .sumrow td{border-top:2px solid var(--midGray);background:var(--offWhiteGreen)}
  .ttable .thcat{cursor:pointer;text-decoration:underline dotted}
  .ttable .thcat:hover{background:var(--cyanTeal);color:#fff}
  .cadpill{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--paleTeal);color:var(--darkTeal);border-radius:999px;padding:1px 7px;cursor:pointer;font-weight:700;margin-left:6px;vertical-align:middle}
  .cadpill:hover{background:var(--cyanTeal);color:#fff}
  .periodwrap{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;flex-wrap:wrap}
  .periods{display:flex;gap:3px;flex-wrap:wrap}
  .pcell{font-size:10px;font-weight:700;min-width:22px;text-align:center;padding:3px 5px;border-radius:5px;font-family:var(--sans)}
  .pcell.got{background:var(--medGreen);color:#fff}
  .pcell.miss{background:#f6d6cf;color:#b23b1e;border:1px solid #e7a899}
  .pcell.cur{background:var(--warmCream);color:#9a7b3a;border:1px dashed #cdb892}
  .pcell.man{background:var(--cyanTeal);color:#fff}
  .pcell[onclick]{cursor:pointer}
  .pcell[onclick]:hover{outline:2px solid var(--darkTeal);outline-offset:1px}
  .pcell.fut{background:var(--lightGray);color:var(--midGray)}
  .missnote{font-size:11px;font-weight:700;color:#b23b1e;white-space:nowrap}
  .okmiss{font-size:11px;font-weight:700;color:var(--medGreen);white-space:nowrap}
  .panel{background:#fff;border-radius:0 18px 18px 18px;padding:24px;box-shadow:0 10px 34px rgba(0,80,90,.08);min-height:360px}
  h2.sec{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 6px}
  h3.sub{font-family:var(--serif);font-weight:600;font-size:16px;margin:24px 0 10px}
  p.note{font-size:13px;color:var(--midGray);margin:0 0 14px;line-height:1.55}
  .banner{background:var(--cream);border:1px solid #e6c9a0;border-radius:12px;padding:12px 16px;display:flex;
    justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;font-size:13.5px}
  .banner.warn{background:#fff4e8}
  .banner b{color:var(--warn)}
  .bar-row{display:grid;grid-template-columns:150px 1fr 84px;align-items:center;gap:12px;margin-bottom:8px}
  .bar-row .name{font-size:12.5px;font-weight:600}
  .bar-track{background:var(--offWhite);border-radius:7px;height:20px;overflow:hidden}
  .bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyanTeal),var(--medGreen))}
  .bar-row .amt{font-size:12.5px;text-align:right;color:var(--midGray)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .chip{background:var(--paleTeal);border-radius:12px;padding:10px 12px}
  .chip .c{font-size:10.5px;font-weight:700;color:var(--darkTeal);text-transform:uppercase;letter-spacing:.4px}
  .chip .n{font-size:13px;font-weight:600;margin-top:3px}
  .chip .m{font-size:12.5px;font-weight:700;color:var(--medGreen)}
  .cardbox{border:1px solid var(--lightGray);border-radius:16px;padding:16px;margin-bottom:14px}
  .cardbox .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .cardbox .cn{font-weight:700;font-size:16px}
  .cardbox .meta{font-size:12px;color:var(--midGray)}
  .mults{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .mult{font-size:11px;background:var(--offWhite);border-radius:7px;padding:3px 9px;font-weight:600}
  .credit-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px dashed var(--lightGray);flex-wrap:wrap}
  .credit-line .meter{flex:1;height:8px;background:var(--offWhite);border-radius:5px;overflow:hidden;max-width:120px;min-width:60px}
  .credit-line .meter i{display:block;height:100%;background:var(--medGreen)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead tr{background:var(--darkTeal);color:#fff;text-align:left}
  th,td{padding:8px 10px}
  tbody tr{border-bottom:1px solid var(--lightGray)}
  tr.miss{background:var(--cream)}
  .pos{color:var(--medGreen);font-weight:700}
  .warnc{color:var(--warn);font-weight:700}
  .neg{color:#b4534b;font-weight:700}
  label{display:block;font-size:12px;font-weight:600;margin:0 0 4px}
  input,select,textarea{font-family:var(--sans);font-size:14px;width:100%;padding:9px 11px;border:1px solid var(--lightGray);border-radius:9px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:80px}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:14px;color:#fff;
    background:linear-gradient(100deg,var(--darkTeal),var(--cyanTeal));padding:10px 18px;border-radius:10px;transition:.15s}
  .btn:hover{filter:brightness(1.04)}
  .btn.ghost{background:transparent;color:var(--darkTeal);border:1.5px solid var(--darkTeal)}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
  .linkish{background:none;border:none;color:var(--darkTeal);font-weight:600;cursor:pointer;font-size:12px;padding:0}
  .empty{text-align:center;color:var(--midGray);padding:36px 10px}
  .empty .big{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px}
  .goalwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  input[type=range]{flex:1;min-width:200px;accent-color:var(--darkTeal)}
  .goalval{font-family:var(--serif);font-weight:700;font-size:28px;color:var(--darkTeal);min-width:90px}
  .foot{text-align:center;font-size:12px;color:var(--midGray);margin-top:18px;line-height:1.6}
  .row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .pill.held{background:var(--offWhite);color:var(--medGreen)}
  .pill.drop{background:var(--lightGray);color:#6b6b66}
  .pill.plan{background:var(--cream);color:var(--warn)}
  .sub-prog{height:14px;background:var(--offWhite);border-radius:8px;overflow:hidden;margin-top:6px}
  .sub-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--medGreen),var(--lime))}
  .vrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;font-size:13px;padding:5px 0;border-top:1px dashed var(--lightGray);align-items:center}
  .vhead{font-weight:700;color:var(--midGray);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-top:none}
  .num{text-align:right;min-width:64px}
  /* ---- Money Guy / Dave Ramsey principle pages ---- */
  .finbox{border:1px solid var(--cyanTeal);border-radius:14px;padding:14px 16px;margin:8px 0 18px;
    background:linear-gradient(180deg,var(--paleTeal),#fff)}
  .finbox h3{margin:2px 0 4px;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--darkTeal)}
  .fingrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;margin-top:10px}
  .fin-f{display:flex;flex-direction:column;gap:3px}
  .fin-f label{font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--ink);opacity:.8}
  .fin-f .hint{font-size:10.5px;color:var(--midGray);font-weight:500}
  .fin-in{display:flex;align-items:center;gap:0;border:1px solid var(--lightGray);border-radius:9px;background:#fff;overflow:hidden}
  .fin-in .pre{padding:0 4px 0 9px;color:var(--midGray);font-weight:700;font-size:14px}
  .fin-in .post{padding:0 9px 0 4px;color:var(--midGray);font-weight:700;font-size:13px}
  .fin-in input{border:0;outline:0;padding:9px 8px;font:inherit;font-size:15px;font-weight:700;color:var(--darkTeal);width:100%;background:transparent}
  .fin-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);
    background:#fff;border:1px solid var(--lightGray);border-radius:9px;padding:8px 11px;cursor:pointer;user-select:none}
  .fin-toggle input{width:16px;height:16px;accent-color:var(--darkTeal);cursor:pointer}
  .fin-note{font-size:11.5px;color:var(--midGray);margin:6px 2px 0}
  .finstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
  .fs-cell{background:#fff;border:1px solid var(--lightGray);border-radius:12px;padding:11px 13px;position:relative;overflow:hidden}
  .fs-cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--darkTeal))}
  .fs-lbl{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--midGray)}
  .fs-val{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--accent,var(--darkTeal));line-height:1.05;margin-top:3px}
  .fs-sub{font-size:11px;color:var(--midGray);margin-top:3px}
  .gauge{height:13px;border-radius:7px;background:var(--offWhite);overflow:hidden;margin:7px 0 4px;position:relative;border:1px solid var(--lightGray)}
  .gauge i{display:block;height:100%;border-radius:7px}
  .gauge .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

function bestForCat(){
  const m={}, pool=held().length?held():DATA.cards;
  CATS.forEach(cat=>{ let best=null;
    pool.forEach(c=>{ const v=mult(c,cat)*(c.pv/100); // value-per-dollar, accounts for point worth
      if(!best||v>best.vpd) best={card:c,m:mult(c,cat),vpd:v}; });
    m[cat]=best;
  });
  return m;
}
function spendByCategory(txns){ const m={}; CATS.forEach(c=>m[c]=0); txns.forEach(t=>m[t.category]=(m[t.category]||0)+t.amount); return m; }
function missedRewards(txns){
  const best=bestForCat(); let missedVal=0; const rows=[];
  txns.forEach(t=>{ const used=cardById(t.cardId); if(!used)return;
    const uv=mult(used,t.category)*(used.pv/100); const b=best[t.category];
    const gap=(b.vpd-uv)*t.amount;
    if(gap>0.5){ missedVal+=gap; rows.push({...t,used,uv:mult(used,t.category),b,gapVal:gap}); }
  });
  rows.sort((a,b)=>b.gapVal-a.gapVal);
  return {dollars:missedVal,rows};
}
function rateFor(card,t){ const mm=card.merchantMult; if(mm){ const m=(t.merchant||"").toLowerCase(); for(const k in mm){ if(m.includes(k)) return mm[k]; } } return mult(card,t.category); }
function earnedValue(card){ // ongoing earn from categorized spend (with merchant overrides like Lyft 10x), in $
  return txOf(card.id).reduce((s,t)=>s+t.amount*rateFor(card,t)*(card.pv/100),0);
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function creditMonthsAuto(card,cr){ // {monthNumber: amount} auto-detected from statement, within YEAR
  const out={};
  if(!cr.match) return out;
  const bag=DATA._detectedCredits&&DATA._detectedCredits[card.id]; if(!bag) return out;
  const hit=Object.entries(bag).find(([k])=>k.includes(cr.match)); if(!hit) return out;
  Object.entries(hit[1]).forEach(([ym,amt])=>{ if(typeof ym==='string'&&ym.startsWith(YEAR)){ const m=+ym.slice(5,7); if(m>=1&&m<=12) out[m]=(out[m]||0)+amt; } });
  return out;
}
function manualMonths(cr){ // {monthNumber: amount} the user marked by hand, within YEAR
  const out={}, man=cr.manualByMonth||{};
  Object.entries(man).forEach(([ym,amt])=>{ if(ym.startsWith(YEAR)){ const m=+ym.slice(5,7); if(m>=1&&m<=12) out[m]=amt; } });
  return out;
}
function creditMonths(card,cr){ // combined: auto-detected, with manual filling any month that has no auto value
  const out=creditMonthsAuto(card,cr); const man=manualMonths(cr);
  Object.entries(man).forEach(([m,amt])=>{ if(out[m]==null) out[+m]=amt; });
  return out;
}
function periodMeta(cad){
  if(cad==='monthly')    return {n:12, span:1, lab:i=>MONTHS[i]};
  if(cad==='quarterly')  return {n:4,  span:3, lab:i=>'Q'+(i+1)};
  if(cad==='semiannual') return {n:2,  span:6, lab:i=>'H'+(i+1)};
  return {n:1, span:12, lab:()=>YEAR};
}
function isBoostCredit(cr){ return /10%\s*of\s*purchases/i.test(cr.label||''); } // CSR 10%-of-spend anniversary bonus
function boostValue(card){ const spend=txOf(card.id).reduce((s,t)=>s+t.amount,0); return +(Math.round(spend*0.10)*((card.pv||0)/100)).toFixed(2); }
function creditNominal(card,cr){ return isBoostCredit(cr)? boostValue(card) : (cr.nominal||0); } // effective face value (boost is dynamic, uncapped)
function creditActual(card,cr){ // captured this YEAR: manual per-year edit, else auto+manual months, else spend, capped at nominal
  if(isBoostCredit(cr)) return boostValue(card); // $ value of 10%-of-spend bonus points accrued so far in YEAR (uncapped)
  const aby=cr.actualByYear && cr.actualByYear[YEAR];
  if(aby!=null) return Math.min(aby,cr.nominal);
  if(cr.source==='spend'){ // auto-applied credit (e.g. CSR $300 travel) — realized by spend in its categories
    const cats=cr.spendCats||[];
    const sum=txOf(card.id).filter(t=>cats.includes(t.category)).reduce((s,t)=>s+t.amount,0);
    return Math.min(sum,cr.nominal);
  }
  const sum=Object.values(creditMonths(card,cr)).reduce((s,v)=>s+v,0);
  return Math.min(sum,cr.nominal);
}
function togglePeriod(cid,crid,i){ // mark/unmark a period as used by hand (only for periods with no auto-detection)
  const c=cardById(cid), cr=c.credits.find(x=>x.id===crid);
  const pm=periodMeta(cr.cadence||'annual'); const span=pm.span, mStart=i*span+1;
  const auto=creditMonthsAuto(c,cr); for(let k=0;k<span;k++){ if(auto[mStart+k]>0) return; } // auto already covers it
  cr.manualByMonth=cr.manualByMonth||{};
  const months=[]; for(let k=0;k<span;k++) months.push(`${YEAR}-${String(mStart+k).padStart(2,'0')}`);
  const on=months.some(ym=>cr.manualByMonth[ym]!=null);
  if(on) months.forEach(ym=>delete cr.manualByMonth[ym]);
  else cr.manualByMonth[months[0]]=+(cr.nominal/pm.n).toFixed(2);
  touch(); persist();
}
function subSpend(card){
  if(!card.sub) return 0;
  let txns=txAll(card.id);                 // SUBs are one-time, not annual — count all card spend
  if(card.sub.start) txns=txns.filter(t=>t.date>=card.sub.start);
  return txns.reduce((s,t)=>s+t.amount,0);
}
function cardValue(card){
  const credNominal=card.credits.reduce((s,c)=>s+creditNominal(card,c),0);
  const credTargeted=card.credits.reduce((s,c)=>s+(c.targeted||0),0);
  const credActual=card.credits.reduce((s,c)=>s+creditActual(card,c),0);
  const subN=card.sub?card.sub.value:0;
  const subMet=card.sub?subSpend(card)>=card.sub.spendReq:false;
  const subA=subMet?subN:0;
  const earn=earnedValue(card);
  // NOTE: signup/upgrade bonuses (subN/subA) are shown for reference but EXCLUDED from totals/net,
  // so the figures reflect recurring value actually captured rather than one-time bonuses.
  return {credNominal,credTargeted,credActual,subN,subA,subMet,earn,
    nominal:credNominal, targeted:credTargeted, actual:credActual,
    net:credActual+earn-(card.annualFee||0)};
}
function creditsAtRisk(){
  const today=new Date(); today.setHours(0,0,0,0); const out=[];
  held().forEach(c=>c.credits.forEach(cr=>{
    const cap=creditActual(c,cr); const rem=Math.max(0,(cr.nominal||0)-cap);
    const reset=cr.resets?new Date(cr.resets):null;
    const days=reset?Math.round((reset-today)/86400000):9999;
    if(rem>0) out.push({card:c.name,label:cr.label,rem,days,urgent:reset&&days<=60});
  }));
  return out.sort((a,b)=>(b.rem/Math.max(b.days,1))-(a.rem/Math.max(a.days,1)));
}

function nextRenewal(c){ // treats card.renewal (YYYY-MM-DD anniversary) as recurring; returns next upcoming occurrence
  if(!c.renewal) return null;
  const base=new Date(c.renewal+'T00:00:00'); if(isNaN(base)) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  let next=new Date(today.getFullYear(), base.getMonth(), base.getDate());
  if(next<today) next=new Date(today.getFullYear()+1, base.getMonth(), base.getDate());
  return {next, days:Math.round((next-today)/86400000),
    label: next.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
}

function viewValue(){

          const pastEnd=(+YEAR<curY)||(+YEAR===curY&&mE<curM);
          const current=(+YEAR===curY&&mS<=curM&&curM<=mE);
          let cls,tip;

          else if(pastEnd){ cls='miss'; miss++; tip=pm.lab(i)+': missed — tap if you used it'; }
          else if(current){ cls='cur'; tip=pm.lab(i)+': this period — tap to mark used'; }
          else { cls='fut'; tip=pm.lab(i)+': upcoming — tap to mark used'; }
          const click=a>0?'':` onclick="togglePeriod('${c.id}','${cr.id}',${i})"`;
          cells.push(`<span class="pcell ${cls}"${click} title="${tip}">${pm.lab(i)}</span>`);
        }
        periodWrap=`<div class="periodwrap">${miss?`<span class="missnote">${miss} missed</span>`:`<span class="okmiss">on track</span>`}<div class="periods">${cells.join("")}</div></div>`;
      }
      const autoCapTotal=Object.values(creditMonthsAuto(c,cr)).reduce((s,v)=>s+v,0);
      const auto=!manual && cr.match && autoCapTotal>0;
      const marked=!manual && autoCapTotal===0 && Object.keys(cr.manualByMonth||{}).some(ym=>ym.startsWith(YEAR));
      return `<div class="credit-line">
        <span><b>${esc(cr.label)}</b> ${auto?'<span class="pill held">auto</span>':marked?'<span class="pill plan">marked</span>':''}<span class="cadpill" title="click to change cadence" onclick="cycleCadence('${c.id}','${cr.id}')">${cad}</span></span>
        <div class="meter"><i style="width:${pct}%"></i></div>

    }).join("");
    let subLine="";
    if(c.sub){ const sp=subSpend(c); const pr=Math.min(1,sp/(c.sub.spendReq||1));
      subLine=`<div style="margin-top:8px"><b>${esc(c.sub.label)}</b> — ${f0(c.sub.value)} value
        ${c.sub.spendReq?`<div class="sub-prog"><i style="width:${pr*100}%"></i></div>
        <div class="meta">${f0(sp)} of ${f0(c.sub.spendReq)} spend ${v.subMet?'✓ earned':`(${Math.round(pr*100)}%)`}</div>`:''}</div>`;
    }
    html+=`<div class="cardbox">
      <div class="top"><div><span class="cn">${esc(c.name)}</span>
        ${statusPill(c)}
        <div class="meta">${esc(c.issuer)} · AF ${f0(c.annualFee)} · pts @ ${c.pv}¢${renewPill(c)}</div></div>
        <div style="text-align:right"><div class="${v.net>=0?'pos':'neg'}" style="font-size:18px">${f0(v.net)} net</div>
        <div class="meta">actual+earned−AF</div></div></div>
      <div class="vrow vhead"><span>Layer</span><span class="num">Nominal</span><span class="num">Targeted</span><span class="num">Actual</span></div>
      <div class="vrow"><span>Perks &amp; credits</span><span class="num">${f0(v.credNominal)}</span><span class="num">${f0(v.credTargeted)}</span><span class="num pos">${f0(v.credActual)}</span></div>
      <div class="vrow"><span><b>Total</b></span><span class="num">${f0(v.nominal)}</span><span class="num">${f0(v.targeted)}</span><span class="num pos">${f0(v.actual)}</span></div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--midGray)">+ Earned from spend: <b class="pos">${f0(v.earn)}</b>
        ${txOf(c.id).length?`(${txOf(c.id).length} txns)`:'(no spend imported)'}</div>
      ${c.sub?`<div class="vrow subexcl"><span>${esc(c.sub.label)} <span class="exclnote">not in totals</span></span><span class="num">${f0(v.subN)}</span><span class="num">—</span><span class="num">${v.subMet?f0(v.subA)+' earned':'pending'}</span></div>`:''}
      ${credits?`<h3 class="sub" style="margin:14px 0 4px;font-size:13px">Credits</h3>${credits}`:''}
    </div>`;

  return html;

const RANGES=[["t12","Trailing 12 mo"],["ytd","YTD"],["prior","Prior year"],["quarter","Quarterly (this yr)"],["month","Monthly (this yr)"],["custom","Custom"]];
function trendWindow(){ // -> {fromYM, toYM, gran} where gran is 'month' or 'quarter'
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
  const ym=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
  switch(TREND.range){
    case 'ytd':     return {fromYM:ym(cy,1), toYM:ym(cy,cm), gran:'month'};
    case 'prior':   return {fromYM:ym(cy-1,1), toYM:ym(cy-1,12), gran:'month'};
    case 'quarter': return {fromYM:ym(cy,1), toYM:ym(cy,12), gran:'quarter'};
    case 'month':   return {fromYM:ym(cy,1), toYM:ym(cy,12), gran:'month'};
    case 'custom':  return {fromYM:TREND.from||ym(cy,1), toYM:TREND.to||ym(cy,cm), gran:'month'};
    default: { // trailing 12 months
      let fm=cm-11, fy=cy; if(fm<=0){fm+=12; fy-=1;} return {fromYM:ym(fy,fm), toYM:ym(cy,cm), gran:'month'};
    }
  }
}
function buildBuckets(){ // returns {units, data:[{key:amount}], series:[keys], colorOf, labelOf, gran}; honors active toggles and the Category|Card grouping
  const {fromYM,toYM,gran}=trendWindow();
  const byCard = TREND.groupBy==='card';
  const [fy,fmo]=fromYM.split('-').map(Number), [ty,tmo]=toYM.split('-').map(Number);
  // enumerate months in range
  const months=[]; let y=fy,m=fmo;
  while(y<ty||(y===ty&&m<=tmo)){ months.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m>12){m=1;y++;} if(months.length>120)break; }
  let units; // each unit = {label, key, months:[]}
  if(gran==='quarter'){
    const byq={};
    months.forEach(mk=>{ const yy=mk.slice(0,4), q=Math.floor((+mk.slice(5,7)-1)/3)+1; const key=`${yy}-Q${q}`; (byq[key]=byq[key]||[]).push(mk); });
    units=Object.entries(byq).map(([key,mm])=>({label:key.slice(2), key, months:mm}));
  } else {
    const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    units=months.map(mk=>({label:MN[+mk.slice(5,7)-1]+" '"+mk.slice(2,4), key:mk, months:[mk]}));
  }
  // sum spend per unit per series-key (series key = category name OR card id)
  const byMonthKey={}; // 'YYYY-MM' -> {key: amt}
  DATA.transactions.forEach(t=>{ const mk=(t.date||'').slice(0,7); if(!mk)return; const k=byCard?t.cardId:t.category; if(!k)return; (byMonthKey[mk]=byMonthKey[mk]||{}); byMonthKey[mk][k]=(byMonthKey[mk][k]||0)+t.amount; });
  // candidate series order: cards by DATA.cards order, categories by CATS order
  let allKeys = byCard ? DATA.cards.map(c=>c.id) : CATS.slice();
  // include any stray keys present in data but not in the canonical list (e.g. retired cards)
  Object.values(byMonthKey).forEach(row=>Object.keys(row).forEach(k=>{ if(!allKeys.includes(k)) allKeys.push(k); }));
  const series = allKeys.filter(k=>!TREND.off.has(k));
  const data=units.map(u=>{ const row={}; series.forEach(k=>{ let s=0; u.months.forEach(mk=>{ s+=(byMonthKey[mk]&&byMonthKey[mk][k])||0; }); if(s>0) row[k]=s; }); return row; });
  const colorOf = byCard ? (k=>cardColor(k)) : (k=>catColor(k));
  const labelOf = byCard ? (k=>{ const c=cardById(k); return c?c.name:k; }) : (k=>k);
  return {units, data, series, colorOf, labelOf, gran, byCard};
}
function cardColor(id){ const i=DATA.cards.findIndex(c=>c.id===id); return CAT_COLORS[(i<0?0:i)%CAT_COLORS.length]; }
function spendByCardRange(){ // [{card,total}] within the selected trend range, all cards incl dropped, sorted desc
  const {fromYM,toYM}=trendWindow(); const tot={};
  DATA.transactions.forEach(t=>{ const ym=(t.date||'').slice(0,7); if(ym&&ym>=fromYM&&ym<=toYM) tot[t.cardId]=(tot[t.cardId]||0)+t.amount; });
  return Object.entries(tot).map(([id,v])=>({card:cardById(id),total:v})).filter(x=>x.card&&x.total>0).sort((a,b)=>b.total-a.total);
}

      return `<span class="groupchip ${state}">

    const editor = TREND.showGroupEditor ? `

        <div class="gbtns"><button class="rbtn active" onclick="saveGroup()">Save group</button><button class="rbtn" onclick="closeGroupEditor()">Cancel</button></div>
      </div>` : "";
    groupsBlock = `<h3 class="sub">Groups <button class="linkish" onclick="openGroupEditor()">+ new</button></h3>
      <p class="note" style="margin-top:-4px">Tap a group to show/hide all its categories at once. Combine groups freely.</p>
      <div class="catchips">${gchips||'<span class="note">No groups yet — make one to toggle a set of categories together.</span>'}</div>

  return `<h2 class="sec">Spend over time</h2>

    <div class="rangebar">${rangeBtns}</div>${custom}
    <div class="rangebar" style="margin-top:6px">${groupBtns}</div>
    <div class="trendchart" id="trendchart"></div>
    <h3 class="sub">Spend by card <span class="meta">(selected range${bcTot?` · ${f0(bcTot)} total`:''})</span></h3>
    <div class="cardbars">${cardBars}</div>
    <h3 class="sub">${byCard?'Cards':'Categories'} <button class="linkish" onclick="trendAll(true)">all</button> · <button class="linkish" onclick="trendAll(false)">none</button></h3>
    <div class="catchips">${chips}</div>
    ${groupsBlock}
    <h3 class="sub">Monthly data</h3>
    <div id="trendtable"></div>
    <h3 class="sub">Inspect &amp; recategorize</h3>
    <p class="note">Pick a category to list its charges in this date range and fix any that are miscategorized — the chart and table update as you go. You can also click a category header in the table above.</p>
    <div class="filterbar"><label>Category:</label>
      <select onchange="setTrendInspect(this.value)"><option value="all"${!TREND.inspect?' selected':''}>— choose —</option>
        ${CATS.map(c=>`<option ${c===TREND.inspect?'selected':''}>${c}</option>`).join("")}</select></div>
    <div id="trendinspect"></div>`;
}
function drawTrendChart(){
  const host=document.getElementById('trendchart'); if(!host) return;
  const {units,data,series,colorOf,labelOf}=buildBuckets();
  const totals=data.map(row=>Object.values(row).reduce((s,v)=>s+v,0));
  const max=Math.max(...totals,1);
  if(!units.length){ host.innerHTML=`<p class="note">No transactions in this range.</p>`; drawTrendTable(units,data,series,totals,colorOf,labelOf); return; }
  const W=Math.max(units.length*54+60,360), H=300, padB=46, padL=52, padT=12, plotH=H-padB-padT, plotW=W-padL-10;
  const bw=Math.min(38, plotW/units.length*0.7), step=plotW/units.length;
  // y gridlines (nice round)
  const tick=niceTick(max), lines=[]; for(let v=0;v<=max+1;v+=tick){ const yy=padT+plotH-(v/max)*plotH; lines.push(`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-10}" y2="${yy.toFixed(1)}" class="grid"/><text x="${padL-6}" y="${(yy+3).toFixed(1)}" class="ylab">${f0(v)}</text>`); }
  let bars="";
  units.forEach((u,i)=>{ const cx=padL+step*i+step/2; let yCursor=padT+plotH; const row=data[i];
    series.forEach(k=>{ const amt=row[k]; if(!amt)return; const h=(amt/max)*plotH; yCursor-=h;
      bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${yCursor.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" fill="${colorOf(k)}"><title>${u.label} · ${esc(labelOf(k))}: ${f0(amt)}</title></rect>`; });
    bars+=`<text x="${cx.toFixed(1)}" y="${H-padB+16}" class="xlab">${u.label}</text>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${(padT+plotH-(totals[i]/max)*plotH-5).toFixed(1)}" class="tot">${totals[i]>0?f0(totals[i]):''}</text>`;
  });
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="tsvg" preserveAspectRatio="xMinYMin meet">${lines.join("")}${bars}</svg>`;
  drawTrendTable(units,data,series,totals,colorOf,labelOf);
}
function niceTick(max){ const raw=max/4; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/mag; const m=n>=5?5:n>=2?2:1; return m*mag; }
function drawTrendTable(units,data,series,totals,colorOf,labelOf){
  const host=document.getElementById('trendtable'); if(!host) return;
  if(!units.length){ host.innerHTML=""; return; }
  const byCard = TREND.groupBy==='card';
  // series that appear at all, ordered by total desc
  const keyTot={}; series.forEach(k=>keyTot[k]=0); data.forEach(r=>Object.entries(r).forEach(([k,v])=>keyTot[k]=(keyTot[k]||0)+v));
  const cols=series.filter(k=>keyTot[k]>0).sort((a,b)=>keyTot[b]-keyTot[a]);
  const th = k => byCard
    ? `<th class="num">${esc(labelOf(k))}</th>`
    : `<th class="num thcat" onclick="setTrendInspect('${k.replace(/'/g,"\\'")}')" title="click to inspect ${k}">${k}</th>`;
  let h=`<div class="ttable"><table><thead><tr><th>Period</th>${cols.map(th).join("")}<th class="num tot">Total</th></tr></thead><tbody>`;
  units.forEach((u,i)=>{ h+=`<tr><td>${u.label}</td>${cols.map(c=>`<td class="num">${data[i][c]?f0(data[i][c]):'·'}</td>`).join("")}<td class="num tot">${f0(totals[i])}</td></tr>`; });
  h+=`<tr class="sumrow"><td><b>Total</b></td>${cols.map(c=>`<td class="num">${f0(keyTot[c])}</td>`).join("")}<td class="num tot">${f0(totals.reduce((s,v)=>s+v,0))}</td></tr>`;
  h+=`</tbody></table></div>`;
  host.innerHTML=h;
  drawTrendInspect();
}
function getTrendCharges(cat){
  const {fromYM,toYM}=trendWindow();

function getGroups(){ if(!DATA.trendGroups) DATA.trendGroups=[]; return DATA.trendGroups; }
function toggleGroup(id){
  const g=getGroups().find(x=>x.id===id); if(!g) return;
  const cats=(g.cats||[]).filter(c=>CATS.includes(c)); if(!cats.length) return;
  const allOn=cats.every(c=>!TREND.off.has(c));
  if(allOn) cats.forEach(c=>TREND.off.add(c));        // hide the whole group
  else      cats.forEach(c=>TREND.off.delete(c));     // show the whole group
  renderPanel();
}
function openGroupEditor(){ TREND.showGroupEditor=true; renderPanel(); }
function closeGroupEditor(){ TREND.showGroupEditor=false; renderPanel(); }
function saveGroup(){
  const name=(document.getElementById('grp-name')?.value||'').trim();
  const cats=[...document.querySelectorAll('.grpedit .gcats input:checked')].map(i=>i.value);
  if(!name){ alert('Give the group a name.'); return; }
  if(!cats.length){ alert('Pick at least one category.'); return; }
  getGroups().push({id:'g'+Math.random().toString(36).slice(2,9), name, cats});
  TREND.showGroupEditor=false; save(); renderPanel();
}
function deleteGroup(id){
  const g=getGroups().find(x=>x.id===id);
  if(g && !confirm(`Delete the "${g.name}" group? (your transactions aren't affected)`)) return;
  DATA.trendGroups=getGroups().filter(x=>x.id!==id); save(); renderPanel();
}

function renewChip(c){
  const r=nextRenewal(c);
  if(!r) return `<button class="rchip none" onclick="editCard('${c.id}')">🗓 No renewal date set — add one</button>`;
  const cls=r.days<=30?'urgent':r.days<=60?'soon':'';
  return `<div class="rchip ${cls}">🗓 <b>Renews ${r.label}</b> · in ${r.days} day${r.days!==1?'s':''}${c.annualFee?` · ${f0(c.annualFee)} fee posts`:' · no fee'}</div>`;
}
function renewalCalendar(){
  const cards=DATA.cards.filter(c=>c.status==='held');
  if(!cards.length) return "";
  const withR=cards.map(c=>({c,r:nextRenewal(c)}));
  const dated=withR.filter(x=>x.r).sort((a,b)=>a.r.days-b.r.days);
  const undated=withR.filter(x=>!x.r);
  const rows=dated.map(x=>{ const cls=x.r.days<=30?'urgent':x.r.days<=60?'soon':'';
    return `<div class="rcal-row ${cls}"><span class="rcal-name">${esc(x.c.name)}</span>

function under24(){ // personal (non-business) cards applied within the last 24 months
  const today=new Date(); today.setHours(0,0,0,0);
  const cutoff=new Date(today); cutoff.setFullYear(cutoff.getFullYear()-2);
  return DATA.cards.filter(c=>!c.business&&c.applied).map(c=>({c,d:new Date(c.applied+'T00:00:00')}))
    .filter(x=>!isNaN(x.d)&&x.d>=cutoff)
    .map(x=>{ const off=new Date(x.d); off.setFullYear(off.getFullYear()+2); return {c:x.c,d:x.d,off}; })
    .sort((a,b)=>b.d-a.d);
}

function savingsPlan(txns){
  const goal=DATA.settings.saveGoal, spend=spendByCategory(txns);
  let items=Object.entries(DISCRETIONARY).map(([cat,trim])=>({cat,spend:spend[cat]||0,maxTrim:(spend[cat]||0)*trim}))
    .filter(i=>i.maxTrim>0).sort((a,b)=>b.maxTrim-a.maxTrim);
  const maxPossible=items.reduce((s,i)=>s+i.maxTrim,0);
  const scale=maxPossible>0?Math.min(1,goal/maxPossible):0;
  items.forEach(i=>i.target=i.maxTrim*scale);
  return {goal,maxPossible,feasible:goal<=maxPossible,items};
}

//  Mutations
// ===========================================================================
// ===========================================================================
//  Money Guy / Dave Ramsey principle pages
//  These blend the off-card facts you enter (salary, bonus, retirement, rent,
//  club dues) with the card-derived spend already in the app, since rent,
//  retirement and dues never hit the cards.
// ===========================================================================
const pct=(x)=>(isFinite(x)?(x*100):0).toFixed(0)+"%";
const pct1=(x)=>(isFinite(x)?(x*100):0).toFixed(1)+"%";
function finBadge(state){
  const m={ok:["✓","#2f8f5b","#e3f3e9"],warn:["!","#b9831f","#faf0d8"],bad:["✕","#b23b1e","#f7ddd5"],info:["•","#5b8c9b","#e6eef0"]}[state]||["•","#888","#eee"];
  return `<span class="finbadge" style="background:${m[2]};color:${m[1]}">${m[0]}</span>`;
}
function finModel(){
  const f=DATA.settings.finance||{};
  const salary=+f.salary||0, bonus=+f.bonus||0, incBonus=f.includeBonus!==false;
  const grossAnnual = salary + (incBonus?bonus:0);
  const grossMo = grossAnnual/12;
  const retPct=(+f.retirementPct||0)/100;
  const retAnnual = salary*retPct;                       // your own contributions (on base)
  const matchPct=(+f.matchPct||0)/100;
  const matchCaptured = salary*Math.min(retPct,matchPct);// employer $ you actually capture
  const matchFull = salary*matchPct;                     // full match offered
  const taxRate=(+f.taxRate||0)/100;
  const taxAnnual = grossAnnual*taxRate;
  const takeHomeAnnual = Math.max(0, grossAnnual - taxAnnual - retAnnual); // pre-tax 401k lowers take-home
  const takeHomeMo = takeHomeAnnual/12;
  const rentMo=+f.rentMonthly||0, clubMo=+f.clubMonthly||0;
  const ef=+f.emergencyFund||0, debt=+f.otherDebt||0;
  // card-derived spend for the selected year
  const txns=scoped();
  const cardTotal=txns.reduce((s,t)=>s+t.amount,0);
  const months=new Set(txns.map(t=>(t.date||"").slice(0,7))).size||1;
  const cardMo=cardTotal/months;
  const cat=spendByCategory(txns); const catMo={}; Object.keys(cat).forEach(k=>catMo[k]=cat[k]/months);
  const transportMo=(catMo["Gas"]||0)+(catMo["Car"]||0)+(catMo["Rideshare"]||0)+(catMo["Other Travel"]||0);
  const foodMo=(catMo["Groceries"]||0)+(catMo["Restaurants"]||0)+(catMo["Coffee Shops"]||0)+(catMo["Food Delivery"]||0)+(catMo["Bars"]||0)+(catMo["Takeout"]||0);
  const recMo=(catMo["Entertainment & Events"]||0)+(catMo["Vacation"]||0)+(catMo["Streaming & Software"]||0)+clubMo;
  const utilMo=(catMo["Utilities"]||0);
  const healthMo=(catMo["Health"]||0);
  const insMo=(catMo["Insurance"]||0);
  const givingMo=(catMo["Charity"]||0);
  const personalMo=(catMo["Online Shopping"]||0)+(catMo["Gifts"]||0)+(catMo["Pets"]||0)+(catMo["Business & Office"]||0)+(catMo["Other"]||0);
  // total monthly outflow estimate (retirement excluded — it's saving, not spending)
  const spendMo = cardMo + rentMo + clubMo;
  const saveRateOwn = grossAnnual? retAnnual/grossAnnual : 0;
  const saveRateWithMatch = grossAnnual? (retAnnual+matchCaptured)/grossAnnual : 0;
  return {salary,bonus,incBonus,grossAnnual,grossMo,retPct,retAnnual,matchPct,matchCaptured,matchFull,
    taxRate,takeHomeAnnual,takeHomeMo,rentMo,clubMo,ef,debt,cardMo,months,catMo,
    transportMo,foodMo,recMo,utilMo,healthMo,insMo,givingMo,personalMo,spendMo,saveRateOwn,saveRateWithMatch,
    hasIncome: grossAnnual>0};
}

// ---- Excel import (parses your Credit_Cards.xlsx layout) ------------------
const XL_CARDRE=/sapphire|platinum|venture|southwest|gold|freedom|\bink\b|green|express|capital one/i;
// Robust grid parser shared by the file and paste paths. Anchors value columns
// on the "Nominal Value" header (not blind offsets), drops the fragile "Perk"
// label requirement, and only accepts plausible dollar amounts so dates, years,
// "days until expiration", multipliers, etc. can never be read as credits.
function parseGrid(rows){
  const numv=v=>{ if(typeof v==='number') return isFinite(v)?v:null;
    if(v==null) return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?null:n; };
  const isCard=c=>typeof c==='string'&&XL_CARDRE.test(c);
  let hr=-1,best=0;
  rows.slice(0,8).forEach((r,i)=>{ const n=(r||[]).filter(isCard).length; if(n>best){best=n;hr=i;} });
  if(hr<0) return [];
  const header=rows[hr]||[], labelRow=rows[hr+1]||[];
  const cols=[]; header.forEach((c,i)=>{ if(isCard(c)) cols.push(i); });
  const out=[];
  cols.forEach((H,idx)=>{
    const nextH = idx+1<cols.length ? cols[idx+1] : header.length;
    // locate this card's "Nominal Value" column; fall back to fixed offsets
    let nomCol=-1;
    for(let c=H;c<nextH;c++){ if(/nominal value/i.test(String(labelRow[c]||""))){ nomCol=c; break; } }
    let descCol,capCol;
    if(nomCol>=0){ descCol=nomCol-1; capCol=nomCol+1; } else { descCol=H; nomCol=H+1; capCol=H+2; }
    // annual fee: first plausible number just left of the value columns
    let af=0; for(let c=Math.max(0,H-1); c<nomCol; c++){ const v=numv(labelRow[c]); if(v!=null&&v>=0&&v<=2000){ af=v; break; } }
    const credits=[];
    for(let ri=hr+2; ri<rows.length; ri++){
      const r=rows[ri]||[]; const desc=String(r[descCol]??"").trim(); const nom=numv(r[nomCol]);
      if(/^total|implied/i.test(desc)) break;
      if(!desc) continue;
      if(/^[\d\s.,\/$%x:()\-]+$/i.test(desc)) continue;  // pure number/date/value cell, not a perk name
      if(/points|miles/i.test(desc)) continue;           // signup/anniversary points -> not a $ credit
      if(nom==null || nom<=0 || nom>1500) continue;       // plausibility gate: blocks dates/years/days/serials
      credits.push({label:desc.replace(/[*]+$/,""), nominal:nom, targeted:numv(r[capCol])||0});
    }
    out.push({name:String(header[H]).trim(), af, credits});
  });
  return out;
}
function parseExcel(rows){ return parseGrid(rows); }
function normName(s){ return (s||"").toLowerCase().replace(/american express|amex|chase|capital one|:|\bbusiness\b/g,"").replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim(); }
function matchCard(sheetName){
  const n=normName(sheetName);
  // exact-ish on the distinctive token
  return DATA.cards.find(c=>{ const cn=normName(c.name);
    return cn===n || cn.includes(n) || n.includes(cn) ||
      (n.includes("sapphire")&&cn.includes("sapphire")) || (n.includes("platinum")&&cn.includes("platinum")) ||
      (n.includes("gold")&&cn.includes("gold")) || (n.includes("venture")&&cn.includes("venture")) ||
      (n.includes("premier")&&cn.includes("premier")) || (n.includes("green")&&cn.includes("green")) ||
      (n.includes("freedom")&&cn.includes("freedom")) || (n.includes("ink")&&cn.includes("ink")); });
}
function guessMatchKw(label){ const l=label.toLowerCase();
  for(const w of ["resy","uber one","uber","clear","saks","lululemon","apple","stubhub","opentable","dashpass","dash pass","travel","hotel","airline","dining","digital ent","capital one travel"])
    if(l.includes(w)) return w==="dash pass"?"dashpass":w;
  return null;
}
function normLabel(s){ return (s||"").toLowerCase().replace(/[$0-9]/g,"").replace(/\b(credit|month|monthly|year|annual|per|all|access|the)\b/g,"").replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim(); }
function mergeExcel(parsed, msgId){
  let updated=0, added=0, unmatched=[];
  parsed.forEach(p=>{
    let c=matchCard(p.name);
    if(!c){
      const iss=/express|amex|gold|platinum|green/i.test(p.name)?["Amex MR",2.0]
        :/sapphire|freedom|ink|chase/i.test(p.name)?["Chase UR",2.0]
        :/southwest/i.test(p.name)?["Southwest RR",1.4]
        :/venture|capital one/i.test(p.name)?["Capital One",1.7]:["Other",1.0];
      c={id:"x"+Math.random().toString(36).slice(2,7),name:p.name,issuer:iss[0],annualFee:p.af,pv:iss[1],
         status:'considering',mult:{Other:1},credits:[],sub:null,note:"added from Excel"};
      DATA.cards.push(c); added++; unmatched.push(p.name);
    } else updated++;
    if(p.af) c.annualFee=p.af;
    // carry over match keyword + capture edits, matched on a normalized label
    const prev={}; c.credits.forEach(k=>{ prev[normLabel(k.label)]={match:k.match,actual:k.actual}; });
    c.credits=p.credits.map((k,i)=>{ const pr=prev[normLabel(k.label)]||{};
      return {id:c.id+"k"+i,label:k.label,nominal:k.nominal,targeted:k.targeted,
        match:pr.match||guessMatchKw(k.label),actual:pr.actual??null,resets:null}; });
  });
  touch(); save(); renderKpis(); renderPanel();
  const msg=document.getElementById(msgId||"xlsx-msg");
  if(msg) msg.textContent=`Synced ${updated} card${updated!==1?'s':''} from Excel${added?`, added ${added} new (${unmatched.join(", ")})`:''}. Spend & edits intact.`;
}
function readExcel(file){
  const msg=document.getElementById("xlsx-msg"); if(msg)msg.textContent="Reading "+file.name+"…";
  if(typeof XLSX==='undefined'){ if(msg)msg.textContent="The spreadsheet library is blocked in this preview. Use the paste box above instead (Excel → Save As → CSV), or open this app as a downloaded file."; return; }
  const fr=new FileReader();
  fr.onload=e=>{ try{
    const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const parsed=parseExcel(rows);
    if(!parsed.length){ if(msg)msg.textContent="Couldn't find card columns in that sheet."; return; }
    mergeExcel(parsed);
  }catch(err){ if(msg)msg.textContent="Error reading file: "+err.message; } };
  fr.readAsArrayBuffer(file);
}
function dropExcel(e){ e.preventDefault(); document.getElementById("dropzone").style.borderColor="var(--lightGray)";
  const f=e.dataTransfer.files[0]; if(f) readExcel(f); }

function parseSheetText(text){
  const delim=detectDelim(text);
  const rows=text.split(/\r?\n/).filter(l=>l.length).map(l=>splitRow(l,delim));
  return parseGrid(rows);
}
function importPastedSheet(){
  const msg=document.getElementById("sheet-msg"); const txt=val("sheet-text").trim();
  if(!txt){ if(msg)msg.textContent="Paste the CSV first."; return; }
  const parsed=parseSheetText(txt);
  if(!parsed.length){ if(msg)msg.textContent="Couldn't find card columns — make sure the header row with card names is included."; return; }
  mergeExcel(parsed, "sheet-msg");
}

    settings:DATA.settings,
    cards:DATA.cards.map(c=>({ id:c.id, name:c.name, status:c.status, renewal:c.renewal||null, applied:c.applied||null,
      business:c.business||false, nextAward:c.nextAward||null, annualFee:c.annualFee, pv:c.pv, note:c.note,
      mult:c.mult, merchantMult:c.merchantMult, subStart:(c.sub&&c.sub.start)||null,
      credits:(c.credits||[]).map(k=>({ id:k.id, manualByMonth:k.manualByMonth||null, actualByYear:k.actualByYear||null, targeted:k.targeted, cadence:k.cadence })) })),
    cats
  };
}
function doBackup(){
  const txt=JSON.stringify(backupPatch());
  const ta=document.getElementById("backup-text"); ta.classList.remove("hide"); ta.value=txt; ta.select();
  let copied=false; try{ navigator.clipboard.writeText(txt); copied=true; }catch(e){}
  try{ const blob=new Blob([txt],{type:"application/json"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="rewards-ledger-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000); }catch(e){}
  const msg=document.getElementById("backup-msg"); if(msg) msg.textContent=(copied?"Copied to clipboard":"Select the text below and copy")+" · also downloaded as a file.";
}
function toggleRestore(){ const el=document.getElementById("restorebox"); if(el) el.classList.toggle("hide"); }
function applyPatch(p){
  if(!p||p.app!=="rewards-ledger") throw new Error("Not a Rewards Ledger backup.");
  if(p.settings) DATA.settings={...DATA.settings,...p.settings};
  (p.cards||[]).forEach(pc=>{
    let c=DATA.cards.find(x=>x.id===pc.id) || DATA.cards.find(x=>x.name===pc.name); if(!c) return;
    ["status","renewal","applied","business","nextAward","annualFee","pv","note"].forEach(k=>{ if(pc[k]!==undefined&&pc[k]!==null) c[k]=pc[k]; });
    if(pc.mult) c.mult=pc.mult; if(pc.merchantMult) c.merchantMult=pc.merchantMult;
    if(pc.subStart&&c.sub) c.sub.start=pc.subStart;
    (pc.credits||[]).forEach(pk=>{ const k=(c.credits||[]).find(x=>x.id===pk.id); if(!k)return;
      if(pk.manualByMonth) k.manualByMonth=pk.manualByMonth; if(pk.actualByYear) k.actualByYear=pk.actualByYear;
      if(pk.targeted!==undefined) k.targeted=pk.targeted; if(pk.cadence) k.cadence=pk.cadence; });
  });
  if(p.cats) DATA.transactions.forEach(t=>{ const c=p.cats[(t.merchant||'').trim().toLowerCase()]; if(c) t.category=c; });
}
function doRestore(){
  const raw=(val("restore-text")||"").trim(); const msg=document.getElementById("backup-msg");
  if(!raw){ if(msg)msg.textContent="Paste your backup code first."; return; }
  let p; try{ p=JSON.parse(raw); }catch(e){ if(msg)msg.textContent="That doesn't look like valid backup text."; return; }
  try{ applyPatch(p); }catch(e){ if(msg)msg.textContent=e.message; return; }
  touch(); save(); if(typeof renderYear==='function')renderYear(); renderKpis(); renderTabs(); renderPanel();
  if(msg) msg.textContent="Restored your changes onto this version. ✓";
}
function copyDefs(){
  const txt=JSON.stringify(cardDefs(),null,2);
  const ta=document.getElementById("defsdump"); ta.classList.remove("hide"); ta.value=txt; ta.select();
  try{ navigator.clipboard.writeText(txt); }catch(e){}
  setTimeout(()=>ta.classList.add("hide"),50);
  alert("Current card definitions copied to clipboard — paste them to Claude for a sync.");
}
function toggleSync(){
  const el=document.getElementById("syncbox");
  if(el.innerHTML){ el.innerHTML=""; return; }
  el.innerHTML=`<div style="margin:6px 0 14px">
    <textarea id="defs-in" placeholder="Paste the updated definitions JSON from Claude…"></textarea>
    <div class="row-actions"><button class="btn sm" onclick="applyDefs()">Apply update</button>
      <span id="defs-msg" class="meta" style="align-self:center"></span></div></div>`;
}
function applyDefs(){
  const msg=document.getElementById("defs-msg");
  let arr; try{ arr=JSON.parse(val("defs-in")); }catch(e){ msg.textContent="Couldn't parse that JSON."; return; }
  if(!Array.isArray(arr)){ msg.textContent="Expected a list of card definitions."; return; }
  let updated=0, added=0;
  arr.forEach(u=>{
    if(!u.id){ return; }
    let c=cardById(u.id);
    if(!c){ // brand-new card from Claude (e.g. a card you just got)
      c={id:u.id,name:u.name,issuer:u.issuer,annualFee:u.annualFee||0,pv:u.pv||1.5,status:'considering',
         mult:u.mult||{Other:1},credits:[],sub:null,note:u.note||""};
      DATA.cards.push(c); added++;
    } else updated++;
    // apply only provided structural fields; preserve user data
    if(u.name!=null)c.name=u.name; if(u.issuer!=null)c.issuer=u.issuer;
    if(u.annualFee!=null)c.annualFee=u.annualFee; if(u.pv!=null)c.pv=u.pv;
    if(u.note!=null)c.note=u.note;
    if(u.mult)c.mult=u.mult;
    if(u.credits){
      // rebuild credits but carry over any manual capture (actual) by label
      const prevActual={}; c.credits.forEach(k=>{ if(k.actual!=null)prevActual[k.label.toLowerCase()]=k.actual; });
      c.credits=u.credits.map((k,i)=>({id:c.id+"k"+i,label:k.label,nominal:k.nominal,targeted:k.targeted,
        match:k.match||null,resets:k.resets||null,actual:prevActual[(k.label||"").toLowerCase()]??null}));
    }
    if(u.sub){
      const start=c.sub?c.sub.start:null; // preserve YOUR clock start
      c.sub=Object.assign({start},c.sub||{},u.sub,{start});
    } else if(u.sub===null && c.sub && u.hasOwnProperty('sub')){ c.sub=null; }
  });
  touch(); save(); renderKpis(); renderPanel();
  msg.textContent=`Synced ${updated} card${updated!==1?'s':''}${added?`, added ${added}`:''}. Your spend and edits are intact.`;
}

function recat(tid,cat){ recatAll(tid,cat); }
function recatAll(tid,cat){
  const t=DATA.transactions.find(x=>x.id===tid); if(!t) return;
  const name=(t.merchant||'').trim().toLowerCase();
  let n=0; DATA.transactions.forEach(x=>{ if((x.merchant||'').trim().toLowerCase()===name){ if(x.category!==cat)n++; x.category=cat; } });
  touch(); save(); renderKpis(); renderPanel();
}
function delTx(id){ DATA.transactions=DATA.transactions.filter(t=>t.id!==id); touch(); persist(); }

function editCard(id){ const c=cardById(id); const el=document.getElementById("cf-"+id);
  el.innerHTML=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--lightGray)">
    <div class="frow"><div><label>Annual fee</label><input id="ef-${id}-af" type="number" value="${c.annualFee}"></div>
    <div><label>Point value (¢)</label><input id="ef-${id}-pv" type="number" step="0.1" value="${c.pv}"></div>
    <div><label>Renewal / anniversary date</label><input id="ef-${id}-rn" type="date" value="${c.renewal||''}"></div></div>
    <label>Multipliers (blank = remove)</label><div class="frow">
    ${CATS.map(cat=>`<div><label style="font-weight:500;color:var(--midGray);font-size:11px">${cat}</label>
      <input id="ef-${id}-${cat}" type="number" step="0.5" value="${c.mult[cat]??''}"></div>`).join("")}</div>
    ${c.sub?`<div class="frow"><div><label>Signup value ($)</label><input id="ef-${id}-sv" type="number" value="${c.sub.value}"></div>
      <div><label>Signup spend req ($)</label><input id="ef-${id}-sr" type="number" value="${c.sub.spendReq}"></div>
      <div><label>SUB clock start</label><input id="ef-${id}-ss" type="date" value="${c.sub.start||''}"></div></div>`:''}
    <div class="row-actions"><button class="btn sm" onclick="saveCard('${id}')">Save</button>
      <button class="btn ghost sm" onclick="document.getElementById('cf-${id}').innerHTML=''">Cancel</button></div></div>`;
}
function saveCard(id){ const c=cardById(id);
  c.annualFee=parseFloat(val(`ef-${id}-af`))||0; c.pv=parseFloat(val(`ef-${id}-pv`))||1;
  c.renewal=val(`ef-${id}-rn`)||null;
  const m={}; CATS.forEach(cat=>{const v=parseFloat(val(`ef-${id}-${cat}`)); if(!isNaN(v)&&v>0)m[cat]=v;});
  if(!m.Other)m.Other=1; c.mult=m;
  if(c.sub){ c.sub.value=parseFloat(val(`ef-${id}-sv`))||0; c.sub.spendReq=parseFloat(val(`ef-${id}-sr`))||0; c.sub.start=val(`ef-${id}-ss`)||null; }
  touch(); persist();
}
function cycleCadence(cid,crid){ const c=cardById(cid), cr=c.credits.find(x=>x.id===crid);
  const order=['annual','monthly','quarterly','semiannual'];
  cr.cadence=order[(order.indexOf(cr.cadence||'annual')+1)%order.length];
  touch(); persist();
}
function editCredit(cid,crid){ const c=cardById(cid), cr=c.credits.find(x=>x.id===crid);
  const cur=creditActual(c,cr);
  const v=prompt(`Actual captured in ${YEAR} for "${cr.label}" (nominal ${f0(cr.nominal)}):`, cur);
  if(v!=null){ const n=parseFloat(v); if(!isNaN(n)){ cr.actualByYear=cr.actualByYear||{}; cr.actualByYear[YEAR]=n; touch(); persist(); } }
}

function addTx(){
  const cardId=val("t-card"); const amt=parseFloat(val("t-amt"));
  if(!cardId||isNaN(amt)||amt<=0){ alert("Need a card and amount."); return; }
  DATA.transactions.push({id:"t"+Math.random().toString(36).slice(2,9),merchant:val("t-merch")||"(manual)",
    category:val("t-cat"),amount:amt,cardId,date:val("t-date")});
  touch(); persist();
}

// ---- smart CSV import -----------------------------------------------------
function splitLine(line){ return splitRow(line, ","); }
function splitRow(line, delim){ const o=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch=='"'){if(q&&line[i+1]=='"'){cur+='"';i++;}else q=!q;}
    else if(ch===delim&&!q){o.push(cur);cur="";}else cur+=ch;}
  o.push(cur); return o.map(s=>s.trim()); }
function detectDelim(text){ const probe=text.split(/\r?\n/).slice(0,6).join("\n");
  const tabs=(probe.match(/\t/g)||[]).length, commas=(probe.match(/,/g)||[]).length;
  return (tabs>0 && tabs>=commas) ? "\t" : ","; }
function normDate(s){ s=(s||"").trim(); if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){let[_,mo,d,y]=m;if(y.length===2)y="20"+y;
    return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;} return new Date().toISOString().slice(0,10); }
function importCsv(){
  const cardId=val("csv-card"), msg=document.getElementById("csv-msg");
  const raw=val("csv-text").trim(); if(!raw){ if(msg)msg.textContent="Paste rows first."; return; }
  let lines=raw.split(/\r?\n/).filter(l=>l.trim());
  const delim=detectDelim(raw);                 // tab when copied from a sheet, comma from a .csv
  const split=line=>splitRow(line,delim);
  const firstCells=split(lines[0]).map(h=>h.toLowerCase());
  const hasHeader=firstCells.some(h=>/date|amount|description|debit|merchant|payee/.test(h));
  const hdr=hasHeader?firstCells:[];
  let rows=(hasHeader?lines.slice(1):lines).map(split).filter(r=>r.some(c=>c!==""));
  const col=(...n)=>hdr.findIndex(h=>n.some(x=>h.includes(x)));
  const issuer = hdr.includes("type")&&hdr.some(h=>h.includes("post")) ? "chase"
    : (hdr.some(h=>h.includes("debit"))&&hdr.some(h=>h.includes("credit"))) ? "capitalone"
    : (hdr.includes("amount")&&hdr.some(h=>h.includes("description"))&&hdr.length<=4) ? "amex" : "generic";
  let di=col("transaction date","date"), si=col("description","merchant","payee"),
      ai=col("amount","debit"), ti=col("type"), ci=col("category");
  // infer any missing columns from the data itself
  if(di<0||si<0||ai<0){
    const ncol=Math.max(...rows.slice(0,20).map(r=>r.length),0);
    let dBest=-1,aBest=-1,sBest=-1,dN=0,aN=0,sLen=-1;
    for(let c=0;c<ncol;c++){
      const vals=rows.slice(0,40).map(r=>(r[c]||"").trim());
      const dHits=vals.filter(v=>/^\d{1,4}[-\/]\d{1,2}[-\/]\d{1,4}/.test(v)).length;
      const aHits=vals.filter(v=>/^-?\$?\d[\d,]*\.?\d+$|^-?\$?\d+$/.test(v)).length;
      const avg=vals.reduce((s,v)=>s+v.length,0)/(vals.length||1);
      if(dHits>dN){dN=dHits;dBest=c;}
      if(aHits>aN){aN=aHits;aBest=c;}
      if(avg>sLen){sLen=avg;sBest=c;}
    }
    if(di<0)di=dBest; if(ai<0)ai=aBest; if(si<0)si=sBest;
  }
  // Occurrence-based dedup: re-importing the same file adds nothing, but real
  // repeated charges (two identical same-day rides) are kept. We add a row only
  // when its Nth occurrence in this file exceeds how many we already store.
  const existCount={};
  DATA.transactions.forEach(t=>{ const k=`${t.date}|${t.merchant}|${t.amount.toFixed(2)}|${t.cardId}`; existCount[k]=(existCount[k]||0)+1; });
  const seen={};
  let added=0,pay=0,dup=0;
  DATA._detectedCredits=DATA._detectedCredits||{};
  const detected=DATA._detectedCredits[cardId]||{};   // { keyword: { 'YYYY-MM': amount } }
  const addCredit=(desc,ym,amt)=>{ const k=desc.toLowerCase().replace(/\s+/g,' ').trim(); detected[k]=detected[k]||{}; detected[k][ym]=(detected[k][ym]||0)+amt; };
  rows.forEach(c=>{
    const desc=c[si]||""; let amt=parseFloat(String(c[ai]).replace(/[^0-9.\-]/g,"")); if(isNaN(amt))return;
    const ym=normDate(c[di]).slice(0,7);
    var cat;
    if(issuer==="chase"){
      const type=c[ti];
      // Chase statement credits post as positive "Adjustment" lines (TRAVEL CREDIT, DINING CREDIT) or a DashPass "Return"
      if(amt>0){ if((type==="Adjustment" && /credit/i.test(desc)) || /dashpass/i.test(desc)){ addCredit(desc,ym,amt); } pay++; return; }
      if(["Payment","Return","Adjustment","Cash Advance","Fee","Reversal"].includes(type)){pay++;return;}
      if(!(amt<0)){pay++;return;}
      amt=-amt; cat=categorize(desc); if(cat==="Other"&&CHASE_MAP[c[ci]])cat=CHASE_MAP[c[ci]];
    } else if(issuer==="amex"){
      if(PAY.test(desc)){pay++;return;}
      if(amt<0){ if(/credit/i.test(desc)){addCredit(desc,ym,-amt);} else pay++; return; }
      cat=categorize(desc);
    } else if(issuer==="capitalone"){
      // separate Debit/Credit columns: amt was read from the Debit column, so charges are amt>0.
      // Credit-column rows (refunds/payments/statement credits) leave Debit blank -> amt is NaN and already skipped above.
      cat=categorize(desc); if(cat==="Other"&&ci>=0&&CAPONE_MAP[c[ci]])cat=CAPONE_MAP[c[ci]];
    } else {
      if(PAY.test(desc)){pay++;return;}
      if(amt<0){ if(/credit/i.test(desc)){addCredit(desc,ym,-amt);} return; }
      cat=categorize(desc);
    }
    if(amt<=0)return;
    const merchant=desc.replace(/\s{2,}.*/,'').trim()||"(imported)";
    const date=normDate(c[di]);
    const s=`${date}|${merchant}|${amt.toFixed(2)}|${cardId}`;
    seen[s]=(seen[s]||0)+1;
    if(seen[s] <= (existCount[s]||0)){ dup++; return; }   // this occurrence already stored
    DATA.transactions.push({id:"t"+Math.random().toString(36).slice(2,9),merchant,category:cat,amount:amt,cardId,date});
    added++;
  });
  DATA._detectedCredits[cardId]=detected; touch(); save();
  const dc=Object.keys(detected).length;
  if(msg)msg.textContent=`Imported ${added} (${issuer}, ${delim==="\t"?"tab":"comma"}-separated) · skipped ${pay} payments/transfers${dup?`, ${dup} dupes`:''}${dc?` · auto-captured ${dc} credit type(s)`:''}.`;
  if(YEAR===null) YEAR=availableYears()[0];
  renderYear(); renderKpis(); setTimeout(renderPanel,1100);
}

function resetAll(){ if(!confirm("Erase all data and reset cards to defaults?"))return;
  DATA=seed(); persist(); }

// ===========================================================================
(async function(){ await load(); if(YEAR===null) YEAR=availableYears()[0]; renderYear(); renderKpis(); renderTabs(); renderPanel(); })();
</script>

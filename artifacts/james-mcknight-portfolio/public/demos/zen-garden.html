    const bow = (rand()-0.5) * L * 0.35;
    const c1 = [A[0]+dx*0.33 + px*bow, A[1]+dy*0.33 + py*bow];
    const c2 = [A[0]+dx*0.66 + px*bow*0.4, A[1]+dy*0.66 + py*bow*0.4];
    const pts = chaikin([A, c1, c2, B], 3);
    if (!selfIntersects(pts)) return pts;
  }
  // fallback: straight-ish
  return chaikin([edgePoint(WW,WH,margin,rand,0), [WW/2,WH/2], edgePoint(WW,WH,margin,rand,2)], 3);
}

/* Build ONE candidate layout. */
function buildCandidate(WW, WH, seed) {
  const rand = rng(seed);
  const margin = Math.min(W, H) * 0.13;
  const noise = makeNoise(seed * 31 + 7);
  const uid = () => "z" + (seed % 1e6).toString(36) + Math.floor(rand() * 1e6).toString(36);

  // --- stream: one gentle watercourse, edge to edge, never crossing itself ---
  const streams = [];
  const mainPts = genGentleStream(WW, WH, margin, rand);
  streams.push({ t: seed, pts: mainPts, bb: bbOfPts(mainPts) });
  const distStreams = (x, y) => Math.min(...streams.map((st) => distToPolyline(x, y, st.pts)));

  // --- 1..3 focal points near rule-of-thirds, off the water ---
  const thirds = [[1/3,1/3],[2/3,1/3],[1/3,2/3],[2/3,2/3]].sort(() => rand() - 0.5);
  const nFocal = 1 + Math.floor(rand() * 3);
  const focals = [];
  for (const [fx, fy] of thirds) {
    if (focals.length >= nFocal) break;
    const x = fx*WW + (rand()-0.5)*WW*0.08, y = fy*WH + (rand()-0.5)*WH*0.08;
    if (x<margin||x>WW-margin||y<margin||y>WH-margin) continue;
    if (distStreams(x, y) < 120) continue;
    if (focals.some((f) => Math.hypot(f.x-x, f.y-y) < Math.min(WW,WH)*0.32)) continue;
    focals.push({ x, y, primary: focals.length === 0 });
  }
  if (!focals.length) focals.push({ x: WW/3, y: WH/3, primary: true });

  const items = [];
  const place = (type, x, y, scale, extra) => {
    const it = Object.assign({ id: uid(), type, x, y, scale }, extra || {});
    items.push(it); return it;
  };
  const clears = (x, y, rad, type) => {
    if (x < margin || x > WW - margin || y < margin || y > WH - margin) return false;
    // hard rule: nothing but a bridge may touch the stream; keep clear of the
    // full water+bank width plus the item's own radius
    const waterGap = 34 + (type ? (RADII[type]||44) * 0.6 : rad);
    if (distStreams(x, y) < waterGap) return false;
    return items.every((it) => Math.hypot(it.x-x, it.y-y) > rad + itemR(it) * 0.5);
  };

  // --- scale hierarchy at each focal: 1 large + odd cluster of medium + small accents ---
  focals.forEach((f, fi) => {
    const bigType = FOCAL_TYPES[Math.floor(rand()*FOCAL_TYPES.length)];
    const bigScale = (f.primary ? 1.3 : 1.05) + rand()*0.2;
    // nudge the focal off the water if it landed too close
    let fx = f.x, fy = f.y, guard = 0;
    while (distStreams(fx, fy) < 40 + (RADII[bigType]||44)*0.6 && guard++ < 8) {
      fx += (fx < WW/2 ? -30 : 30); fy += (fy < WH/2 ? -20 : 20);
    }
    f.x = Math.max(margin, Math.min(WW-margin, fx)); f.y = Math.max(margin, Math.min(WH-margin, fy));
    place(bigType, f.x, f.y, bigScale, orientFor(bigType, f.x, f.y, streams));   // focal anchor always placed
    // odd cluster (3/5/7) of supporting medium elements around the focal
    const clusterN = [3,5,7][Math.floor(rand()* (f.primary?3:2))];
    const baseA = rand()*Math.PI*2;
    for (let k=1;k<clusterN;k++){
      const ang = baseA + k*(Math.PI*2/clusterN) + (noise(f.x*0.01+k, f.y*0.01)-0.5)*0.6;
      const d = 78 + rand()*64;
      const x = f.x + Math.cos(ang)*d, y = f.y + Math.sin(ang)*d;
      if (!clears(x, y, 42)) continue;
      const type = SUPPORT_TYPES[Math.floor(rand()*SUPPORT_TYPES.length)];
      place(type, x, y, 0.6 + rand()*0.35, orientFor(type, x, y, streams));
    }
  });

  // --- small accents spread by Poisson, away from focals, filling without crowding ---
  const accentPts = poisson(WW, WH, margin, Math.min(WW,WH)*0.16,
    (x,y) => distStreams(x,y) < 66 || focals.some(f=>Math.hypot(f.x-x,f.y-y) < 120), 18, rand);
  const nAccent = Math.min(accentPts.length, 5 + Math.floor(rand()*4) + Math.round((G.size||1)*2));
  for (let i=0;i<nAccent;i++){
    const [x,y] = accentPts[i];
    const type = ACCENT_TYPES[Math.floor(rand()*ACCENT_TYPES.length)];
    if (!clears(x, y, 30, type)) continue;
    place(type, x, y, 0.4 + rand()*0.3, orientFor(type, x, y, streams));
  }

  // --- moss on the banks ---
  for (let k=0;k<3;k++){
    const st = streams[0];
    const i = 1 + Math.floor(rand()*(st.pts.length-2));
    const a = st.pts[i-1], b = st.pts[i+1];
    const fl = Math.atan2(b[1]-a[1], b[0]-a[0]);
    const side = rand()<0.5?1:-1;
    const x = st.pts[i][0]-Math.sin(fl)*62*side, y = st.pts[i][1]+Math.cos(fl)*62*side;
    if (clears(x,y,20)) place("moss", x, y, 0.45+rand()*0.3);
  }

  // --- stepping-stone path: a single flowing course, edge to edge, that reads
  //     as a walkable line. It may sweep past focal areas but never folds over
  //     itself, and crosses the stream only at a bridge. ---
  {
    // build a non-self-crossing course; retry until clean
    let mainCourse = null;
    for (let attempt = 0; attempt < 10; attempt++) {
      const A = edgePoint(WW, WH, margin, rand);
      const B = edgePoint(WW, WH, margin, rand);
      if (Math.hypot(B[0]-A[0], B[1]-A[1]) < Math.min(WW,WH)*0.7) continue;   // demand a long span
      // 2-3 interior sweep points visiting focal areas, kept in bounds
      const via = [A];
      const nMid = 2 + Math.floor(rand()*2);
      for (let m2=0;m2<nMid;m2++){
        const f = focals[m2 % focals.length];
        let vx = f.x + (rand()-0.5)*200, vy = f.y + (rand()-0.5)*200;
        vx = Math.max(margin, Math.min(WW-margin, vx)); vy = Math.max(margin, Math.min(WH-margin, vy));
        via.push([vx, vy]);
      }
      via.push(B);
      const course = genWindingRoute(via, 22, rand, Math.min(WW,WH)*0.16);
      if (!selfIntersects(course)) { mainCourse = course; break; }
    }
    if (!mainCourse)
      mainCourse = chaikin([edgePoint(WW,WH,margin,rand,3), [WW*0.5,WH*0.5], edgePoint(WW,WH,margin,rand,1)], 3);

    // find the ONE stream crossing (if any) → that's where a bridge goes; the
    // path stones skip a gap there so stones never sit in the water.
    let crossIdx = -1, crossPt = null;
    for (let i=1;i<mainCourse.length-1;i++){
      if (distToPolyline(mainCourse[i][0], mainCourse[i][1], mainPts) < 26) {
        crossIdx = i; crossPt = nearestOnStreamsList(mainCourse[i][0], mainCourse[i][1], streams); break;
      }
    }
    if (crossPt) place("bridge", crossPt.x, crossPt.y, 1.1, { rot: crossPt.ang + Math.PI/2 });

    // lay evenly-spaced stones ALONG the course (a path, not a cluster); leave a
    // clear gap around the bridge, and never place a stone on the water.
    let acc = 999, prev = mainCourse[0];
    for (let i=0;i<mainCourse.length;i++){
      const q = mainCourse[i];
      acc += Math.hypot(q[0]-prev[0], q[1]-prev[1]);
      const nearBridge = crossPt && Math.hypot(q[0]-crossPt.x, q[1]-crossPt.y) < 42;
      const onWater = distToPolyline(q[0], q[1], mainPts) < 30;
      if (acc >= 40 && !nearBridge && !onWater &&
          q[0]>margin*0.5 && q[0]<WW-margin*0.5 && q[1]>margin*0.5 && q[1]<WH-margin*0.5) {
        const a = i<mainCourse.length-1 ? mainCourse[i+1] : q;
        place("step", q[0], q[1], 0.78+rand()*0.22,
              { rot: Math.atan2(a[1]-prev[1], a[0]-prev[0]) + Math.PI/2 + (rand()-0.5)*0.25 });
        acc = 0;
      } else if (acc >= 40 && (nearBridge || onWater)) {
        acc = 0;   // reset stride across the gap so stones resume evenly on the far side
      }
      prev = q;
    }
  }  return { items, streams, swirls: [] };
}

/* Orientation helpers used at build time. */
function nearestOnStreamsList(x, y, streams) {
  let best = null;
  for (const st of streams) for (let i=0;i<st.pts.length-1;i++){
    const ax=st.pts[i][0], ay=st.pts[i][1], abx=st.pts[i+1][0]-ax, aby=st.pts[i+1][1]-ay;
    const L2=abx*abx+aby*aby||1; let t=((x-ax)*abx+(y-ay)*aby)/L2; t=t<0?0:t>1?1:t;
    const px=ax+abx*t, py=ay+aby*t, d=Math.hypot(x-px,y-py);
    if (!best||d<best.d) best={d,x:px,y:py,ang:Math.atan2(aby,abx)};
  }
  return best;
}
function orientFor(type, x, y, streams) {
  // rocks align with nearby flow; trees face open space (rot toward map center-away)
  if (type.startsWith("rock")) {
    const ns = nearestOnStreamsList(x, y, streams);
    if (ns && ns.d < 160) return { rot: ns.ang };
  }
  return {};
}

/* Score a candidate on the six axes; higher is better. */
function scoreCandidate(cand, WW, WH) {
  const its = cand.items;
  if (!its.length) return -1e9;
  // spacing: reward larger nearest-neighbor distances, penalize collisions
  let collisions = 0, nnSum = 0;
  for (let i=0;i<its.length;i++){
    let nn = Infinity;
    for (let j=0;j<its.length;j++) if (i!==j){
      const d = Math.hypot(its[i].x-its[j].x, its[i].y-its[j].y);
      if (d < nn) nn = d;
      if (d < (itemR(its[i]) + itemR(its[j])) * 0.5) collisions++;
    }
    nnSum += Math.min(nn, 300);
  }
  const spacing = nnSum / its.length;                       // ~higher better
  // balance: visual mass on left vs right, top vs bottom — want asymmetric but not lopsided
  let mL=0,mR=0,mT=0,mB=0, mass=0;
  for (const it of its){ const w=visualWeight(it.type,it.scale); mass+=w;
    (it.x<WW/2?mL:mR); if(it.x<WW/2)mL+=w;else mR+=w; if(it.y<WH/2)mT+=w;else mB+=w; }
  const balH = 1 - Math.abs(mL-mR)/(mL+mR||1);              // 1=even
  const balV = 1 - Math.abs(mT-mB)/(mT+mB||1);
  const balance = (balH+balV)/2;
  // negative space: fraction of a coarse grid with no item nearby (target 0.4–0.6)
  const gx=8, gy=12; let empty=0;
  for (let j=0;j<gy;j++) for (let i=0;i<gx;i++){
    const cx=(i+0.5)/gx*WW, cy=(j+0.5)/gy*WH;
    if (its.every((it)=>Math.hypot(it.x-cx, it.y-cy) > 90)) empty++;
  }
  const openFrac = empty/(gx*gy);
  const negSpace = openFrac < 0.4 || openFrac > 0.6 ? 0.3 + (1-Math.abs(openFrac-0.5)/0.5)*0.4 : 1;   // strong reward for 40-60%
  // focal hierarchy: want a clear spread of visual weights (few big, many small)
  const weights = its.map((it)=>visualWeight(it.type,it.scale)).sort((a,b)=>b-a);
  const top = weights.slice(0, Math.max(1,Math.floor(weights.length*0.2)));
  const rest = weights.slice(top.length);
  const hierarchy = rest.length ? Math.min(1, (avg(top)-avg(rest))*2.2) : 0.5;
  // path continuity: reward a decent run of stepping stones
  const steps = its.filter((it)=>it.type==="step").length;
  const pathCont = Math.min(1, steps/12);
  const heaviest = Math.max(...weights);
  const median = weights[Math.floor(weights.length/2)] || 0.01;
  const dominance = Math.min(1, (heaviest - median) * 1.6);   // one element clearly dominant
  const collPenalty = collisions * 0.5;
  return spacing*0.02 + balance*2.0 + negSpace*2.8 + hierarchy*1.8 + dominance*1.6 + pathCont*1.0 - collPenalty;
}
function avg(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }

function randomGarden(redraw = true) {
  const WW = worldW(), WH = worldH();
  let best = null, bestScore = -Infinity, bestSeed = 0;
  const N = 12;   // candidate layouts
  for (let c=0;c<N;c++){
    const seed = Math.floor(Math.random()*1e9);
    const cand = buildCandidate(WW, WH, seed);
    const sc = scoreCandidate(cand, WW, WH);
    if (sc > bestScore) { bestScore = sc; best = cand; bestSeed = seed; }
  }
  // final guard: no non-bridge item may sit on the water
  best.items = best.items.filter((it) => {
    if (it.type === "bridge") return true;
    const gap = it.type === "moss" ? 26 : 30 + (RADII[it.type]||44) * 0.5 * (it.scale||1);
    return Math.min(...best.streams.map((st) => distToPolyline(it.x, it.y, st.pts))) > gap;
  });
  G.items = best.items; G.streams = best.streams; G.swirls = best.swirls; G.rakes = [];
  G.seed = Math.floor(Math.random()*1e5);
  if (redraw) { clampView(); draw(); save(); }
}

/* ============ WEB AUDIO ============ */
/* iPhone notes: (1) audio can only start from a user gesture — we unlock on the
   first touch anywhere; (2) the hardware silent/mute switch silences Web Audio
   entirely — nothing JS can do about that, so the Sound button's toast says so. */
let audioCtx = null;
let sndOn = store(() => localStorage.getItem("zen_sound")) !== "0";
let scrapeNodes = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
document.addEventListener("pointerdown", function unlock() {
  const ac = ensureAudio();
  const b = ac.createBuffer(1, 1, 22050);
  const s = ac.createBufferSource();
  s.buffer = b; s.connect(ac.destination); s.start(0);
  if (musicOn) startMusic();   // browsers only allow audio after a gesture
}, { once: true });

function ensureScrape() {
  const ac = ensureAudio();
  if (scrapeNodes) return scrapeNodes;
  // one looping second of noise; gain stays at 0 until the rake moves
  const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const filter = ac.createBiquadFilter();
  filter.type = "bandpass"; filter.frequency.value = 2400; filter.Q.value = 0.9;
  const gain = ac.createGain(); gain.gain.value = 0;
  src.connect(filter); filter.connect(gain); gain.connect(sfxBus(ac));
  src.start();
  scrapeNodes = { src, filter, gain };
  return scrapeNodes;
}

/* Continuous sand scrape: volume and brightness track drag speed, fading in and
   out smoothly — one sustained sshhh that follows your finger, not blips. */
function scrapeMove(speed, wet) {
  if (!sndOn) return;
  const ac = ensureAudio();
  const n = ensureScrape();
  const now = ac.currentTime;
  n.gain.gain.setTargetAtTime(Math.min(0.22, 0.05 + speed * 0.006), now, 0.04);
  // wet = stream carving: darker, burblier band; dry = sand scrape
  const base = wet ? 620 : 1800, span = wet ? 500 : 2600, k = wet ? 18 : 60;
  n.filter.frequency.setTargetAtTime(base + Math.min(span, speed * k), now, 0.05);
}
function scrapeEnd() {
  if (!scrapeNodes || !audioCtx) return;
  scrapeNodes.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.07);
}

function playClick() {
  // tactile UI click: tight pitched tick with a whisper of noise
  if (!sndOn) return;
  const ac = ensureAudio();
  const now = ac.currentTime;
  thump(ac, now, 2100, 950, 0.03, 0.1);
  noiseBurst(ac, now, 0.014, "highpass", 4500, 1, 0.05);
}

function playRockTap() {
  if (!sndOn) return;
  const ac = ensureAudio();
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  osc.frequency.setValueAtTime(320, now);
  osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.1, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
  osc.connect(gain); gain.connect(sfxBus(ac));
  osc.start(now); osc.stop(now + 0.12);
}

/* ---- Haptics: Android Chrome supports navigator.vibrate; iOS Safari exposes
   no web vibration API at all, so this degrades silently there. ---- */
let sfxGain = null;
function sfxBus(ac) {
  if (!sfxGain) { sfxGain = ac.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(ac.destination); }
  return sfxGain;
}

let lastBuzz = 0;
function buzz(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}
function rakeBuzz() {
  const now = Date.now();
  if (now - lastBuzz > 70) { buzz(5); lastBuzz = now; }
}

/* ---- Per-object placement sounds: each material gets its own voice. ---- */
function noiseBurst(ac, now, dur, filterType, freq, q, level) {
  const src = ac.createBufferSource();
  const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  src.buffer = buf;
  const f = ac.createBiquadFilter();
  f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(level, now);
  g.gain.exponentialRampToValueAtTime(0.005, now + dur);
  src.connect(f); f.connect(g); g.connect(sfxBus(ac));
  src.start(now); src.stop(now + dur);
}
function thump(ac, now, f0, f1, dur, level) {
  const o = ac.createOscillator();
  o.frequency.setValueAtTime(f0, now);
  o.frequency.exponentialRampToValueAtTime(f1, now + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(level, now);
  g.gain.exponentialRampToValueAtTime(0.005, now + dur);
  o.connect(g); g.connect(sfxBus(ac));
  o.start(now); o.stop(now + dur);
}
/* Movie-foley gravel layer: an object set down in gravel is not one noise —
   it is several discrete micro-crunches (stones shifting) over ~100–250 ms,
   heavier objects adding a low displacement rumble and trailing settle ticks. */
function gravelCrunch(ac, now, intensity, heavy) {
  const nTicks = heavy ? 7 : 4 + Math.floor(Math.random() * 2);
  let t = 0;
  for (let i = 0; i < nTicks; i++) {
    const dur = 0.018 + Math.random() * 0.02;
    const src2 = ac.createBufferSource();
    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let k = 0; k < ch.length; k++) ch[k] = Math.random() * 2 - 1;
    src2.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 2600 - i * 220 + Math.random() * 400;   // crunches darken as stones settle
    f.Q.value = 1.1;
    const g = ac.createGain();
    const lvl = intensity * Math.pow(0.82, i);
    g.gain.setValueAtTime(lvl, now + t);
    g.gain.exponentialRampToValueAtTime(0.004, now + t + dur);
    src2.connect(f); f.connect(g); g.connect(sfxBus(ac));
    src2.start(now + t); src2.stop(now + t + dur);
    t += 0.016 + Math.random() * 0.028;
  }
  if (heavy) {
    // low displacement rumble + a sub thud you feel more than hear
    noiseBurst(ac, now, 0.3, "lowpass", 240, 0.6, intensity * 0.9);
    thump(ac, now + 0.01, 70, 36, 0.22, intensity * 1.1);
    // debris settling afterward
    for (const dt of [0.22, 0.31]) {
      noiseBurst(ac, now + dt, 0.03, "bandpass", 1900 + Math.random() * 500, 1.2, intensity * 0.25);
    }
  }
}

function playPlaceSound(type, scale) {
  if (!sndOn) return;
  const ac = ensureAudio();
  const now = ac.currentTime;
  const k = 1.15 - (scale || 1) * 0.25;   // bigger item → deeper voice
  switch (type) {
    case "rock_lg":                       // boulder: full-weight set-down
      gravelCrunch(ac, now, 0.13, true);
      thump(ac, now + 0.015, 150 * k, 38 * k, 0.24, 0.15);
      break;
    case "rock_sm":                       // stone: crisp set with light crunch
      gravelCrunch(ac, now, 0.09, false);
      thump(ac, now + 0.01, 320 * k, 72 * k, 0.1, 0.1);
      break;
    case "rock_flat":                     // flat rock: broad slap into the bed
      gravelCrunch(ac, now, 0.11, false);
      thump(ac, now + 0.01, 240 * k, 52 * k, 0.14, 0.11);
      noiseBurst(ac, now + 0.02, 0.06, "lowpass", 750, 0.7, 0.05);
      break;
    case "bonsai": case "bonsai_c": case "bonsai_p": case "bonsai_w": case "maple":   // pot seats in gravel under a leaf rustle
      gravelCrunch(ac, now + 0.02, 0.07, false);
      noiseBurst(ac, now, 0.2, "bandpass", 4200, 1.6, 0.08);
      thump(ac, now + 0.03, 200 * k, 92 * k, 0.09, 0.06);
      break;
    case "bamboo": case "torii":          // hollow wood knock, light crunch
      gravelCrunch(ac, now + 0.02, 0.08, false);
      thump(ac, now, 470 * k, 205 * k, 0.09, 0.09);
      thump(ac, now + 0.045, 315 * k, 155 * k, 0.07, 0.05);
      break;
    case "bridge":                        // heavy timber set across the banks
      gravelCrunch(ac, now + 0.02, 0.11, true);
      thump(ac, now, 185 * k, 88 * k, 0.13, 0.11);
      thump(ac, now + 0.07, 140 * k, 68 * k, 0.11, 0.07);
      break;
    case "lantern": case "pagoda": {      // stone-on-gravel seat, then the clink
      gravelCrunch(ac, now, 0.1, false);
      for (const [f, d, l] of [[930 * k, 0.07, 0.05], [1410 * k, 0.05, 0.035]]) {
        const o = ac.createOscillator();
        o.frequency.value = f;
        const g = ac.createGain();
        g.gain.setValueAtTime(l, now + 0.03);
        g.gain.exponentialRampToValueAtTime(0.004, now + 0.03 + d);
        o.connect(g); g.connect(sfxBus(ac));
        o.start(now + 0.03); o.stop(now + 0.03 + d);
      }
      thump(ac, now + 0.05, 250 * k, 105 * k, 0.08, 0.05);
      break;
    }
    case "basin": {                       // stone seat, then a water plink
      gravelCrunch(ac, now, 0.1, false);
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(900, now + 0.06);
      o.frequency.exponentialRampToValueAtTime(1500, now + 0.11);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.05, now + 0.06);
      g.gain.exponentialRampToValueAtTime(0.004, now + 0.24);
      o.connect(g); g.connect(sfxBus(ac));
      o.start(now + 0.06); o.stop(now + 0.26);
      break;
    }
    case "moss":                          // soft press, barely disturbing the bed
      gravelCrunch(ac, now, 0.045, false);
      noiseBurst(ac, now, 0.13, "lowpass", 260, 0.7, 0.09);
      break;
    case "step":                          // footpath stone: neat single set
      gravelCrunch(ac, now, 0.08, false);
      thump(ac, now + 0.02, 420 * k, 150 * k, 0.06, 0.07);
      break;
    default:
      gravelCrunch(ac, now, 0.08, false);
      playRockTap();
  }
}

/* ---- Ambient: spa bed — a warm breathing chord pad with the binaural pair
   woven inside it, soft swelled melody tones on a major pentatonic, and warm
   Tibetan bowls as rare accents. The binaural tones sit 8 Hz apart
   (136.1 L / 144.1 R — alpha band, relaxed calm); buried in the pad they read
   as warmth, not a bare hum. Headphones required for the binaural effect. */
let musicOn = store(() => localStorage.getItem("zen_music")) !== "0";
let music = null;

const SPA_SCALE = [220.0, 246.94, 277.18, 329.63, 369.99, 440.0];   // A major pentatonic
const BOWLS = [110, 82.41];   // A2 and E2 — in key with the pad

function bowlStrike(ac, dest, f0, when, level) {
  // warm voicing: gentle shimmer (±0.5 Hz pairs), high partials kept quiet
  const partials = [
    [1.0, 1.0, 13],
    [2.72, 0.3, 9],
    [5.18, 0.1, 6],
  ];
  for (const [ratio, rel, dec] of partials) {
    for (const det of [-0.5, 0.5]) {
      const o = ac.createOscillator();
      o.frequency.value = f0 * ratio + det;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(level * rel * 0.5, when + 0.12);   // soft mallet
      g.gain.exponentialRampToValueAtTime(0.0004, when + dec);
      o.connect(g); g.connect(dest);
      o.start(when); o.stop(when + dec + 0.3);
    }
  }
}

function swellTone(ac, dest, freq, when, level) {
  // spa melody voice: slow-attack sine that blooms and fades, nothing plucked
  const f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 1500; f.Q.value = 0.4;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(level, when + 1.6);
  g.gain.setTargetAtTime(0, when + 2.4, 1.4);
  for (const det of [0, 3]) {
    const o = ac.createOscillator();
    o.type = "sine"; o.frequency.value = freq; o.detune.value = det;
    o.connect(f);
    o.start(when); o.stop(when + 9);
  }
  f.connect(g); g.connect(dest);
}

function startMusic() {
  const ac = ensureAudio();
  if (music) return;
  const master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.setTargetAtTime(0.12, ac.currentTime, 1.5);   // slow fade in

  // warm pad: open fifth + octave (A2 E3 A3), detuned, breathing slowly
  const padFilter = ac.createBiquadFilter();
  padFilter.type = "lowpass"; padFilter.frequency.value = 820; padFilter.Q.value = 0.3;
  const padGain = ac.createGain(); padGain.gain.value = 0.14;
  const breathe = ac.createOscillator(); breathe.frequency.value = 0.035;
  const breatheG = ac.createGain(); breatheG.gain.value = 0.05;
  breathe.connect(breatheG); breatheG.connect(padGain.gain);
  const padOscs = [];
  for (const [freq, lvl] of [[110, 1], [164.81, 0.6], [220, 0.45]]) {
    for (const det of [-3, 3]) {
      const o = ac.createOscillator();
      o.type = "triangle"; o.frequency.value = freq; o.detune.value = det;
      const g = ac.createGain(); g.gain.value = lvl * 0.5;
      o.connect(g); g.connect(padFilter);
      o.start(); padOscs.push(o);
    }
  }
  padFilter.connect(padGain); padGain.connect(master);
  breathe.start(); padOscs.push(breathe);

  // binaural pair, woven quietly under the pad
  const merger = ac.createChannelMerger(2);
  const mkEar = (freq, chn) => {
    const o = ac.createOscillator();
    o.type = "sine"; o.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = 0.02;
    o.connect(g); g.connect(merger, 0, chn);
    o.start();
    return o;
  };
  // pair centered ON A2 so the perceived pitch sits in key; still 8 Hz apart
  const earL = mkEar(106.1, 0);
  const earR = mkEar(114.1, 1);
  merger.connect(master);

  // trickling stream: two narrowband noise voices with independent flutter
  const trickle = ac.createGain(); trickle.gain.value = 0.045;
  const trickleNodes = [];
  for (const [freq, q, lvl, rate] of [[2900, 7, 1, 2.1], [4400, 9, 0.55, 3.4]]) {
    const tb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const tch = tb.getChannelData(0);
    for (let i = 0; i < tch.length; i++) tch[i] = Math.random() * 2 - 1;
    const nsrc = ac.createBufferSource(); nsrc.buffer = tb; nsrc.loop = true;
    const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    const g2 = ac.createGain(); g2.gain.value = lvl * 0.5;
    const flut = ac.createOscillator(); flut.frequency.value = rate;
    const flutG = ac.createGain(); flutG.gain.value = lvl * 0.32;
    flut.connect(flutG); flutG.connect(g2.gain);
    const wander = ac.createOscillator(); wander.frequency.value = 0.13;
    const wanderG = ac.createGain(); wanderG.gain.value = freq * 0.06;
    wander.connect(wanderG); wanderG.connect(f.frequency);
    nsrc.connect(f); f.connect(g2); g2.connect(trickle);
    nsrc.start(); flut.start(); wander.start();
    trickleNodes.push(nsrc, flut, wander);
  }
  trickle.connect(master);

  // gentle melody: a swelled tone every 5–9 s, sometimes echoed an octave up
  const scheduleTone = () => {
    if (!music) return;
    const now = ac.currentTime;
    const f = SPA_SCALE[Math.floor(Math.random() * SPA_SCALE.length)];
    swellTone(ac, master, f, now, 0.16);
    if (Math.random() < 0.25) swellTone(ac, master, f * 2, now + 1.2, 0.07);
    music.timer = setTimeout(scheduleTone, 5000 + Math.random() * 4000);
  };
  // bowls: rare warm accents, one every 22–40 s
  const scheduleBowl = () => {
    if (!music) return;
    bowlStrike(ac, master, BOWLS[Math.floor(Math.random() * BOWLS.length)], ac.currentTime, 0.32);
    music.bowlTimer = setTimeout(scheduleBowl, 22000 + Math.random() * 18000);
  };
  music = { master, earL, earR, padOscs: padOscs.concat(trickleNodes), timer: null, bowlTimer: null };
  music.timer = setTimeout(scheduleTone, 1200);
  music.bowlTimer = setTimeout(scheduleBowl, 7000);
}

function stopMusic() {
  if (!music) return;
  const m = music;
  music = null;
  clearTimeout(m.timer);
  clearTimeout(m.bowlTimer);
  if (audioCtx) {
    m.master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.4);
    setTimeout(() => {
      try {
        m.earL.stop(); m.earR.stop();
        m.padOscs.forEach((o) => o.stop());
        m.master.disconnect();
      } catch (e) {}
    }, 2000);
  }
}

/* ============ SELECTION & RESIZE ============ */
let selectedItem = null;
const sizechip = () => document.getElementById("sizechip");
function showSizeChip(it) {
  const chip = sizechip();
  const sx = (it.x - view.ox) * view.z, sy = (it.y - view.oy) * view.z;
  const r = (RADII[it.type] || 44) * (it.scale || 1) * view.z;
  chip.style.left = Math.max(8, Math.min(W - 130, sx - 60)) + "px";
  chip.style.top = Math.max(8, sy - r - 46) + "px";
  document.getElementById("szLabel").textContent = Math.round((it.scale || 1) * 100) + "%";
  chip.classList.add("show");
}
function hideSizeChip() { selectedItem = null; sizechip().classList.remove("show"); }
function resizeSelected(mult) {
  if (!selectedItem) return;
  selectedItem.scale = Math.max(0.35, Math.min(2.4, (selectedItem.scale || 1) * mult));
  showSizeChip(selectedItem);
  draw(); save();
}
document.getElementById("szUp").addEventListener("click", () => resizeSelected(1.12));
document.getElementById("szDown").addEventListener("click", () => resizeSelected(1 / 1.12));

/* ============ INTERACTIONS ============ */
function pt(e) {
  const r = canvas.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (W / r.width), sy = (e.clientY - r.top) * (H / r.height);
  return { x: view.ox + sx / view.z, y: view.oy + sy / view.z, sx, sy };
}

function hitItem(p) {
  for (let i = G.items.length - 1; i >= 0; i--) {
    if (Math.hypot(p.x - G.items[i].x, p.y - G.items[i].y) < itemR(G.items[i])) return G.items[i];
  }
  return null;
}

/* Lay one stepping stone of a walking path. Real paths set stones with their
   long axis ACROSS the walking direction, each turned a touch differently. */
/* Nearest point + flow direction on any stream. */
function nearestOnStreams(x, y) {
  let best = null;
  for (const st of (G.streams || [])) {
    const pts = st.pts;
    for (let i = 0; i < pts.length - 1; i++) {
      const ax = pts[i][0], ay = pts[i][1];
      const abx = pts[i + 1][0] - ax, aby = pts[i + 1][1] - ay;
      const L2 = abx * abx + aby * aby || 1;
      let t = ((x - ax) * abx + (y - ay) * aby) / L2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ax + abx * t, py = ay + aby * t;
      const d = Math.hypot(x - px, y - py);
      if (!best || d < best.d) best = { d, x: px, y: py, ang: Math.atan2(aby, abx) };
    }
  }
  return best;
}

/* Bridges orient themselves: near water they snap onto the stream, deck
   perpendicular to the flow; on a stone path they align with the walking
   direction of the nearest stones. */
function orientBridge(it) {
  const ns = nearestOnStreams(it.x, it.y);
  if (ns && ns.d < 70) {
    it.x = ns.x; it.y = ns.y;
    it.rot = ns.ang + Math.PI / 2;
    return;
  }
  const steps = G.items
    .filter((s2) => s2.type === "step" && s2 !== it)
    .map((s2) => ({ s2, d: Math.hypot(s2.x - it.x, s2.y - it.y) }))
    .sort((a, b) => a.d - b.d);
  if (steps.length >= 2 && steps[0].d < 60) {
    it.rot = Math.atan2(steps[1].s2.y - steps[0].s2.y, steps[1].s2.x - steps[0].s2.x);
  }
}

function layStone(x, y, pathAngle, d) {
  const stone = {
    id: "z" + Date.now().toString(36) + Math.floor(Math.random() * 1e4),
    type: "step", x, y,
    scale: 0.85 + Math.random() * 0.35,
    rot: pathAngle + Math.PI / 2 + (Math.random() - 0.5) * 0.45,
  };
  G.items.push(stone);
  d.ids.push(stone.id);
  playPlaceSound("step", stone.scale);
  buzz(6);
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    // second finger: abandon any live stroke/drag, start pinch-zoom
    drag = null; scrapeEnd();
    const [a, b] = [...pointers.values()];
    const r = canvas.getBoundingClientRect();
    const mid = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
    pinch = {
      d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      z0: view.z,
      wx: view.ox + mid.x / view.z,
      wy: view.oy + mid.y / view.z,
    };
    return;
  }
  if (pointers.size > 1) return;
  const p = pt(e);
  const now = Date.now();
  const isDbl = (now - lastTap.t < 320) && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 28 / view.z;
  lastTap = { t: now, x: p.x, y: p.y };

  if (isDbl) {
    const it = hitItem(p);
    if (it) { G.items = G.items.filter((x) => x !== it); if (selectedItem === it) hideSizeChip(); draw(); save(); playRockTap(); return; }
  }

  if (tool === "move") {
    const it = hitItem(p);
    if (it) {
      drag = { it, ox: p.x - it.x, oy: p.y - it.y, moved: false, vx: 0, vy: 0 };
      selectedItem = it; showSizeChip(it);
    } else {
      drag = { isPan: true, sx: p.sx, sy: p.sy, ox0: view.ox, oy0: view.oy };
      hideSizeChip();
    }
    canvas.setPointerCapture(e.pointerId);
    return;
  }

  if (tool === "rake") {
    drag = { isRake: true, pts: [[p.x, p.y]], lastPt: [p.x, p.y] };
    canvas.setPointerCapture(e.pointerId);
    scrapeMove(8);
    draw();
    return;
  }

  if (tool === "path") {
    if (G.layMode === "trace") {
      drag = { isTrace: true, target: "path", pts: [[p.x, p.y]], lastPt: [p.x, p.y] };
      canvas.setPointerCapture(e.pointerId);
      draw();
      return;
    }
    drag = { isPath: true, last: [p.x, p.y], ids: [] };
    canvas.setPointerCapture(e.pointerId);
    layStone(p.x, p.y, Math.random() * Math.PI, drag);
    draw();
    return;
  }

  if (tool === "stream") {
    if (G.layMode === "trace") {
      drag = { isTrace: true, target: "stream", pts: [[p.x, p.y]], lastPt: [p.x, p.y] };
      canvas.setPointerCapture(e.pointerId);
      draw();
      return;
    }
    // starting at an existing stream's end continues that stream
    let seed = [[p.x, p.y]];
    for (let i = (G.streams || []).length - 1; i >= 0; i--) {
      const st = G.streams[i];
      const head = st.pts[0], tail = st.pts[st.pts.length - 1];
      if (Math.hypot(p.x - tail[0], p.y - tail[1]) < 60) { seed = st.pts.slice(); G.streams.splice(i, 1); break; }
      if (Math.hypot(p.x - head[0], p.y - head[1]) < 60) { seed = st.pts.slice().reverse(); G.streams.splice(i, 1); break; }
    }
    drag = { isStream: true, pts: seed, lastPt: seed[seed.length - 1].slice(), t0: Date.now() };
    canvas.setPointerCapture(e.pointerId);
    scrapeMove(8, true);
    draw();
    return;
  }

  const newItem = { id: "z" + Date.now().toString(36), type: tool, x: p.x, y: p.y, scale: 0.8 + Math.random() * 0.5 };
  if (newItem.type === "bridge") orientBridge(newItem);
  G.items.push(newItem);
  undoStack.push({ t: "item", id: newItem.id });
  draw(); save();
  playPlaceSound(newItem.type, newItem.scale);
  buzz(12);
});

canvas.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const r = canvas.getBoundingClientRect();
    const mid = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    view.z = Math.min(5, Math.max(1, pinch.z0 * (d / pinch.d0)));
    // keep the world point that started under the fingers under them still
    view.ox = pinch.wx - mid.x / view.z;
    view.oy = pinch.wy - mid.y / view.z;
    clampView();
    scheduleDraw();
    return;
  }

  if (!drag) return;
  const p = pt(e);

  if (drag.isPan) {
    view.ox = drag.ox0 - (p.sx - drag.sx) / view.z;
    view.oy = drag.oy0 - (p.sy - drag.sy) / view.z;
    clampView();
    scheduleDraw();
    return;
  }

  if (drag.isPath) {
    const dx = p.x - drag.last[0], dy = p.y - drag.last[1];
    const dist = Math.hypot(dx, dy);
    if (dist >= 40) {   // realistic stride spacing in world units
      layStone(p.x, p.y, Math.atan2(dy, dx), drag);
      drag.last = [p.x, p.y];
      scheduleDraw();
    }
    return;
  }

  if (drag.isTrace) {
    const dist = Math.hypot(p.x - drag.lastPt[0], p.y - drag.lastPt[1]);
    if (dist > 8 / view.z && drag.pts.length < 220) {
      drag.pts.push([p.x, p.y]);
      drag.lastPt = [p.x, p.y];
      scheduleDraw();
    }
    return;
  }

  if (drag.isStream) {
    const dist = Math.hypot(p.x - drag.lastPt[0], p.y - drag.lastPt[1]);
    if (dist > 10 / view.z && drag.pts.length < 160) {
      drag.pts.push([p.x, p.y]);
      drag.lastPt = [p.x, p.y];
      scrapeMove(dist * view.z, true);   // watery variant
      rakeBuzz();
      scheduleDraw();
    }
    return;
  }

  if (drag.isRake) {
    const dist = Math.hypot(p.x - drag.lastPt[0], p.y - drag.lastPt[1]);
    if (dist > 6 / view.z && drag.pts.length < 200) {
      drag.pts.push([p.x, p.y]);
      drag.lastPt = [p.x, p.y];
      scrapeMove(dist * view.z);   // loudness/brightness follow on-screen speed
      rakeBuzz();
      scheduleDraw();
    }
  } else {
    const dx = p.x - drag.ox, dy = p.y - drag.oy;
    drag.it.x = dx; drag.it.y = dy; drag.moved = true;
    drag.vx = p.x - (drag.lastX || p.x); drag.vy = p.y - (drag.lastY || p.y);
    drag.lastX = p.x; drag.lastY = p.y;
    if (selectedItem === drag.it) showSizeChip(drag.it);
    scheduleDraw();
  }
});

const endDrag = (e) => {
  if (e && pointers.has(e.pointerId)) pointers.delete(e.pointerId);
  if (pinch && pointers.size < 2) pinch = null;
  scrapeEnd();
  if (drag) {
    if (drag.isRake) {
      if (drag.pts.length > 1) {
        G.rakes = G.rakes || [];
        // downsample for field perf, keep the stroke's shape
        const kept = drag.pts.filter((_, i) => i % 2 === 0 || i === drag.pts.length - 1);
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (const q of kept) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
        G.rakes.push({ t: Date.now(), pts: kept, mode: G.rakeMode || "classic", bb: [x0, y0, x1, y1] });
        if (G.rakes.length > 60) G.rakes.shift();   // generous budget; viewport culling keeps it fast
        undoStack.push({ t: "rake" });
        save();
      }
      const wasRake = drag; drag = null;
      if (wasRake.pts.length > 1) draw();
    } else if (drag.isPan) {
      drag = null;
    } else if (drag.isPath) {
      if (drag.ids.length) { undoStack.push({ t: "path", ids: drag.ids }); save(); }
      drag = null;
      draw();
    } else if (drag.isTrace) {
      const tr = drag; drag = null;
      if (tr.pts.length > 2) {
        if (tr.target === "path") {
          // set stones along the traced course at stride spacing
          const d2 = { ids: [] };
          let acc = 0, prev = tr.pts[0];
          layStone(prev[0], prev[1], Math.atan2(tr.pts[1][1] - prev[1], tr.pts[1][0] - prev[0]), d2);
          for (let i = 1; i < tr.pts.length; i++) {
            const q = tr.pts[i];
            const seg = Math.hypot(q[0] - prev[0], q[1] - prev[1]);
            acc += seg;
            if (acc >= 40) {
              layStone(q[0], q[1], Math.atan2(q[1] - prev[1], q[0] - prev[0]), d2);
              acc = 0;
            }
            prev = q;
          }
          undoStack.push({ t: "path", ids: d2.ids });
        } else {
          // set a stream along the traced course (welds onto existing ends)
          commitStreamStroke(tr.pts);
          scrapeMove(20, true); setTimeout(scrapeEnd, 350);
        }
        save();
      }
      draw();
    } else if (drag.isStream) {
      if (drag.pts.length > 2) {
        commitStreamStroke(drag.pts);
        save();
      }
      drag = null;
      draw();
    } else {
      if (drag.moved) {
        if (drag.it && drag.it.type === "bridge") { orientBridge(drag.it); draw(); }
        save();
        settleVel = { vx: drag.vx * 0.5, vy: drag.vy * 0.5, item: drag.it, startTime: Date.now() };
        requestAnimationFrame(animateSettling);
      }
      drag = null;
    }
  }
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// Desktop: wheel zooms around the cursor
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, view.z * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

function refreshChip() { if (selectedItem) showSizeChip(selectedItem); }
document.getElementById("zin").addEventListener("click", () => { zoomAt(W / 2, H / 2, view.z * 1.25); refreshChip(); });
document.getElementById("zout").addEventListener("click", () => { zoomAt(W / 2, H / 2, view.z / 1.25); refreshChip(); });
document.getElementById("zreset").addEventListener("click", () => {
  // return to 1x, centered on the map
  view.z = 1;
  view.ox = (worldW() - W) / 2;
  view.oy = (worldH() - H) / 2;
  clampView();
  draw();
});

function sizeChanged() {
  const WW = worldW(), WH = worldH();
  // shrinking: pull stranded items/swirls back inside; drop fully out-of-bounds strokes
  G.items.forEach((it) => { it.x = Math.min(WW - 60, it.x); it.y = Math.min(WH - 60, it.y); });
  G.swirls.forEach((sw) => { sw.x = Math.min(WW - 30, sw.x); sw.y = Math.min(WH - 30, sw.y); });
  G.rakes = (G.rakes || []).filter((rk) => rk.pts.some((q) => q[0] < WW && q[1] < WH));
  G.streams = (G.streams || []).filter((st) => st.pts.some((q) => q[0] < WW && q[1] < WH));
  clampView();
  draw();
}

function animateSettling() {
  if (!settleVel) return;
  const elapsed = Date.now() - settleVel.startTime;
  if (elapsed > 400) { settleVel = null; return; }
  const decay = 1 - (elapsed / 400);
  settleVel.item.x += settleVel.vx * decay * 0.02;
  settleVel.item.y += settleVel.vy * decay * 0.02;
  draw();
  requestAnimationFrame(animateSettling);
}

/* ============ TOOLBAR ============ */
function selectTool(key) {
  if (key !== "move") hideSizeChip();
  tool = key;
  document.querySelectorAll("[data-tool]").forEach((b) => b.classList.toggle("on", b.dataset.tool === key));
  document.getElementById("rakeopts").classList.toggle("show", key === "rake");
  document.getElementById("layopts").classList.toggle("show", key === "path" || key === "stream");
}

document.querySelectorAll("#layopts [data-lay]").forEach((b) => {
  b.addEventListener("click", () => {
    G.layMode = b.dataset.lay;
    document.querySelectorAll("#layopts [data-lay]").forEach((x) => x.classList.toggle("on", x === b));
    save();
  });
});

// Rake patterns
document.querySelectorAll("#rakeopts [data-rake]").forEach((b) => {
  b.addEventListener("click", () => {
    G.rakeMode = b.dataset.rake;
    document.querySelectorAll("#rakeopts [data-rake]").forEach((x) => x.classList.toggle("on", x === b));
    save();
  });
});

// Undo: last rake stroke or last placed item
document.getElementById("undoBtn").addEventListener("click", () => {
  const a = undoStack.pop();
  if (!a) { toast("Nothing to undo"); return; }
  if (a.t === "rake") {
    G.rakes.pop();
    toast("Stroke undone");
  } else if (a.t === "path") {
    const gone = new Set(a.ids);
    G.items = G.items.filter((it) => !gone.has(it.id));
    toast("Path undone");
  } else if (a.t === "stream") {
    G.streams.pop();
    toast("Stream undone");
  } else if (a.t === "item") {
    G.items = G.items.filter((it) => it.id !== a.id);
    toast("Placement undone");
  }
  draw(); save();
});
// Main-row tools (Rake, Move) — this is what was broken before: these buttons
// had no click handlers, so once you left the rake you could never come back.
document.querySelectorAll("#sheet > .row [data-tool]").forEach((b) => {
  b.addEventListener("click", () => { selectTool(b.dataset.tool); draw(); });
});

// Settings gear shows/hides the full sheet; ＋ shows the object pictures
document.getElementById("settingsBtn").addEventListener("click", (e) => {
  const sh = document.getElementById("sheet");
  sh.classList.toggle("show");
  e.currentTarget.classList.toggle("on", sh.classList.contains("show"));
  resize();
});
document.getElementById("addBtn").addEventListener("click", (e) => {
  const ob = document.getElementById("objbar");
  ob.classList.toggle("show");
  e.currentTarget.classList.toggle("on", ob.classList.contains("show"));
});
// corner Rake / Move
document.querySelectorAll("#corner [data-tool]").forEach((b) => {
  b.addEventListener("click", () => { selectTool(b.dataset.tool); draw(); });
});

const toolrow = document.getElementById("objbar");
const iconCanvases = {};
ITEM_DEFS.forEach((d) => {
  const b = document.createElement("button");
  b.className = "objbtn";
  b.title = `Place a ${d.label.toLowerCase()}`;
  b.dataset.tool = d.key;
  const c2 = document.createElement("canvas");
  c2.width = 80; c2.height = 80;
  iconCanvases[d.key] = c2;
  b.appendChild(c2);
  b.addEventListener("click", () => { selectTool(d.key); draw(); });
  toolrow.appendChild(b);
});

/* Render each object's actual artwork into its button — the icon IS the item. */
function rebuildToolIcons() {
  const keepView = { z: view.z, ox: view.ox, oy: view.oy };
  const keepCtx = ctx;
  for (const d of ITEM_DEFS) {
    const c2 = iconCanvases[d.key];
    const g2 = c2.getContext("2d");
    g2.clearRect(0, 0, 80, 80);
    ctx = g2;
    view.z = 0.62;
    view.ox = -40 / 0.62;         // item at world (0,0) lands at canvas (40, 52)
    view.oy = -52 / 0.62;
    try { drawItem({ id: "icon", type: d.key, x: 0, y: 0, scale: 1 }); } catch (e) {}
  }
  ctx = keepCtx;
  view.z = keepView.z; view.ox = keepView.ox; view.oy = keepView.oy;
}

function togglePanel(btnId, panelId) {
  const btn = document.getElementById(btnId);
  btn.addEventListener("click", () => {
    const panel = document.getElementById(panelId);
    const opening = !panel.classList.contains("open");
    // close the others so the sheet stays compact
    ["tune"].forEach((id) => {
      document.getElementById(id).classList.toggle("open", id === panelId && opening);
    });
    ["tuneBtn"].forEach((id) => {
      document.getElementById(id).classList.toggle("on", id === btnId && opening);
    });
    resize();
  });
}
togglePanel("tuneBtn", "tune");

document.getElementById("random").addEventListener("click", () => { randomGarden(); playClick(); buzz(8); });

const soundBtn = document.getElementById("soundBtn");
soundBtn.classList.toggle("on", sndOn);

const musicBtn = document.getElementById("musicBtn");
musicBtn.classList.toggle("on", musicOn);
musicBtn.addEventListener("click", () => {
  musicOn = !musicOn;
  musicBtn.classList.toggle("on", musicOn);
  store(() => localStorage.setItem("zen_music", musicOn ? "1" : "0"));
  if (musicOn) { startMusic(); toast("Music on"); }
  else { stopMusic(); toast("Music off"); }
});
soundBtn.addEventListener("click", () => {
  sndOn = !sndOn;
  soundBtn.classList.toggle("on", sndOn);
  store(() => localStorage.setItem("zen_sound", sndOn ? "1" : "0"));
  if (sndOn) {
    playRockTap();   // audible confirmation
    toast("Sound on — heard nothing? Flip your phone's silent switch & raise volume.");
  } else {
    scrapeEnd();
    toast("Sound off");
  }
});


function bindSlider(id, key, after) {
  const inp = document.getElementById("s-" + id), out = document.getElementById("o-" + id);
  inp.value = G[key]; out.value = inp.value;
  inp.addEventListener("input", () => { G[key] = Number(inp.value); out.value = inp.value; if (after) after(); });
  inp.addEventListener("change", () => save());
}

/* ============ SAVE / SHARE ============ */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function gardenBlob() {
  return new Promise((res) => {
    // export the whole map regardless of current zoom
    const keep = { z: view.z, ox: view.ox, oy: view.oy };
    view.z = fitZ();
    view.ox = (worldW() - W / view.z) / 2;
    view.oy = (worldH() - H / view.z) / 2;
    draw();
    canvas.toBlob((b) => {
      view.z = keep.z; view.ox = keep.ox; view.oy = keep.oy;
      draw();
      res(b);
    }, "image/png");
  });
}

document.getElementById("save").addEventListener("click", async () => {
  const blob = await gardenBlob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "zen-garden.png";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Saved zen-garden.png");
});

document.getElementById("share").addEventListener("click", async () => {
  const blob = await gardenBlob();
  const file = new File([blob], "zen-garden.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Zen Garden" }); return; } catch (e) {}
  }
  document.getElementById("save").click();
});

/* ============ SIZING ============ */
function resize() {
  const stage = document.getElementById("stage");
  const cssW = stage.clientWidth, cssH = stage.clientHeight;
  if (!cssW || !cssH) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (G) rescale(G.w, G.h, cssW * (G.size || 1), cssH * (G.size || 1));
  W = cssW; H = cssH;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (G) { draw(); save(); }
}

let rsT = null;
window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(resize, 150); });
window.addEventListener("orientationchange", () => { clearTimeout(rsT); rsT = setTimeout(resize, 300); });

/* ============ BOOT ============ */
resize();
load();
document.getElementById("wordmark").textContent = "Zen · v" + BUILD;
document.querySelectorAll("#rakeopts [data-rake]").forEach((b) => b.classList.toggle("on", b.dataset.rake === (G.rakeMode || "classic")));
document.querySelectorAll("#layopts [data-lay]").forEach((b) => b.classList.toggle("on", b.dataset.lay === (G.layMode || "drag")));
rebuildToolIcons();
document.getElementById("rakeopts").classList.toggle("show", tool === "rake");
bindSlider("size", "size", sizeChanged);
bindSlider("items", "autoN");
bindSlider("density", "density", draw);
bindSlider("wiggle", "wiggle", draw);
bindSlider("reach", "reach", draw);
draw();
</script>

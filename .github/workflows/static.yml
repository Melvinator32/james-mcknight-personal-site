# Build and deploy the portfolio to GitHub Pages
# Updated to redeploy the cleaned photo collection
name: Deploy portfolio to Pages

run-name: "${{ github.event_name == 'repository_dispatch' && format('Deploy (demo update - {0})', github.event.client_payload.repo) || 'Deploy portfolio to Pages' }}"

on:
  push:
    branches: ["main"]
  # Fired by the demo app repos when their own main branch changes.
  repository_dispatch:
    types: [demo-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portfolio
        run: pnpm run build
        env:
          # Only needed if a demo app repo is private; public repos clone without it.
          DEMO_REPOS_TOKEN: ${{ secrets.DEMO_REPOS_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
